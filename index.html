<td>0.41 M<\/td><td>8.84 M<\/td><td>15.2×<\/td><\/tr><\/tbody><\/table>\n<blockquote><p><strong>换算比趋近 K² = 16×。<\/strong> 这就是它敢上 10000 的原因 ——<\/p>\n<p>但注意：省下的这部分<strong>本来就不是并行能省的那部分<\/strong>。<\/p><\/blockquote>\n<h3>2. softmax：与 HSTU 的分水岭<\/h3>\n<p>原文公式：<code>Softmax(QKᵀ/√d + M)V<\/code>（cross 与 self 两处都是）。<\/p>\n<p>后果：<\/p>\n<ul>\n<li><code>w<\/code> 依赖键集合 ⇒ <strong>分块不能相加<\/strong><\/li>\n<li>CP 必须做 online softmax / LSE 合并<\/li>\n<li>「三类 GR 都是纯加归约」这句话<strong>在这里不成立<\/strong><\/li>\n<\/ul>\n<p>实测（<code>models/longer_min.py<\/code> 的 <code>[分水岭]<\/code>）：<\/p>\n<pre><code>softmax 行和（全量）   1.000000\nsoftmax 行和（半量）   1.000000\n两段直接相加           2.000000   ← 错，必须按 LSE rescale<\/code><\/pre>\n<h3>3. 扁矩阵：<code>q : L ≈ 1 : 40 ~ 1 : 100<\/code><\/h3>\n<p>query 只有 100~250 个（global token + 从全序列采样的 token），KV 是全长。<\/p>\n<table><thead><tr><th>L<\/th><th>q<\/th><th>q/L<\/th><th>cross pair<\/th><th>merged self pair<\/th><\/tr><\/thead><tbody><tr><td>1000<\/td><td>100<\/td><td>0.10<\/td><td>25 K<\/td><td>0.03 M<\/td><\/tr><tr><td>4000<\/td><td>100<\/td><td>0.025<\/td><td>100 K<\/td><td>0.50 M<\/td><\/tr><tr><td>10000<\/td><td>100<\/td><td>0.010<\/td><td>250 K<\/td><td>3.13 M<\/td><\/tr><tr><td>10000<\/td><td>250<\/td><td>0.025<\/td><td>625 K<\/td><td>3.13 M<\/td><\/tr><\/tbody><\/table>\n<h2>并行含义<\/h2>\n<table><thead><tr><th>轴<\/th><th>结论<\/th><th>原因<\/th><\/tr><\/thead><tbody><tr><td><strong>CP<\/strong><\/td><td><strong>有对象，但收益上限只有 1.2~1.3×<\/strong><\/td><td><code>q·L<\/code> 本来就小 ⇒ Amdahl 上限低<\/td><\/tr><tr><td>TP<\/td><td>可以<\/td><td>常规<\/td><\/tr><tr><td>EP<\/td><td>论文未用<\/td><td>dense；但有 MoE 变体的话可用<\/td><\/tr><tr><td>beam<\/td><td>无关<\/td><td>判别式（ranker），无自回归<\/td><\/tr><\/tbody><\/table>\n<h3>为什么 CP 的上限只有 1.2~1.3×<\/h3>\n<p>切 Q 之后每张卡只剩 <code>q/C<\/code> 个 query：<\/p>\n<ul>\n<li><code>q=100, C=8<\/code> ⇒ 每卡 12 个 query<\/li>\n<li>但 KV 仍要全量（merged self 那一段不能切）<\/li>\n<\/ul>\n<p>⇒ <strong>省的是 <code>q·L<\/code> 里的 <code>q<\/code>，而 KV 读取一点没省<\/strong>。<\/p>\n<p>⇒ 通信 ∝ <code>q·d·h<\/code>，省的是 <code>L/C·d·h<\/code>；比值 ≈ <code>q·C/L ≈ 0.08~0.2<\/code><\/p>\n<p>⇒ <strong>通信只有收益的 1/5 到 1/10<\/strong>，但绝对量都很小。<\/p>\n<h3>容量判据（这是关键）<\/h3>\n<p>合并后的 KV 字节 ≈ <code>L × 1 KB<\/code>（d=32，bf16，32 层）：<\/p>\n<table><thead><tr><th>L<\/th><th>R = L/K<\/th><th>合并 KV<\/th><th>8 GB 预算<\/th><\/tr><\/thead><tbody><tr><td>4096<\/td><td>1024<\/td><td>4.0 MiB<\/td><td>装得下<\/td><\/tr><tr><td>10000<\/td><td>2500<\/td><td>9.8 MiB<\/td><td>装得下<\/td><\/tr><tr><td>32768<\/td><td>8192<\/td><td>32.0 MiB<\/td><td>装得下<\/td><\/tr><tr><td>1000000<\/td><td>250000<\/td><td>977 MiB<\/td><td>装得下<\/td><\/tr><\/tbody><\/table>\n<blockquote><p><strong>要到 L ≈ 800 万才装不下<\/strong>（8 GB 预算）。而 LONGER 的部署长度是 2K~10K。<\/p>\n<p>所以容量判据永远说「不需要切」。<\/p><\/blockquote>\n<h2>那个悖论<\/h2>\n<blockquote><p>**唯一真正需要长序列的模型（LONGER），是唯一需要复杂 CP 的模型；<\/p>\n<p>而 CP 很简单的模型（HSTU），是唯一不需要长序列的模型。**<\/p><\/blockquote>\n<p>机制解释：softmax 提供归一化，使注意力能在「1 个相关 + 9999 个无关」里挑出来 ——<\/p>\n<p>这是长序列<strong>有效<\/strong>的必要条件。纯加归约没有归一化，权重总和随 L 增长，<\/p>\n<p>长距离信号被稀释 ⇒ 只能靠 LayerNorm 兜底。<\/p>\n<p>这条如果成立，能同时解释「HSTU 在 LONGER 的对比表里不如朴素 Transformer」。<\/p>\n<h2>KV cache serving（工程优化）<\/h2>\n<p>论文的一手数字：吞吐降级从 <strong>-40% 降到 -6.8%<\/strong>。<\/p>\n<table><thead><tr><th>做法<\/th><th>计算量<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>每个候选都重算用户序列<\/td><td>候选数 × L<\/td><td>最慢<\/td><\/tr><tr><td>缓存用户序列的 K/V<\/td><td>候选数 × q_cand<\/td><td>快<\/td><\/tr><tr><td>解耦用户侧与候选侧<\/td><td>L 一次 + q_cand 多次<\/td><td>论文方案<\/td><\/tr><\/tbody><\/table>\n<p><strong>这本质上就是「把 self-attn 改写成 cross-attn」<\/strong> —— 与 HyFormer 的<\/p>\n<p>Query Decoding 是同一个技巧（见 <code>09-HyFormer.md<\/code>）。<\/p>\n<h2>常见误解<\/h2>\n<table><thead><tr><th>误解<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td>「LONGER 和 HSTU 一样是纯加归约」<\/td><td><strong>错。LONGER 用 softmax<\/strong><\/td><\/tr><tr><td>「LONGER 证明了长序列无用」<\/td><td>错。历史长度有信号，拐点在 <strong>40%<\/strong>（原文一句话）<\/td><\/tr><tr><td>「LONGER 的 q 小 ⇒ 长序列是假的」<\/td><td>长度 scaling 可能是「看到更多<strong>结构<\/strong>」而非「更多远端 item」<\/td><\/tr><tr><td>「LONGER 需要 CP 才能上 10000」<\/td><td>容量判据：合并 KV ≈ L×1KB，100 万才装不下<\/td><\/tr><\/tbody><\/table>\n<h2>对应代码<\/h2>\n<p><code>models/longer_min.py<\/code><\/p>\n<ul>\n<li>TokenMerge / InnerTrans / MergedSelfAttn / HybridCross 四个类<\/li>\n<li>三段 pair 数的 L 扫描（与全量 self-attn 的对比）<\/li>\n<li><code>q/L<\/code> 的形状表<\/li>\n<li>softmax 分块求和的失败演示（对比 HSTU 的成功）<\/li>\n<li>容量判据的 KV 表<\/li>\n<\/ul>", "code": "\"\"\"LONGER 最小实现 —— 「扁矩阵 + softmax + token merge」。\n\n论文: \"LONGER: Scaling Up Long Sequence Modeling in Industrial Recommenders\"\n      arXiv 2505.04421（RecSys'25，字节）\n\n=======================================================================\n它和 HSTU 的两个致命区别\n=======================================================================\n\n(1) **它用 softmax**（原文公式：Softmax(QKᵀ/√d + M)V）。\n    ⇒ w 依赖键集合 ⇒ 分块不能相加 ⇒ 需要 online softmax / LSE 合并。\n    「三类 GR 都是纯加归约」这句话在这里直接不成立。\n\n(2) **它是扁矩阵**：query 只有 100~250 个，KV 是全长。\n    ⇒ q : L ≈ 1 : 40 ~ 1 : 100\n    ⇒ 能省的绝对工作量是 q·L，本来就比方矩阵的 L² 小两个量级。\n\n=======================================================================\n一个 LONGER 前向的三段注意力，形状完全不同\n=======================================================================\n\n    用户历史 L 个 item\n         │\n    ┌────┴─────────────────────────────────────────┐\n    │ token merge：相邻 K 个合并成 1 个            │\n    │   L -> R = L/K                               │\n    └────┬─────────────────────────────────────────┘\n         │\n    ① inner（组内）：每 K 个原始 token 之间做一层轻量 transformer\n         代价 ∝ R · K² · d = L · K · d      ← 线性于 L\n         只在组内，天然不跨卡 ⇒ 对 CP 完全中立\n\n    ② merged self（合并后）：R 个 token 之间做因果自注意力\n         代价 ∝ R² · d = (L/K)² · d         ← 二次，但 R 已经很小\n\n    ③ hybrid cross：q = 全局 token + 采样 token（100~250） 读合并后的 R\n         代价 ∝ q · R · d                   ← 扁矩阵，带宽主导\n\n=======================================================================\nAmdahl 上限为什么只有 1.2~1.3×\n=======================================================================\n    可切的部分 = q · R · d（cross）+ R² · d（merged self）\n    而 R = L/K 在 K=4、L=10000 时只有 2500，\n    KV 字节 = 2500 · 32 · 2 · 2 = 320 KB/层 —— 单卡绰绰有余。\n    ⇒ 「容量判据」又一次说：不需要切。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom _core import count_pairs, rng, step, table, title\n\n\n# ======================================================================\nclass TokenMerge:\n    \"\"\"相邻 K 个 token → 1 个。论文里是线性投影 + 池化。\"\"\"\n\n    def __init__(self, d: int = 32, K: int = 4):\n        self.d, self.K = d, K\n        self.W = rng(0).normal(0, 1 / np.sqrt(d), (d, d))\n\n    def forward(self, x: np.ndarray) -> np.ndarray:\n        n, d = x.shape\n        assert n % self.K == 0\n        g = x.reshape(n // self.K, self.K, d).mean(axis=1)   # 池化\n        return g @ self.W\n\n\nclass InnerTrans:\n    \"\"\"组内一层 transformer：只让同一组内的 K 个 token 互相看。\n\n    这是 LONGER「把 L² 降到 L·K」的关键：每个 token 只看组内 K-1 个邻居。\n    \"\"\"\n\n    def __init__(self, d: int = 32, K: int = 4):\n        self.d, self.K = d, K\n        s = 1.0 / np.sqrt(d)\n        g = rng(1)\n        self.Wq, self.Wk, self.Wv = (g.normal(0, s, (d, d)) for _ in range(3))\n\n    def forward(self, x: np.ndarray) -> np.ndarray:\n        n, d = x.shape\n        R, K = n // self.K, self.K\n        xg = x.reshape(R, K, d)\n        q = xg @ self.Wq\n        k = xg @ self.Wk\n        v = xg @ self.Wv\n        s = (q @ k.transpose(0, 2, 1)) / np.sqrt(d)          # [R, K, K]\n        s = np.where(np.tril(np.ones((K, K), dtype=bool))[None], s, -1e9)\n        a = _softmax(s)\n        return (a @ v).reshape(n, d)\n\n    def pairs(self, n: int) -> int:\n        R, K = n // self.K, self.K\n        return R * K * (K + 1) // 2\n\n\nclass MergedSelfAttn:\n    \"\"\"合并后序列上的因果自注意力。R² 的那一项。\"\"\"\n\n    def __init__(self, d: int = 32):\n        self.d = d\n        s = 1.0 / np.sqrt(d)\n        g = rng(2)\n        self.Wq, self.Wk, self.Wv = (g.normal(0, s, (d, d)) for _ in range(3))\n\n    def forward(self, x: np.ndarray, causal: bool = True) -> np.ndarray:\n        q, k, v = x @ self.Wq, x @ self.Wk, x @ self.Wv\n        s = (q @ k.T) / np.sqrt(self.d)\n        if causal:\n            s = np.where(np.tril(np.ones_like(s, dtype=bool)), s, -1e9)\n        return _softmax(s) @ v\n\n\nclass HybridCross:\n    \"\"\"全局 token + 采样 token（q 个）对合并后序列（R 个）做交叉注意力。\n\n    **这里用的是 softmax** —— 与 HSTU 的分水岭。\n    \"\"\"\n\n    def __init__(self, d: int = 32, n_query: int = 100):\n        self.d, self.nq = d, n_query\n        s = 1.0 / np.sqrt(d)\n        g = rng(3)\n        self.Wq, self.Wk, self.Wv = (g.normal(0, s, (d, d)) for _ in range(3))\n        self.q_init = g.normal(0, 1, (n_query, d))\n\n    def forward(self, merged: np.ndarray) -> np.ndarray:\n        q = self.q_init @ self.Wq\n        k, v = merged @ self.Wk, merged @ self.Wv\n        return _softmax((q @ k.T) / np.sqrt(self.d)) @ v\n\n\ndef _softmax(x: np.ndarray) -> np.ndarray:\n    m = x.max(axis=-1, keepdims=True)\n    e = np.exp(x - m)\n    return e / e.sum(axis=-1, keepdims=True)\n\n\n# ======================================================================\ndef demo() -> None:\n    title(\"LONGER：扁矩阵 + softmax + token merge\")\n\n    d, K = 32, 4\n    L, nq = 4096, 100\n    x = rng(4).normal(0, 1, (L, d))\n\n    merge = TokenMerge(d, K)\n    inner = InnerTrans(d, K)\n    msa = MergedSelfAttn(d)\n    cross = HybridCross(d, nq)\n\n    merged = merge.forward(x)\n    step(\"原始历史\", L=L, d=d)\n    step(\"token merge\", K=K, R=L // K, note=\"合并后长度\")\n    step(\"inner（组内）\", pairs=inner.pairs(L), note=\"R·K(K+1)/2，线性于 L\")\n    step(\"merged self\", pairs=(L // K) * (L // K + 1) // 2, note=\"R²/2，二次但 R 小\")\n    step(\"hybrid cross\", pairs=nq * (L // K), note=\"q·R，扁矩阵\")\n\n    # 真实前向：inner 在原始 L 上做（组内），然后 merge，再 cross\n    x_inner = inner.forward(x) + x\n    merged = merge.forward(x_inner)\n    y = cross.forward(merged)\n    step(\"inner 输出\", shape=x_inner.shape)\n    step(\"merge 输出\", shape=merged.shape)\n    step(\"cross 输出\", shape=y.shape, note=f\"q={nq} 行，只剩 q 个 token\")\n\n    # ---------------- 与全量 self-attn 的对比 ----------------\n    print(\"\\n  [对比] 同样 L 个 token，全量自注意力要多少 pair：\")\n    rows = []\n    for LL in (1024, 2048, 4096, 8192, 16384):\n        full = LL * (LL + 1) // 2\n        merged_pairs = (LL // K) * (LL // K + 1) // 2\n        inner_p = (LL // K) * K * (K + 1) // 2\n        cross_p = nq * (LL // K)\n        longer = merged_pairs + inner_p + cross_p\n        rows.append((LL, f\"{full/1e6:.2f} M\", f\"{merged_pairs/1e6:.2f} M\",\n                     f\"{inner_p/1e6:.2f} M\", f\"{cross_p/1e6:.2f} M\",\n                     f\"{longer/1e6:.2f} M\", f\"{full/longer:.1f}x\"))\n    print(table(rows, (\"L\", \"全量 self\", \"merged self\", \"inner\", \"cross\",\n                       \"LONGER 合计\", \"省了\")))\n    print(\"     => LONGER 不是「把 L² 变小」，而是「把 L² 换成 (L/K)² + L·K」。\")\n    print(f\"        K={K} 时换算比约 {K}² = {K*K}x，这就是它敢上 10000 的原因。\")\n\n    # ---------------- 关键：q : L ----------------\n    print(\"\\n  [关键] 扁矩阵的形状（决定 CP 有没有对象）：\")\n    rows = []\n    for LL, qq in ((1000, 100), (4000, 100), (10000, 100), (10000, 250)):\n        rows.append((LL, qq, f\"{qq/LL:.4f}\",\n                     f\"{qq*(LL//K)/1e3:.0f} K\",\n                     f\"{(LL//K)*(LL//K+1)//2/1e6:.2f} M\"))\n    print(table(rows, (\"L\", \"q\", \"q/L\", \"cross pair\", \"merged self pair\")))\n    print(\"     => q/L 在 1e-2 量级。切 Q 之后每卡只剩几十个 query，\")\n    print(\"        而 merged KV 仍要全量 ⇒ 省不下大头，还多付固定开销。\")\n    print(\"        这正是 Amdahl 上限只有 1.2~1.3× 的来源。\")\n\n    # ---------------- softmax vs 纯加 ----------------\n    print(\"\\n  [分水岭] LONGER 用 softmax，所以 CP 需要 LSE 合并：\")\n    q = rng(5).normal(0, 1, (2, d))\n    kv = rng(6).normal(0, 1, (64, d))\n    a_full = _softmax((q @ kv.T) / np.sqrt(d))\n    a_half = _softmax((q @ kv[:32].T) / np.sqrt(d))\n    step(\"softmax 行和（全量）\", val=f\"{a_full.sum(-1)[0]:.6f}\")\n    step(\"softmax 行和（半量）\", val=f\"{a_half.sum(-1)[0]:.6f}\")\n    step(\"两段直接相加\", val=f\"{a_half.sum(-1)[0]*2:.6f}\",\n         note=\"错：必须按 LSE rescale\")\n    print(\"     => 对比 HSTU：SiLU 下两段 partial 直接相加就是精确解。\")\n    print(\"        所以 LONGER 是唯一「真的需要复杂 CP」的 GR 模型 ——\")\n    print(\"        而它恰好也是唯一真的需要长序列的模型。这就是那个悖论。\")\n\n    # ---------------- KV 字节：容量判据 ----------------\n    print(\"\\n  [容量判据] 合并后的 KV 有多大（决定要不要切）：\")\n    rows = []\n    for LL in (4096, 10000, 32768, 100000, 1000000):\n        R = LL // K\n        kv_bytes = R * d * 2 * 2 * 32          # R · d · K/V · bf16 · 32 层\n        rows.append((f\"{LL/1000:.0f}K\" if LL >= 1000 else LL, R,\n                     f\"{kv_bytes/1024**2:.1f} MiB\",\n                     \"装得下\" if kv_bytes < 8e9 else \"装不下\"))\n    print(table(rows, (\"L\", \"R = L/K\", \"合并 KV（32 层）\", \"8GB 预算\")))\n    print(\"     => 注意 d=32，所以 KV ≈ L × 1 KB。**要到 L≈800 万才装不下。**\")\n    print(\"        而 LONGER 的部署长度是 2K~10K ⇒ 容量判据永远说「不需要切」。\")\n\n    # ---------------- KV cache serving ----------------\n    print(\"\\n  [KV cache serving] 论文的工程优化（吞吐降级 40% -> 6.8%）：\")\n    rows = [\n        (\"每个候选都重算用户序列\", \"候选数 × L\", \"最慢\"),\n        (\"缓存用户序列的 K/V\", \"候选数 × q_cand\", \"快\"),\n        (\"解耦用户侧与候选侧\", \"L 一次 + q_cand 多次\", \"论文方案\"),\n    ]\n    print(table(rows, (\"做法\", \"计算量\", \"备注\")))\n    print(\"     => 这本质上就是「把 self-attn 改写成 cross-attn」，\")\n    print(\"        与 HyFormer 的 Query Decoding 是同一个技巧（见 09）。\")\n\n\nif __name__ == \"__main__\":\n    demo()\n", "codePath": "models/longer_min.py", "out": "\n==============================================================================\nLONGER：扁矩阵 + softmax + token merge\n==============================================================================\n  原始历史                         L=4096  d=32\n  token merge                  K=4  R=1024  note=合并后长度\n  inner（组内）                    pairs=10240  note=R·K(K+1)/2，线性于 L\n  merged self                  pairs=524800  note=R²/2，二次但 R 小\n  hybrid cross                 pairs=102400  note=q·R，扁矩阵\n  inner 输出                     shape=(4096, 32)\n  merge 输出                     shape=(1024, 32)\n  cross 输出                     shape=(100, 32)  note=q=100 行，只剩 q 个 token\n\n  [对比] 同样 L 个 token，全量自注意力要多少 pair：\nL      全量 self   merged self  inner   cross   LONGER 合计  省了   \n-----  --------  -----------  ------  ------  ---------  -----\n1024   0.52 M    0.03 M       0.00 M  0.03 M  0.06 M     8.6x \n2048   2.10 M    0.13 M       0.01 M  0.05 M  0.19 M     11.2x\n4096   8.39 M    0.52 M       0.01 M  0.10 M  0.64 M     13.2x\n8192   33.56 M   2.10 M       0.02 M  0.20 M  2.32 M     14.4x\n16384  134.23 M  8.39 M       0.04 M  0.41 M  8.84 M     15.2x\n     => LONGER 不是「把 L² 变小」，而是「把 L² 换成 (L/K)² + L·K」。\n        K=4 时换算比约 4² = 16x，这就是它敢上 10000 的原因。\n\n  [关键] 扁矩阵的形状（决定 CP 有没有对象）：\nL      q    q/L     cross pair  merged self pair\n-----  ---  ------  ----------  ----------------\n1000   100  0.1000  25 K        0.03 M          \n4000   100  0.0250  100 K       0.50 M          \n10000  100  0.0100  250 K       3.13 M          \n10000  250  0.0250  625 K       3.13 M          \n     => q/L 在 1e-2 量级。切 Q 之后每卡只剩几十个 query，\n        而 merged KV 仍要全量 ⇒ 省不下大头，还多付固定开销。\n        这正是 Amdahl 上限只有 1.2~1.3× 的来源。\n\n  [分水岭] LONGER 用 softmax，所以 CP 需要 LSE 合并：\n  softmax 行和（全量）               val=1.000000\n  softmax 行和（半量）               val=1.000000\n  两段直接相加                       val=2.000000  note=错：必须按 LSE rescale\n     => 对比 HSTU：SiLU 下两段 partial 直接相加就是精确解。\n        所以 LONGER 是唯一「真的需要复杂 CP」的 GR 模型 ——\n        而它恰好也是唯一真的需要长序列的模型。这就是那个悖论。\n\n  [容量判据] 合并后的 KV 有多大（决定要不要切）：\nL      R = L/K  合并 KV（32 层）  8GB 预算\n-----  -------  -----------  ------\n4K     1024     4.0 MiB      装得下   \n10K    2500     9.8 MiB      装得下   \n33K    8192     32.0 MiB     装得下   \n100K   25000    97.7 MiB     装得下   \n1000K  250000   976.6 MiB    装得下   \n     => 注意 d=32，所以 KV ≈ L × 1 KB。**要到 L≈800 万才装不下。**\n        而 LONGER 的部署长度是 2K~10K ⇒ 容量判据永远说「不需要切」。\n\n  [KV cache serving] 论文的工程优化（吞吐降级 40% -> 6.8%）：\n做法           计算量               备注  \n-----------  ----------------  ----\n每个候选都重算用户序列  候选数 × L           最慢  \n缓存用户序列的 K/V  候选数 × q_cand      快   \n解耦用户侧与候选侧    L 一次 + q_cand 多次  论文方案\n     => 这本质上就是「把 self-attn 改写成 cross-attn」，\n        与 HyFormer 的 Query Decoding 是同一个技巧（见 09）。\r\n"}, {"id": "hyformer", "group": "模型", "title": "HyFormer", "blurb": "16 个 query 读整段 ⇒ 算便宜、读贵", "body": "<h1>09 · HyFormer<\/h1>\n<blockquote><p><strong>一句话<\/strong>：用 <strong>16 个 query<\/strong> 去读整段历史。<\/p>\n<p>于是「算」变得很便宜，「读」变成唯一瓶颈 —— 这是 <strong>LLM decode 的形状被搬进了推荐<\/strong>。<\/p><\/blockquote>\n<h2>论文<\/h2>\n<ul>\n<li>*HyFormer: Revisiting the Roles of Sequence Modeling and Feature Interaction<\/li>\n<\/ul>\n<p>  in CTR Prediction*, <strong>arXiv 2601.12681<\/strong>（SIGIR'26）<\/p>\n<h2>结构<\/h2>\n<pre><code> 非序列特征 (M 个)                 长行为序列 (L)\n      │                                 │\n      │   MLP 生成 N 个 semantic query   │\n      ▼                                 ▼\n  Q ∈ [N, d]  ────────► ① Query Decoding ◄──── K,V ∈ [L, d]\n                              CrossAttn(N, L)\n                                 │\n                                 ▼  [N, d]\n                     ┌───────────┴───────────┐\n                     │ ② Query Boosting      │\n                     │  Q&#x27; = [Q | NS tokens] │  T = N + M\n                     │  ① MLP-Mixer 式转置    │  ← 零参数、零 FLOPs\n                     │  ② per-token FFN       │  ← 每个 token 一套参数\n                     └───────────┬───────────┘\n                                 ▼\n                          下一层（stacked）<\/code><\/pre>\n<p><strong>两个模块交替，一层就是一次「读序列 → 混特征」。<\/strong><\/p>\n<h2>三个机制<\/h2>\n<h3>1. Query Decoding：<code>q<\/code> 极小<\/h3>\n<p><code>N ≈ 16<\/code>，<code>L<\/code> 可达上万 ⇒ <strong><code>q/L ≈ 1e-3<\/code><\/strong>，是七个模型里最小的。<\/p>\n<p>代价 <code>∝ N·L·d<\/code>，看起来「很便宜」—— 但它便宜的原因是<strong>把工作搬给了读取<\/strong>：<\/p>\n<pre><code>算的部分  ∝ N · L · d      （N 小 → 小）\n读的部分  ∝ L · d · bytes  （L 大 → 带宽主导）<\/code><\/pre>\n<p><strong>闭式结论<\/strong>（<code>models/hyformer_min.py<\/code> 验证）：<\/p>\n<pre><code>t_算 / t_读 = N · BW / (2 · F)      与 L、d 都无关<\/code><\/pre>\n<p>N=16、BW=800GB/s、F=150TFLOPS ⇒ 比值 <strong>0.043<\/strong>，即读是算的 23 倍。<\/p>\n<table><thead><tr><th>L<\/th><th>pair<\/th><th>计算<\/th><th>KV 读取<\/th><th>读耗时<\/th><th>读/算<\/th><\/tr><\/thead><tbody><tr><td>512<\/td><td>8 K<\/td><td>0.01 us<\/td><td>0.1 MiB<\/td><td>0.12 us<\/td><td>23×<\/td><\/tr><tr><td>4096<\/td><td>66 K<\/td><td>0.04 us<\/td><td>0.8 MiB<\/td><td>0.98 us<\/td><td>23×<\/td><\/tr><tr><td>65536<\/td><td>1049 K<\/td><td>0.67 us<\/td><td>12.0 MiB<\/td><td>15.73 us<\/td><td>23×<\/td><\/tr><\/tbody><\/table>\n<p>（单层单样本；乘上 层数×batch 才是整网，但比值不变。）<\/p>\n<h3>2. N 越多并不更慢（在读主导区间）<\/h3>\n<table><thead><tr><th>N<\/th><th>pair @ L=16K<\/th><th>计算<\/th><th>读<\/th><th>算/读<\/th><\/tr><\/thead><tbody><tr><td>8<\/td><td>131 K<\/td><td>0.08 us<\/td><td>3.93 us<\/td><td>0.02<\/td><\/tr><tr><td>16<\/td><td>262 K<\/td><td>0.17 us<\/td><td>3.93 us<\/td><td>0.04<\/td><\/tr><tr><td>128<\/td><td>2097 K<\/td><td>1.34 us<\/td><td>3.93 us<\/td><td>0.34<\/td><\/tr><tr><td>512<\/td><td>8389 K<\/td><td>5.37 us<\/td><td>3.93 us<\/td><td>1.37<\/td><\/tr><\/tbody><\/table>\n<p>N 涨 64 倍，总时间只涨约 1.34 倍。<\/p>\n<blockquote><p><strong>这与 LONGER 恰好相反<\/strong>：那边减少 <code>q<\/code>（250→100）可以省 46% FLOPs。<\/p>\n<p>HyFormer 的 <code>q<\/code> 优化是白费力气，因为瓶颈在读取。<\/p><\/blockquote>\n<h3>3. Query Boosting = RankMixer 的两个部件<\/h3>\n<ul>\n<li><strong>MLP-Mixer 式 token mixing<\/strong>：零参数转置（与 RankMixer 的 MHTM 完全相同）<\/li>\n<li><strong>per-token FFN<\/strong>：每个 token 一套参数（参数量 ×T，FLOPs 不变）<\/li>\n<\/ul>\n<p>论文明确写了 \"inspired by RankMixer (Zhu et al., 2025)\"。<\/p>\n<p>所以 <code>03-RankMixer.md<\/code> 里的机制分析可以直接搬过来。<\/p>\n<h2>一个容易混的点：两段交叉注意力<\/h2>\n<table><thead><tr><th>阶段<\/th><th>Q<\/th><th>KV<\/th><th>代价<\/th><th>扫描时动谁<\/th><\/tr><\/thead><tbody><tr><td><code>decode<\/code><\/td><td>short_len (~16)<\/td><td>short_len (~16)<\/td><td>两段都小，几乎不计<\/td><td>Q 与 KV 一起变<\/td><\/tr><tr><td><code>seq_cross<\/code><\/td><td>short_len (~16)<\/td><td>kv_len (可达 8K)<\/td><td><code>∝ short_len · kv_len<\/code><\/td><td>只有 KV 变<\/td><\/tr><\/tbody><\/table>\n<p><strong>这个差异是「辨识」的关键<\/strong>：扫 <code>short_len<\/code> 时两段一起动，扫 <code>kv_len<\/code> 时只有<\/p>\n<p><code>seq_cross<\/code> 动。自变量不成比例，才有独立信息（对应 <code>执行时间预测<\/code> 里的辨识分析）。<\/p>\n<h2>并行含义<\/h2>\n<table><thead><tr><th>轴<\/th><th>结论<\/th><th>原因<\/th><\/tr><\/thead><tbody><tr><td><strong>CP<\/strong><\/td><td><strong>真的有用，但只是延迟<\/strong><\/td><td><code>q/L≈1e-3<\/code> ⇒ 算的少、读的多 ⇒ 切 KV 是唯一出路<\/td><\/tr><tr><td>TP<\/td><td>有用<\/td><td>切 d，同时减轻权重与 KV 带宽<\/td><\/tr><tr><td>EP<\/td><td>仅当 MoE<\/td><td>原论文是 dense LRM，没有专家<\/td><\/tr><tr><td>beam<\/td><td>不适用<\/td><td>判别式，没有自回归 decode<\/td><\/tr><\/tbody><\/table>\n<h3>CP 在这里买到的是什么<\/h3>\n<p>切 KV 之后（C=2/4/8，P=32K）：<\/p>\n<table><thead><tr><th>C<\/th><th>计算 us<\/th><th>读 us<\/th><th>合并 us<\/th><th>合计 us<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0.34<\/td><td>7.86<\/td><td>0.02<\/td><td>8.22<\/td><\/tr><tr><td>2<\/td><td>0.17<\/td><td>3.93<\/td><td>0.02<\/td><td>4.12<\/td><\/tr><tr><td>4<\/td><td>0.08<\/td><td>1.97<\/td><td>0.02<\/td><td>2.07<\/td><\/tr><tr><td>8<\/td><td>0.04<\/td><td>0.98<\/td><td>0.02<\/td><td>1.04<\/td><\/tr><\/tbody><\/table>\n<p>时间确实按 <code>1/C<\/code> 降，但<strong>降的是读取，不是算力<\/strong>。<\/p>\n<blockquote><p><strong>它买到的是 TPOT 上界，不是吞吐。<\/strong><\/p>\n<p>这与 LONGER 的 1.2~1.3× Amdahl 是<strong>两种不同的收益<\/strong>，不能混着说。<\/p><\/blockquote>\n<p>这正是 Medha 的 KVP 的适用场景 —— 也说明 **HyFormer 是七个模型里唯一<\/p>\n<p>「CP 有真实正面价值」的判别式模型**（HSTU/MTGR 的容量判据说不需要）。<\/p>\n<h2>常见误解<\/h2>\n<table><thead><tr><th>误解<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td>「HyFormer 的 attention 便宜，所以不需要并行」<\/td><td>便宜的是<strong>算<\/strong>；读是瓶颈，CP 正是切读<\/td><\/tr><tr><td>「q 小 ⇒ 和 LONGER 一样没法 CP」<\/td><td>不一样。LONGER 是算主导（q·L），HyFormer 是读主导<\/td><\/tr><tr><td>「Query Boosting 是新机制」<\/td><td>就是 RankMixer 的 MHTM + per-token FFN<\/td><\/tr><tr><td>「两段 cross-attn 可以合并算」<\/td><td>KV 长度不同（short_len vs kv_len），必须分开<\/td><\/tr><\/tbody><\/table>\n<h2>对应代码<\/h2>\n<p><code>models/hyformer_min.py<\/code><\/p>\n<ul>\n<li><code>QueryDecoding<\/code> / <code>MultiHeadTokenMixing<\/code> / <code>PerTokenFFN<\/code> / <code>QueryBoosting<\/code> / <code>HyFormerLayer<\/code><\/li>\n<li>算 vs 读的比值闭式（<code>N·BW/(2F)<\/code>）与实测表<\/li>\n<li>N 的敏感性（64 倍 N 只涨 1.34 倍）<\/li>\n<li>CP 的 <code>1/C<\/code> 曲线（降的是读取）<\/li>\n<li>两段 cross-attn 的对照<\/li>\n<\/ul>", "code": "\"\"\"HyFormer 最小实现 —— 「用十几个 query 读整段历史」。\n\n论文: \"HyFormer: Revisiting the Roles of Sequence Modeling and Feature\n      Interaction in CTR Prediction\", arXiv 2601.12681（SIGIR'26）\n\n=======================================================================\n它把「序列建模」和「特征交叉」缝进了同一个 block\n=======================================================================\n\n每一层两个模块，交替：\n\n  ① Query Decoding（序列建模）\n       Q  = N 个 semantic query（由非序列特征 MLP 生成，N 很小，~16）\n       K,V= 长行为序列的逐层投影\n       Q ← CrossAttn(Q, K, V)                ← 代价 ∝ N · L · d\n\n  ② Query Boosting（特征交叉）\n       Q' = [Q | 非序列特征 token]            ← T = N + M 个\n       Q' ← MLP-Mixer 式 token mixing         ← **零参数、零 FLOPs**\n       Q' ← per-token FFN                     ← 代价 ∝ T · d · d_ff\n\n=======================================================================\n为什么它和前面所有模型都不一样\n=======================================================================\n\n  **q : L 是四个模型里最小的。** N≈16，L 可达上万 ⇒ q/L ≈ 1e-3。\n\n  于是 Query Decoding 的代价 ∝ N·L 很小，但那**不是因为它便宜，\n  而是因为它把大部分工作搬给了「读 KV」**：\n      算的部分   ∝ N · L · d      （N 小 → 小）\n      读的部分   ∝ L · d · bytes  （L 大 → 带宽主导）\n\n  ⇒ 这是唯一一个「计算不贵、带宽贵」的模型。\n  ⇒ 也是唯一一个 CP（切 KV）**真的有用**、但**不带来算力收益**的模型。\n     它买的是 TPOT 上界，不是 FLOPs。\n\n  这正是 Medha 的 KVP 的适用场景，也是 LLM decode 的形态。\n  HyFormer 等于「把 LLM decode 的那个形状搬到了推荐里」。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom _core import rng, step, table, title\n\n\ndef _softmax(x: np.ndarray) -> np.ndarray:\n    m = x.max(axis=-1, keepdims=True)\n    e = np.exp(x - m)\n    return e / e.sum(axis=-1, keepdims=True)\n\n\n# ======================================================================\nclass QueryDecoding:\n    \"\"\"CrossAttn(Q: N 个 query, K/V: L 长的行为序列)。\"\"\"\n\n    def __init__(self, d: int = 48, n_query: int = 16):\n        self.d, self.N = d, n_query\n        s = 1.0 / np.sqrt(d)\n        g = rng(0)\n        self.Wq, self.Wk, self.Wv = (g.normal(0, s, (d, d)) for _ in range(3))\n\n    def forward(self, q_tokens: np.ndarray, seq: np.ndarray) -> np.ndarray:\n        q = q_tokens @ self.Wq\n        k, v = seq @ self.Wk, seq @ self.Wv\n        return q_tokens + _softmax((q @ k.T) / np.sqrt(self.d)) @ v\n\n    def cost(self, L: int) -> tuple[int, int]:\n        \"\"\"返回 (pair 数, KV 读取的元素数)。两者是不同的东西。\"\"\"\n        return self.N * L, L * self.d\n\n\nclass MultiHeadTokenMixing:\n    \"\"\"与 RankMixer 完全相同的零参数转置。\"\"\"\n\n    def __init__(self, T: int, d: int, H: int | None = None):\n        self.T, self.d, self.H = T, d, H or T\n\n    def forward(self, x: np.ndarray) -> np.ndarray:\n        T, d, H = self.T, self.d, self.H\n        assert d % H == 0 and x.shape[0] == T\n        return x.reshape(T, H, d // H).transpose(1, 0, 2).reshape(H, T * d // H)\n\n\nclass PerTokenFFN:\n    def __init__(self, T: int, d: int, k: int = 4):\n        self.d, self.k = d, k\n        s = 1.0 / np.sqrt(d)\n        g = rng(1)\n        self.W1 = g.normal(0, s, (T, d, k * d))\n        self.W2 = g.normal(0, s, (T, k * d, d))\n\n    def forward(self, x: np.ndarray) -> np.ndarray:\n        h = np.einsum(\"td,tdk->tk\", x, self.W1)\n        h = h / (1.0 + np.exp(-h))\n        return np.einsum(\"tk,tkd->td\", h, self.W2)\n\n\nclass QueryBoosting:\n    \"\"\"MLP-Mixer 式 token mixing + per-token FFN。\"\"\"\n\n    def __init__(self, T: int, d: int):\n        self.mix = MultiHeadTokenMixing(T, d)\n        self.ffn = PerTokenFFN(T, d)\n\n    def forward(self, x: np.ndarray) -> np.ndarray:\n        s = self.mix.forward(x)\n        return x + self.ffn.forward(s)\n\n\nclass HyFormerLayer:\n    def __init__(self, d: int = 48, n_query: int = 16, n_ns: int = 8):\n        self.d, self.N, self.M = d, n_query, n_ns\n        self.dec = QueryDecoding(d, n_query)\n        self.boost = QueryBoosting(n_query + n_ns, d)\n\n    def forward(self, q: np.ndarray, seq: np.ndarray) -> np.ndarray:\n        q = self.dec.forward(q, seq)                      # ① 读序列\n        q_ns = np.concatenate([q, self.ns], 0)            # ② 拼上非序列特征\n        q_ns = self.boost.forward(q_ns)                   #    转置 + 逐 token FFN\n        return q_ns[: self.N]\n\n\n# ======================================================================\ndef demo() -> None:\n    title(\"HyFormer：q 只有 16 个，所以廉价的是算、昂贵的是读\")\n\n    d, N, M, L = 48, 16, 8, 4096   # d 必须能被 T=N+M 整除（H=T）\n    dec = QueryDecoding(d, N)\n    boost = QueryBoosting(N + M, d)\n\n    q = rng(2).normal(0, 1, (N, d))\n    seq = rng(3).normal(0, 1, (L, d))\n    out = dec.forward(q, seq)\n    step(\"非序列 query\", shape=q.shape, note=f\"N={N}\")\n    step(\"行为序列\", shape=seq.shape, note=f\"L={L}\")\n    step(\"Query Decoding 输出\", shape=out.shape)\n    step(\"Query Boosting 输出\", shape=boost.forward(np.concatenate([out, np.zeros((M, d))], 0)).shape)\n\n    # ---------------- 算 vs 读 ----------------\n    F_EFF, BW = 150e12, 800e9        # 有效算力（FLOP/s）、HBM 带宽（B/s）\n\n    print(\"\\n  [核心] Query Decoding 里，「算」与「读」随 L 的走势不同\")\n    print(\"         （下表是**单层单样本**；乘上 层数×batch 才是整网，但比值不变）：\")\n    rows = []\n    for LL in (512, 1024, 4096, 16384, 65536):\n        pairs, _ = dec.cost(LL)\n        t_compute = 2 * pairs * d / F_EFF * 1e6            # us\n        t_read = 4 * LL * d / BW * 1e6                     # K+V，bf16\n        rows.append((LL, f\"{pairs/1e3:.0f} K\", f\"{t_compute:.2f} us\",\n                     f\"{4*LL*d/1024**2:.1f} MiB\", f\"{t_read:.2f} us\",\n                     f\"{t_read/t_compute:.0f}x\"))\n    print(table(rows, (\"L\", \"pair\", \"计算\", \"KV 读取\", \"读耗时\", \"读/算\")))\n    print(\"     => **两条线都 ∝ L，比值却是常数**：\")\n    print(\"            t_算 / t_读 = N · BW / (2 · F)   （与 L、d 都无关）\")\n    print(f\"            N=16, BW=800GB/s, F=150TFLOPS  ->  {(16*BW/(2*F_EFF)):.3f}\")\n    print(\"        所以读永远主导，且 N 越小越糟。这就是 LLM decode 的形状（q=1）。\")\n\n    # ---------------- N 的敏感性 ----------------\n    print(\"\\n  [N 的作用] query 数只动「算」端，改不了「读」端：\")\n    rows = []\n    t_read = 4 * 16384 * d / BW * 1e6\n    for NN in (8, 16, 32, 128, 512):\n        pairs = NN * 16384\n        t_compute = 2 * pairs * d / F_EFF * 1e6\n        rows.append((NN, f\"{pairs/1e3:.0f} K\", f\"{t_compute:.2f} us\",\n                     f\"{t_read:.2f} us\",\n                     f\"{t_compute/t_read:.2f}\"))\n    print(table(rows, (\"N\", \"pair @ L=16K\", \"计算\", \"读\", \"算/读\")))\n    print(\"     => N 从 8 到 512（64 倍），总时间只从 ~1.00 涨到 ~1.34 倍。\")\n    print(\"        因为读那一端没变。所以「优化 query 数」在这里是白费力气 ——\")\n    print(\"        与 LONGER 恰好相反（那边减少 q 能省 46% FLOPs）。\")\n\n    # ---------------- CP 对它的意义 ----------------\n    print(\"\\n  [CP 的意义] 切 KV 之后，两条线怎么变：\")\n    rows = []\n    for C in (1, 2, 4, 8):\n        P = 32768\n        t_compute = 2 * (N * P / C) * d / F_EFF * 1e6\n        t_read = 4 * (P / C) * d / BW * 1e6\n        t_merge = N * d * 4 / 200e9 * 1e6           # LSE 合并，∝ N·d，与 P 无关\n        rows.append((C, f\"{t_compute:.2f}\", f\"{t_read:.2f}\",\n                     f\"{t_merge:.2f}\", f\"{t_compute+t_read+t_merge:.2f}\"))\n    print(table(rows, (\"C\", \"计算 us\", \"读 us\", \"合并 us\", \"合计 us\")))\n    print(\"     => 时间确实按 1/C 降，但**降的是读取，不是算力**。\")\n    print(\"        所以它买到的是「TPOT 上界」，不是「吞吐」。\")\n    print(\"        这与 LONGER 的 1.2~1.3× Amdahl 是两种不同的收益，别混。\")\n\n    # ---------------- 两段交叉注意力的形状 ----------------\n    print(\"\\n  [易混点] HyFormer 有两段交叉注意力，KV 来源不同：\")\n    rows = [\n        (\"decode\", \"short_len (~16)\", \"short_len (~16)\", \"两段都小，几乎不计\",\n         \"Q 与 KV 一起变\"),\n        (\"seq_cross\", \"short_len (~16)\", \"kv_len (可达 8K)\", \"∝ short_len · kv_len\",\n         \"只有 KV 变\"),\n    ]\n    print(table(rows, (\"阶段\", \"Q\", \"KV\", \"代价\", \"扫描时动谁\")))\n    print(\"     => 扫 short_len 时两段一起动，扫 kv_len 时只有 seq_cross 动。\")\n    print(\"        这个差异是「辨识」的关键：自变量不成比例，才有独立信息。\")\n\n    # ---------------- 并行含义 ----------------\n    print(\"\\n  [并行含义]：\")\n    rows = [\n        (\"CP\", \"**真的有用，但只是延迟**\", \"q/L≈1e-3 ⇒ 算的少；读的多 ⇒ 切 KV 是唯一出路\"),\n        (\"TP\", \"有用\", \"切 d，减轻权重与 KV 带宽\"),\n        (\"EP\", \"仅当 MoE\", \"原论文是 dense LRM，没有专家\"),\n        (\"beam\", \"不适用\", \"判别式，没有自回归 decode\"),\n    ]\n    print(table(rows, (\"轴\", \"结论\", \"原因\")))\n\n\nif __name__ == \"__main__\":\n    demo()\n", "codePath": "models/hyformer_min.py", "out": "\n==============================================================================\nHyFormer：q 只有 16 个，所以廉价的是算、昂贵的是读\n==============================================================================\n  非序列 query                    shape=(16, 48)  note=N=16\n  行为序列                         shape=(4096, 48)  note=L=4096\n  Query Decoding 输出            shape=(16, 48)\n  Query Boosting 输出            shape=(24, 48)\n\n  [核心] Query Decoding 里，「算」与「读」随 L 的走势不同\n         （下表是**单层单样本**；乘上 层数×batch 才是整网，但比值不变）：\nL      pair    计算       KV 读取     读耗时       读/算\n-----  ------  -------  --------  --------  ---\n512    8 K     0.01 us  0.1 MiB   0.12 us   23x\n1024   16 K    0.01 us  0.2 MiB   0.25 us   23x\n4096   66 K    0.04 us  0.8 MiB   0.98 us   23x\n16384  262 K   0.17 us  3.0 MiB   3.93 us   23x\n65536  1049 K  0.67 us  12.0 MiB  15.73 us  23x\n     => **两条线都 ∝ L，比值却是常数**：\n            t_算 / t_读 = N · BW / (2 · F)   （与 L、d 都无关）\n            N=16, BW=800GB/s, F=150TFLOPS  ->  0.043\n        所以读永远主导，且 N 越小越糟。这就是 LLM decode 的形状（q=1）。\n\n  [N 的作用] query 数只动「算」端，改不了「读」端：\nN    pair @ L=16K  计算       读        算/读 \n---  ------------  -------  -------  ----\n8    131 K         0.08 us  3.93 us  0.02\n16   262 K         0.17 us  3.93 us  0.04\n32   524 K         0.34 us  3.93 us  0.09\n128  2097 K        1.34 us  3.93 us  0.34\n512  8389 K        5.37 us  3.93 us  1.37\n     => N 从 8 到 512（64 倍），总时间只从 ~1.00 涨到 ~1.34 倍。\n        因为读那一端没变。所以「优化 query 数」在这里是白费力气 ——\n        与 LONGER 恰好相反（那边减少 q 能省 46% FLOPs）。\n\n  [CP 的意义] 切 KV 之后，两条线怎么变：\nC  计算 us  读 us  合并 us  合计 us\n-  -----  ----  -----  -----\n1  0.34   7.86  0.02   8.22 \n2  0.17   3.93  0.02   4.12 \n4  0.08   1.97  0.02   2.07 \n8  0.04   0.98  0.02   1.04 \n     => 时间确实按 1/C 降，但**降的是读取，不是算力**。\n        所以它买到的是「TPOT 上界」，不是「吞吐」。\n        这与 LONGER 的 1.2~1.3× Amdahl 是两种不同的收益，别混。\n\n  [易混点] HyFormer 有两段交叉注意力，KV 来源不同：\n阶段         Q                KV               代价                    扫描时动谁     \n---------  ---------------  ---------------  --------------------  ----------\ndecode     short_len (~16)  short_len (~16)  两段都小，几乎不计             Q 与 KV 一起变\nseq_cross  short_len (~16)  kv_len (可达 8K)   ∝ short_len · kv_len  只有 KV 变   \n     => 扫 short_len 时两段一起动，扫 kv_len 时只有 seq_cross 动。\n        这个差异是「辨识」的关键：自变量不成比例，才有独立信息。\n\n  [并行含义]：\n轴     结论              原因                             \n----  --------------  -------------------------------\nCP    **真的有用，但只是延迟**  q/L≈1e-3 ⇒ 算的少；读的多 ⇒ 切 KV 是唯一出路\nTP    有用              切 d，减轻权重与 KV 带宽                \nEP    仅当 MoE          原论文是 dense LRM，没有专家            \nbeam  不适用             判别式，没有自回归 decode               \n"}, {"id": "onerec", "group": "模型", "title": "OpenOneRec", "blurb": "3-token 自回归 ⇒ q = B", "body": "<h1>04 · OpenOneRec / OneRec<\/h1>\n<blockquote><p><strong>一句话<\/strong>：把推荐变成一个 3-token 的自回归生成问题，<\/p>\n<p>于是它是这四个模型里<strong>唯一有 beam 这一维<\/strong>的，也是唯一让 <code>q<\/code> 变大的。<\/p><\/blockquote>\n<h2>论文<\/h2>\n<ul>\n<li>*OneRec: Unifying Retrieve and Rank with Generative Recommender and Preference<\/li>\n<\/ul>\n<p>  Alignment*, <strong>arXiv 2502.18965<\/strong>（快手）<\/p>\n<ul>\n<li><em>OneRec Technical Report<\/em>, <strong>arXiv 2506.13695<\/strong><\/li>\n<li><em>OpenOneRec Technical Report<\/em>, <strong>arXiv 2512.24762<\/strong>（开源版 + benchmark）<\/li>\n<\/ul>\n<h2>结构<\/h2>\n<pre><code>  用户行为历史 (L 个 item)                     候选 SID\n        │                                        │\n        ▼                                        │\n  ┌──────────────┐                               │\n  │   Encoder    │  ← L 层 self-attention         │\n  │  (prefill)   │     复杂度 O(L²)               │\n  └──────┬───────┘                               │\n         │ mem [L, d]                            │\n         ▼                                       │\n  ┌──────────────────────────────────────────────┴───┐\n  │   Decoder（3 步）                                 │\n  │      step 1: tok1 ~ P(· | mem)                    │\n  │      step 2: tok2 ~ P(· | mem, tok1)              │\n  │      step 3: tok3 ~ P(· | mem, tok1, tok2)        │\n  │      ↑ 每步都维护 B 条 beam                        │\n  └───────────────────────────────────────────────────┘\n         │\n         ▼\n   SID (3 个 token) ──► 反查 item ──► 排序 / 返回<\/code><\/pre>\n<h2>三个部件<\/h2>\n<h3>A. Semantic ID：3 个 token 表示一个 item<\/h3>\n<p>三层 RQ-KMeans（残差量化）：<\/p>\n<pre><code>item 向量 r0\n   │  找最近质心 → token1 = argmin‖C1 − r0‖\n   │  r1 = r0 − C1[token1]          ← 残差\n   │  找最近质心 → token2 = argmin‖C2 − r1‖\n   │  r2 = r1 − C2[token2]\n   │  ...\n   ▼  token3<\/code><\/pre>\n<p>两个后果：<\/p>\n<ul>\n<li><strong>从粗到细<\/strong>：token1 是「运动」，token2 是「球类」，token3 是「篮球」<\/li>\n<li><strong>相似 item 共享前缀<\/strong> —— 这是 beam 的树结构能共享 KV 的前提<\/li>\n<\/ul>\n<h3>B. Encoder-Decoder<\/h3>\n<table><thead><tr><th>部分<\/th><th>吃什么<\/th><th>复杂度<\/th><th>对应 LLM<\/th><\/tr><\/thead><tbody><tr><td>Encoder<\/td><td>用户历史 L<\/td><td>O(L²)<\/td><td>prefill<\/td><\/tr><tr><td>Decoder<\/td><td>3 个 token × B 条 beam<\/td><td>O(B·(L+B·t))<\/td><td>decode<\/td><\/tr><tr><td>Cross-attn<\/td><td>query=B，KV=L<\/td><td>同上<\/td><td>——<\/td><\/tr><\/tbody><\/table>\n<h3>C. Beam search<\/h3>\n<p>GR 的 beam 和 LLM 的 beam 不是一个东西：<\/p>\n<table><thead><tr><th><\/th><th>LLM<\/th><th>GR<\/th><\/tr><\/thead><tbody><tr><td>beam 宽度<\/td><td>4~8<\/td><td><strong>128~900<\/strong><\/td><\/tr><tr><td>输出长度<\/td><td>几十~几千<\/td><td><strong>3~5<\/strong><\/td><\/tr><tr><td>目的<\/td><td>找一个更好的句子<\/td><td>找<strong>一批<\/strong>不同的候选 item<\/td><\/tr><tr><td>词表约束<\/td><td>无<\/td><td>只能出合法 SID（受限解码）<\/td><\/tr><\/tbody><\/table>\n<h2>推理的三段成本<\/h2>\n<table><thead><tr><th>阶段<\/th><th>公式<\/th><th>谁主导<\/th><\/tr><\/thead><tbody><tr><td>1 prefill<\/td><td><code>pairs ∝ L²<\/code><\/td><td>长序列<\/td><\/tr><tr><td>2 decode<\/td><td><code>pairs ∝ B·(L + B·t)<\/code><\/td><td>beam 宽度<\/td><\/tr><tr><td>3 beam 排序<\/td><td><code>∝ B·V<\/code><\/td><td>词表大小<\/td><\/tr><\/tbody><\/table>\n<p>decode 的展开：<\/p>\n<pre><code>pairs = B·L  +  B²·t\n        ↑        ↑\n     可摊薄     beam 独有<\/code><\/pre>\n<ul>\n<li><code>B·L<\/code>：B 个 query 共享同一份 prompt KV ⇒ <strong>每 query 的读取量 ∝ 1/B<\/strong><\/li>\n<li><code>B²·t<\/code>：beam 之间互相看（tree attention 下的树内交互）<\/li>\n<\/ul>\n<h2>关键事实：q = B<\/h2>\n<pre><code>LLM decode        q = 1      切 KV 永远不划算（搬得比算得多）\nGR decode B=128   q = 128    KV 搬一次的收益被摊薄 128 倍\nGR decode B=512   q = 512    CP 开始可能有对象\nGR decode B=900   q = 900    生产上限<\/code><\/pre>\n<p><strong>同一个 cross-attention，LLM 里 q=1，GR 里 q=512。<\/strong><\/p>\n<p>这一个数字改变了 CP 的全部结论 —— 见 <code>05-CP.md<\/code> 的场景 2。<\/p>\n<h2>公开的生产配置<\/h2>\n<table><thead><tr><th>系统<\/th><th>规模<\/th><th>FFN<\/th><th>beam<\/th><th>有没有专家<\/th><\/tr><\/thead><tbody><tr><td>OneRec（闭源）<\/td><td>0.94B / 2.6B<\/td><td><strong>MoE<\/strong>（24 专家，top-2/4）<\/td><td>128<\/td><td>有<\/td><\/tr><tr><td>OneRec-V2（闭源）<\/td><td>1B<\/td><td><strong>MoE<\/strong><\/td><td>512<\/td><td>有<\/td><\/tr><tr><td><strong>OpenOneRec-1.7B<\/strong><\/td><td>1.7B<\/td><td><strong>dense Qwen3<\/strong><\/td><td>128~512<\/td><td><strong>无<\/strong><\/td><\/tr><tr><td><strong>OpenOneRec-8B<\/strong><\/td><td>8B<\/td><td><strong>dense Qwen3<\/strong><\/td><td>128~512<\/td><td><strong>无<\/strong><\/td><\/tr><tr><td>美团 SLM 引擎<\/td><td>~0.5B<\/td><td>—<\/td><td>~100<\/td><td>—<\/td><\/tr><tr><td>NVIDIA GR-Inference<\/td><td>0.6B<\/td><td>—<\/td><td>20→900<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<h2>MoE：谁有，谁没有<\/h2>\n<p>这一节纠正一个非常容易搞错的点。<strong>「OneRec 用了 MoE」这句话只对闭源版成立。<\/strong><\/p>\n<p>闭源 OneRec 系列（arXiv 2506.13695, Table 1）：<\/p>\n<table><thead><tr><th>模型<\/th><th>类型<\/th><th>层数<\/th><th>隐藏维<\/th><th>专家（总/激活）<\/th><th>MoE 位置<\/th><\/tr><\/thead><tbody><tr><td>OneRec-0.015B<\/td><td>Dense<\/td><td>4<\/td><td>128<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>OneRec-0.121B<\/td><td>Dense<\/td><td>8<\/td><td>1024<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>OneRec-0.935B<\/td><td><strong>MoE<\/strong><\/td><td>8<\/td><td>1024<\/td><td><strong>24 / 2<\/strong><\/td><td>Decoder<\/td><\/tr><tr><td>OneRec-2.633B<\/td><td><strong>MoE<\/strong><\/td><td>24<\/td><td>1024<\/td><td><strong>24 / 4<\/strong><\/td><td>Enc &amp; Dec<\/td><\/tr><\/tbody><\/table>\n<p>开源 OpenOneRec / OneRec-Foundation：<\/p>\n<table><thead><tr><th>模型<\/th><th>backbone<\/th><th>hidden<\/th><th>layers<\/th><th>Q heads<\/th><th>KV heads<\/th><th>FFN dim<\/th><th>FFN 类型<\/th><\/tr><\/thead><tbody><tr><td>OneRec-1.7B<\/td><td>Qwen3-1.7B<\/td><td>2048<\/td><td>28<\/td><td>16<\/td><td><strong>8<\/strong><\/td><td>6144<\/td><td><strong>dense<\/strong><\/td><\/tr><tr><td>OneRec-8B<\/td><td>Qwen3-8B<\/td><td>4096<\/td><td>36<\/td><td>32<\/td><td><strong>8<\/strong><\/td><td>12288<\/td><td><strong>dense<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>依据：<\/p>\n<ul>\n<li>HF <code>config.json<\/code> 的 <code>architectures<\/code> 是 <code>Qwen3ForCausalLM<\/code>，<strong>没有<\/strong> <code>num_experts<\/code> /<\/li>\n<\/ul>\n<p>  <code>moe_intermediate_size<\/code> 等字段<\/p>\n<ul>\n<li>官方模型卡原文：「The architecture remains <strong>strictly consistent with the original Qwen3<\/strong>」，<\/li>\n<\/ul>\n<p>  唯一的结构改动是扩展 itemic token 的词表（<code>vocab_size = 176384<\/code>）<\/p>\n<ul>\n<li>Qwen3 的 0.6B / 1.7B / 4B / 8B 都是 dense；MoE 只有 30B-A3B 与 235B-A22B<\/li>\n<\/ul>\n<h3>两条推论（都会改变并行结论）<\/h3>\n<ul>\n<li><strong>EP 对 OpenOneRec 不适用<\/strong> —— 没有专家可切。<\/li>\n<\/ul>\n<p>   因此「beam × EP」那条线只能落在闭源 OneRec（24 专家）或 RankMixer 上。<\/p>\n<ul>\n<li><strong>KV heads = 8，而一张卡 8 芯<\/strong> ⇒ TP=8 恰好覆盖 KV，<\/li>\n<\/ul>\n<p>   再加 KVP / CP 在<strong>显存上没有增量收益<\/strong>。<\/p>\n<p>   这是 <code>05-CP.md<\/code> 判据 A 的一个真实数据点：<\/p>\n<p>   <code>n_kv = 8 ≥ N = 8<\/code> ⇒ ② 的价值 ≈ 0。<\/p>\n<h2>并行含义<\/h2>\n<table><thead><tr><th>轴<\/th><th>结论<\/th><th>原因<\/th><\/tr><\/thead><tbody><tr><td><strong>CP<\/strong><\/td><td><strong>有对象<\/strong><\/td><td>prefill 的 L 可以切；decode 的 q=B 让切 KV 也划算<\/td><\/tr><tr><td><strong>EP<\/strong><\/td><td><strong>开源版不适用<\/strong><\/td><td>OpenOneRec 是 dense Qwen3，没有专家。闭源 OneRec 才有<\/td><\/tr><tr><td><strong>beam<\/strong><\/td><td><strong>主战场<\/strong><\/td><td>B 从 128 到 900，是真正的缩放维<\/td><\/tr><tr><td>TP<\/td><td>可以，但 8 卡触顶<\/td><td><code>n_kv = 8<\/code>，TP&gt;8 会复制 KV<\/td><\/tr><\/tbody><\/table>\n<h2>常见误解<\/h2>\n<table><thead><tr><th>误解<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td>「GR 就是小 LLM，并行直接用 LLM 的」<\/td><td>q=512 vs 1；只有 3 步 vs 上千步；这两个差异改变全部结论<\/td><\/tr><tr><td>「beam search 只是个解码参数」<\/td><td>在 GR 里它是<strong>主维度<\/strong>，决定了成本形状<\/td><\/tr><tr><td>「3 步很短，所以 decode 不贵」<\/td><td>decode 的 pair 数是 <code>B·(L+B·t)<\/code>，B=512 时是 L 的 512 倍<\/td><\/tr><tr><td>「输出只有 3 个 token ⇒ 等于一次前向」<\/td><td>是 3 次，而且每次有 B 条 beam<\/td><\/tr><tr><td><strong>「OneRec 是 MoE，所以能上 EP」<\/strong><\/td><td><strong>闭源 OneRec 才是；开源的 OpenOneRec 是 dense Qwen3，没有专家<\/strong><\/td><\/tr><\/tbody><\/table>\n<h2>对应代码<\/h2>\n<p><code>models/onerec_min.py<\/code><\/p>\n<ul>\n<li>RQ-KMeans：一个 item → 3 个 token，并显示相邻 item 共享前缀<\/li>\n<li>形状轨迹：encoder 吃 L、decoder 吃 1、cross-attn 的 KV 长 L<\/li>\n<li>beam 的工作量表：<code>B·(L + B·t)<\/code><\/li>\n<li>朴素 beam 的 KV 冗余倍数（≈ beam 宽度）<\/li>\n<li><strong><code>[G]<\/code> 一节：闭源 OneRec（MoE 24 专家）vs 开源 OpenOneRec（dense Qwen3）的对照<\/strong><\/li>\n<\/ul>", "code": "\"\"\"OpenOneRec / OneRec 最小实现 —— 「推荐」变成一个 3-token 的自回归生成问题。\n\n论文: \"OneRec: Unifying Retrieve and Rank with Generative Recommender and\n      Preference Alignment\", arXiv 2502.18965\n      \"OneRec Technical Report\", arXiv 2506.13695\n      \"OpenOneRec Technical Report\", arXiv 2512.24762\n\n=======================================================================\n三个部件，缺一不可\n=======================================================================\nA. Semantic ID (SID)：item 被压成 3 个离散 token\n   三层 RQ-KMeans：每层取最近质心的下标，减掉质心，残差传给下一层。\n   token 因此从粗到细（「运动 -> 球类 -> 篮球」），\n   并且**相似 item 共享前缀** —— 后面 beam 的树结构全靠这个。\n\nB. Encoder-Decoder\n   encoder 吃用户行为历史（长，L）—— 与 LLM prefill 同构\n   decoder 逐个吐 SID token（只有 3 个）—— 与 LLM decode 同构\n   中间是 cross-attention\n\nC. Beam search\n   B 条候选同时推进。GR 里 B = 128~900（不是 LLM 的 4~8）。\n   这是「beam 不是次要参数，而是主维度」的来源。\n\n=======================================================================\n推理的三段成本（并行分析的入口）\n=======================================================================\n\n  阶段 1  prefill (encoder)\n      pairs ∝ L²          长！用户历史几千到几万\n      每请求只做 1 次\n      并行轴：CP（切 L）/ TP（切 d）\n\n  阶段 2  decode (decoder, 3 步)\n      每步 q = B，KV = P + B·t\n      pair ∝ B·(P + B·t)   B 进入了成本\n      并行轴：beam（切 B）/ CP（切 P）\n\n  阶段 3  beam 排序\n      B·V 个 logits -> 每 beam 取 2B -> 全局 top-B\n      只跟 B、V 有关，与 d、L 无关\n      并行轴：几乎没有（一次 topk）\n\n关键事实：**q = B**。\nLLM 的 decode 是 q=1，所以「切 KV」永远不划算（搬得比算得多）。\nGR 的 decode 是 q=512，同一份 KV 搬一次能喂 512 个 query ——\n这是 CP 在 GR 推理上唯一可能有对象的场景（见 parallel/cp_min.py）。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom _core import rng, step, table, title\n\n\n# ======================================================================\n# A. RQ-KMeans：把 item 压成 3 个 token\n# ======================================================================\nclass RQKMeans:\n    \"\"\"残差量化：找最近质心 -> 取下标 -> 减质心 -> 残差进下一层。\"\"\"\n\n    def __init__(self, n_levels: int = 3, codebook: int = 16, dim: int = 32, seed: int = 0):\n        g = rng(seed)\n        self.centroids = [g.normal(0, 1, (codebook, dim)) for _ in range(n_levels)]\n\n    def encode(self, item_emb: np.ndarray) -> list[int]:\n        r = np.asarray(item_emb, dtype=np.float64).copy()\n        tokens = []\n        for C in self.centroids:\n            idx = int(np.argmin(((C - r) ** 2).sum(axis=1)))\n            tokens.append(idx)\n            r = r - C[idx]\n        return tokens\n\n    def decode(self, tokens: list[int]) -> np.ndarray:\n        return sum(C[t] for C, t in zip(self.centroids, tokens))\n\n\n# ======================================================================\n# B. Encoder-Decoder（只保留形状，不追精度）\n# ======================================================================\nclass OneRec:\n    def __init__(self, d: int = 64, vocab: int = 16, n_experts: int = 4, top_k: int = 1):\n        self.d, self.vocab, self.top_k = d, vocab, top_k\n        g = rng(1)\n        s = 1.0 / np.sqrt(d)\n        self.Wq, self.Wk, self.Wv = (g.normal(0, s, (d, d)) for _ in range(3))\n        self.emb = g.normal(0, 1, (vocab, d))\n        self.head = g.normal(0, s, (d, vocab))\n        # MoE FFN：只有 top_k 个专家被激活（OneRec: 13% 参数激活）\n        self.experts = [\n            (g.normal(0, s, (d, 4 * d)), g.normal(0, s, (4 * d, d)))\n            for _ in range(n_experts)\n        ]\n        self.router = g.normal(0, s, (d, n_experts))\n\n    # ------------------------------------------------------------------\n    def encode(self, hist_ids: np.ndarray) -> np.ndarray:\n        \"\"\"用户历史 -> 一份 mem。真实是 L 层 self-attn，这里 1 层。\"\"\"\n        x = self.emb[hist_ids]\n        q, k, v = x @ self.Wq, x @ self.Wk, x @ self.Wv\n        a = _softmax((q @ k.T) / np.sqrt(self.d))\n        return a @ v                                    # [L, d]\n\n    def decode_step(self, last_tok: int, mem: np.ndarray, cache: dict) -> np.ndarray:\n        \"\"\"一个 decode step。mem 是 encoder 输出，作为 cross-attn 的 KV。\"\"\"\n        x = self.emb[last_tok][None]                    # [1, d]\n        cache.setdefault(\"k\", []).append(x @ self.Wk)\n        cache.setdefault(\"v\", []).append(x @ self.Wv)\n        k = np.concatenate(cache[\"k\"], 0)\n        v = np.concatenate(cache[\"v\"], 0)\n        a = _softmax(((x @ self.Wq) @ k.T) / np.sqrt(self.d))\n        z = x + a @ v\n        # cross-attn 与 mem 相关项（这里只保留形状语义）\n        z = z + 0.0 * ((z @ self.Wq) @ (mem @ self.Wk).T @ mem)\n        # MoE FFN\n        gate = z @ self.router\n        pick = np.argsort(-gate[0])[: self.top_k]\n        h = sum(\n            np.maximum(z @ self.experts[e][0], 0) @ self.experts[e][1] for e in pick\n        )\n        return z + h\n\n    def logits(self, h: np.ndarray) -> np.ndarray:\n        return h @ self.head\n\n\ndef _softmax(x: np.ndarray) -> np.ndarray:\n    m = x.max(axis=-1, keepdims=True)\n    e = np.exp(x - m)\n    return e / e.sum(axis=-1, keepdims=True)\n\n\ndef _log_softmax(x: np.ndarray) -> np.ndarray:\n    m = x.max()\n    return x - m - np.log(np.exp(x - m).sum())\n\n\n# ======================================================================\n# C. beam search（朴素版：beam 摆在 batch 维）\n#    后面 parallel/beam_min.py 用 tree attention 重做一遍并对比 KV 字节\n# ======================================================================\ndef beam_search(model: OneRec, hist_ids: np.ndarray, beam: int, n_steps: int = 3):\n    mem = model.encode(hist_ids)                        # 1 次 prefill\n    beams = [(0.0, [])]\n    pool_sizes = []\n    kv_reads = 0\n    for _ in range(n_steps):\n        cands = []\n        for score, toks in beams:\n            h = model.decode_step(toks[-1] if toks else 0, mem, {\"k\": [], \"v\": []})\n            kv_reads += len(hist_ids) + len(toks)       # 每条 beam 都完整读一遍\n            lp = _log_softmax(model.logits(h)[0])\n            for tok in range(model.vocab):\n                cands.append((score + lp[tok], toks + [tok]))\n        pool_sizes.append(len(cands))\n        cands.sort(key=lambda x: -x[0])\n        beams = cands[:beam]\n    return beams, mem, pool_sizes, kv_reads\n\n\n# ======================================================================\ndef demo() -> None:\n    title(\"OpenOneRec：3 个 token 的自回归生成，B 条 beam 同时推进\")\n\n    # ---- A. SID ----\n    print(\"\\n  [A] RQ-KMeans：一个 item -> 3 个 token\")\n    rq = RQKMeans(n_levels=3, codebook=16, dim=32)\n    item = rng(2).normal(0, 1, 32)\n    toks = rq.encode(item)\n    step(\"item 向量\", shape=item.shape)\n    step(\"SID\", val=toks, note=\"3 层，从粗到细\")\n    step(\"重建误差\", val=f\"{np.linalg.norm(item - rq.decode(toks)):.3f}\",\n         note=\"每层只拟合剩下的残差\")\n    print(\"     => 相似 item 的 token[0] 往往相同 => beam 的树有共享前缀。\")\n\n    # 两个相近 item 共享前缀\n    near = item + rng(20).normal(0, 0.05, 32)\n    step(\"相邻 item 的 SID\", val=rq.encode(near), note=\"前缀相同是常态\")\n\n    # ---- B. 形状轨迹 ----\n    print(\"\\n  [B] 一次前向的形状轨迹：\")\n    model = OneRec(d=64, vocab=16, n_experts=4, top_k=1)\n    L = 256\n    hist = rng(3).integers(0, 16, L)\n    mem = model.encode(hist)\n    step(\"用户历史\", shape=hist.shape, note=f\"L={L}\")\n    step(\"encoder 输出 mem\", shape=mem.shape)\n    step(\"decode 一步\", shape=(1, 64), note=\"q 只有 1 行\")\n    print(\"     => encoder 吃 L，decoder 吃 1，cross-attn 的 KV 长 L。\")\n\n    # ---- C. beam ----\n    print(\"\\n  [C] beam search 的真实工作量（V=16, 3 步）：\")\n    rows = []\n    for B in (1, 8, 128, 512):\n        pool = B * model.vocab\n        kv_len = L + B * 2\n        pairs = B * kv_len\n        rows.append((B, pool, pairs, f\"{pairs / L:.1f}x\"))\n    print(table(rows, (\"B\", \"候选池 B·V\", \"每步 pair\", \"相对 B=1\")))\n    print(\"     => pair ∝ B·(L + B·t)。\")\n    print(\"        B·L 项 = B 个 query 共享同一份 prompt KV（可摊薄）\")\n    print(\"        B²·t 项 = beam 之间互相看（beam 独有，随 B 二次）\")\n\n    # ---- D. 朴素 beam 的 KV 冗余 ----\n    print(\"\\n  [D] 朴素实现（beam 摆 batch 维）读了几遍 KV：\")\n    beams, _, pools, kv_reads = beam_search(model, hist, beam=8, n_steps=3)\n    shared = L * 3                                       # tree attention：每步 1 遍\n    step(\"朴素 KV 读取\", val=f\"{kv_reads} 个 token\")\n    step(\"tree attention\", val=f\"{shared} 个 token\", note=\"每步只读一次\")\n    step(\"冗余倍数\", val=f\"{kv_reads / shared:.1f}x\", note=\"≈ beam 宽度\")\n    print(\"     => 这就是 vLLM 慢 25 倍的机制性原因（见 parallel/beam_min.py）。\")\n\n    # ---- E. 关键：q = B ----\n    print(\"\\n  [核心] 为什么 GR 的 decode 和 LLM 不一样：\")\n    rows = [\n        (\"LLM decode\", 1, \"q=1，切 KV 永远不划算\"),\n        (\"GR decode (B=128)\", 128, \"KV 搬一次的收益被 128 倍摊薄\"),\n        (\"GR decode (B=512)\", 512, \"CP 开始可能有对象\"),\n        (\"GR decode (B=900)\", 900, \"生产上限（NVIDIA GR-Inference）\"),\n    ]\n    print(table(rows, (\"场景\", \"q\", \"含义\")))\n    print(\"     => 同一个 cross-attn：LLM 里 q=1，GR 里 q=512。\")\n    print(\"        这就是『beam 让 CP 重新有对象』的全部内容。\")\n\n    # ---- F. 生产配置 ----\n    print(\"\\n  [生产配置对照]（公开报道）\")\n    rows = [\n        (\"OneRec（闭源）\", \"0.94B/2.6B\", \"24 专家 top-2/4\", \"128\", \"MoE\"),\n        (\"OneRec-V2（闭源）\", \"1B\", \"—\", \"512\", \"MoE\"),\n        (\"OpenOneRec-1.7B\", \"1.7B\", \"dense Qwen3\", \"128~512\", \"**无专家**\"),\n        (\"OpenOneRec-8B\", \"8B\", \"dense Qwen3\", \"128~512\", \"**无专家**\"),\n        (\"美团 SLM\", \"~0.5B\", \"—\", \"~100\", \"—\"),\n        (\"NVIDIA GR-Inference\", \"0.6B\", \"—\", \"20→900\", \"—\"),\n    ]\n    print(table(rows, (\"系统\", \"规模\", \"FFN\", \"beam\", \"有没有专家\")))\n\n    # ---- G. 谁是 MoE ---- 这一节纠正一个很容易搞错的点\n    print(\"\\n  [G] 「OneRec 有专家」这句话，对开源版不成立：\")\n    one_rec = [(\"OneRec-0.015B\", \"Dense\", \"4\", \"128\", \"—\", \"—\"),\n               (\"OneRec-0.121B\", \"Dense\", \"8\", \"1024\", \"—\", \"—\"),\n               (\"OneRec-0.935B\", \"MoE\", \"8\", \"1024\", \"24 / 2\", \"Decoder\"),\n               (\"OneRec-2.633B\", \"MoE\", \"24\", \"1024\", \"24 / 4\", \"Enc & Dec\")]\n    print(\"    闭源 OneRec 系列（arXiv 2506.13695, Table 1）：\")\n    print(\"    \" + table(one_rec, (\"模型\", \"类型\", \"层数\", \"隐藏维\",\n                                  \"专家(总/激活)\", \"MoE 位置\")).replace(\"\\n\", \"\\n    \"))\n\n    print(\"\\n    开源 OpenOneRec / OneRec-Foundation（Qwen3 backbone）：\")\n    cfg = [(\"OneRec-1.7B\", \"Qwen3-1.7B\", 2048, 28, 16, 8, 6144, \"dense\"),\n           (\"OneRec-8B\", \"Qwen3-8B\", 4096, 36, 32, 8, 12288, \"dense\")]\n    print(\"    \" + table(cfg, (\"模型\", \"backbone\", \"hidden\", \"layers\",\n                              \"Q heads\", \"KV heads\", \"FFN dim\", \"FFN 类型\")).replace(\"\\n\", \"\\n    \"))\n\n    print(\"\\n    依据：HF config.json 为 `Qwen3ForCausalLM`，没有 num_experts /\")\n    print(\"    moe_intermediate_size 等字段；官方模型卡写明「architecture remains\")\n    print(\"    strictly consistent with the original Qwen3」，唯一改动是扩展 itemic token 词表。\")\n    print(\"    而 Qwen3 的 0.6B/1.7B/4B/8B 都是 dense（MoE 只有 30B-A3B / 235B-A22B）。\")\n\n    print(\"\\n    两条推论：\")\n    print(\"      1. EP 对 OpenOneRec 不适用 —— 没有专家可切。\")\n    print(\"      2. KV heads = 8，而一张卡 8 芯 ⇒ TP=8 恰好覆盖 KV，\")\n    print(\"         再往上加 KVP/CP 在显存上**没有任何增量收益**（判据 A 的实测确认）。\")\n\n\nif __name__ == \"__main__\":\n    demo()\n", "codePath": "models/onerec_min.py", "out": "\n==============================================================================\nOpenOneRec：3 个 token 的自回归生成，B 条 beam 同时推进\n==============================================================================\n\n  [A] RQ-KMeans：一个 item -> 3 个 token\n  item 向量                      shape=(32,)\n  SID                          val=[3, 9, 15]  note=3 层，从粗到细\n  重建误差                         val=5.792  note=每层只拟合剩下的残差\n     => 相似 item 的 token[0] 往往相同 => beam 的树有共享前缀。\n  相邻 item 的 SID                val=[3, 9, 15]  note=前缀相同是常态\n\n  [B] 一次前向的形状轨迹：\n  用户历史                         shape=(256,)  note=L=256\n  encoder 输出 mem               shape=(256, 64)\n  decode 一步                    shape=(1, 64)  note=q 只有 1 行\n     => encoder 吃 L，decoder 吃 1，cross-attn 的 KV 长 L。\n\n  [C] beam search 的真实工作量（V=16, 3 步）：\nB    候选池 B·V  每步 pair  相对 B=1 \n---  -------  -------  -------\n1    16       258      1.0x   \n8    128      2176     8.5x   \n128  2048     65536    256.0x \n512  8192     655360   2560.0x\n     => pair ∝ B·(L + B·t)。\n        B·L 项 = B 个 query 共享同一份 prompt KV（可摊薄）\n        B²·t 项 = beam 之间互相看（beam 独有，随 B 二次）\n\n  [D] 朴素实现（beam 摆 batch 维）读了几遍 KV：\n  朴素 KV 读取                     val=4376 个 token\n  tree attention               val=768 个 token  note=每步只读一次\n  冗余倍数                         val=5.7x  note=≈ beam 宽度\n     => 这就是 vLLM 慢 25 倍的机制性原因（见 parallel/beam_min.py）。\n\n  [核心] 为什么 GR 的 decode 和 LLM 不一样：\n场景                 q    含义                       \n-----------------  ---  -------------------------\nLLM decode         1    q=1，切 KV 永远不划算           \nGR decode (B=128)  128  KV 搬一次的收益被 128 倍摊薄       \nGR decode (B=512)  512  CP 开始可能有对象               \nGR decode (B=900)  900  生产上限（NVIDIA GR-Inference）\n     => 同一个 cross-attn：LLM 里 q=1，GR 里 q=512。\n        这就是『beam 让 CP 重新有对象』的全部内容。\n\n  [生产配置对照]（公开报道）\n系统                   规模          FFN            beam     有没有专家  \n-------------------  ----------  -------------  -------  -------\nOneRec（闭源）           0.94B/2.6B  24 专家 top-2/4  128      MoE    \nOneRec-V2（闭源）        1B          —              512      MoE    \nOpenOneRec-1.7B      1.7B        dense Qwen3    128~512  **无专家**\nOpenOneRec-8B        8B          dense Qwen3    128~512  **无专家**\n美团 SLM               ~0.5B       —              ~100     —      \nNVIDIA GR-Inference  0.6B        —              20→900   —      \n\n  [G] 「OneRec 有专家」这句话，对开源版不成立：\n    闭源 OneRec 系列（arXiv 2506.13695, Table 1）：\n    模型             类型     层数  隐藏维   专家(总/激活)  MoE 位置   \n    -------------  -----  --  ----  --------  ---------\n    OneRec-0.015B  Dense  4   128   —         —        \n    OneRec-0.121B  Dense  8   1024  —         —        \n    OneRec-0.935B  MoE    8   1024  24 / 2    Decoder  \n    OneRec-2.633B  MoE    24  1024  24 / 4    Enc & Dec\n\n    开源 OpenOneRec / OneRec-Foundation（Qwen3 backbone）：\n    模型           backbone    hidden  layers  Q heads  KV heads  FFN dim  FFN 类型\n    -----------  ----------  ------  ------  -------  --------  -------  ------\n    OneRec-1.7B  Qwen3-1.7B  2048    28      16       8         6144     dense \n    OneRec-8B    Qwen3-8B    4096    36      32       8         12288    dense \n\n    依据：HF config.json 为 `Qwen3ForCausalLM`，没有 num_experts /\n    moe_intermediate_size 等字段；官方模型卡写明「architecture remains\n    strictly consistent with the original Qwen3」，唯一改动是扩展 itemic token 词表。\n    而 Qwen3 的 0.6B/1.7B/4B/8B 都是 dense（MoE 只有 30B-A3B / 235B-A22B）。\n\n    两条推论：\n      1. EP 对 OpenOneRec 不适用 —— 没有专家可切。\n      2. KV heads = 8，而一张卡 8 芯 ⇒ TP=8 恰好覆盖 KV，\n         再往上加 KVP/CP 在显存上**没有任何增量收益**（判据 A 的实测确认）。\n"}, {"id": "cp", "group": "并行轴", "title": "CP", "blurb": "切 Q / 切 KV / zigzag 三方案", "body": "<h1>05 · CP（上下文并行）<\/h1>\n<blockquote><p><strong>一句话<\/strong>：切序列只有三种做法，区别只在「切谁」和「失衡怎么办」。<\/p>\n<p>而 GR 的正确定点，恰好是通信量最小、失衡最轻的那一个。<\/p><\/blockquote>\n<h2>对应代码<\/h2>\n<table><thead><tr><th>来源<\/th><th>文件<\/th><\/tr><\/thead><tbody><tr><td>Megatron<\/td><td><code>megatron/core/context_parallel/sequence_roll.py<\/code>、<code>parallel_state.py<\/code><\/td><\/tr><tr><td>TransformerEngine<\/td><td><code>attn_.../context_parallel.py<\/code>（<code>AttnFuncWithCPAndKVP2P<\/code>）<\/td><\/tr><tr><td>Medha（KVP）<\/td><td>arXiv 2409.17264<\/td><\/tr><tr><td>Helix<\/td><td>arXiv 2507.07120<\/td><\/tr><tr><td>HSTU CP（训练）<\/td><td>arXiv 2508.04711，5.3× 更长序列，1.55× @ DDP<\/td><\/tr><\/tbody><\/table>\n<h2>三种切法<\/h2>\n<pre><code>(1) cp_qk —— 切 Q 也切 KV（经典 CP / ring attention）\n\n    rank0: q[0:c]  kv[0:c]        ┌── 转 (N-1) 轮补齐 KV ──┐\n    rank1: q[c:2c] kv[c:2c]  ==&gt;  │ send → rank+1           │\n    rank2: q[2c:3c] ...           │ recv ← rank-1           │\n    rank3: ...                    └────────────────────────┘\n\n(2) zigzag —— 在 (1) 之上把块配对\n\n    rank0: 第0块 + 第(2N-1)块\n    rank1: 第1块 + 第(2N-2)块\n    通信同 (1)，但失衡被压平\n\n(3) cp_q —— 只切 Q，KV 每卡一份全量\n\n    rank0: q[0:c]  +  全量 KV\n    rank1: q[c:2c] +  全量 KV\n    通信：0<\/code><\/pre>\n<h2>三条判据对应的三个结论<\/h2>\n<table><thead><tr><th>判据<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>归约代数<\/td><td>纯加（HSTU/MTGR）⇒ 分块求和精确，<strong>零归约<\/strong>；softmax（LONGER）⇒ 需要 LSE 合并<\/td><\/tr><tr><td>掩码拓扑<\/td><td>方阵 ⇒ 失衡 1.00；因果 ⇒ 2−1/N；zigzag ⇒ 1.00（代价：重排 kernel）<\/td><\/tr><tr><td>单卡容量<\/td><td>N≤32K 时 KV ≈ 1 GB ⇒ 装得下 ⇒ <strong>不需要切<\/strong><\/td><\/tr><\/tbody><\/table>\n<h2>实测（<code>parallel/cp_min.py<\/code> 跑出来的数）<\/h2>\n<p>因果掩码、N 张卡、误差指相对单卡的 <code>max_abs_err<\/code>：<\/p>\n<table><thead><tr><th>N<\/th><th>cp_q 失衡<\/th><th>cp_qk 失衡<\/th><th>zigzag 失衡<\/th><th>cp_q 通信<\/th><th>cp_qk 通信<\/th><th>误差<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>1.50<\/td><td>1.50<\/td><td>1.00<\/td><td>0<\/td><td>64 KiB<\/td><td>0<\/td><\/tr><tr><td>4<\/td><td>1.75<\/td><td>1.75<\/td><td>1.00<\/td><td>0<\/td><td>96 KiB<\/td><td>2.8e-16<\/td><\/tr><tr><td>8<\/td><td>1.87<\/td><td>1.87<\/td><td>1.00<\/td><td>0<\/td><td>112 KiB<\/td><td>2.2e-16<\/td><\/tr><\/tbody><\/table>\n<p>三条读数：<\/p>\n<ul>\n<li><strong>cp_q 与 cp_qk 的失衡相同<\/strong> —— 都是 <code>2 − 1/N<\/code>。它们的区别不是 pair 数，是<strong>通信<\/strong>。<\/li>\n<li><strong>zigzag 把失衡压到 1.00<\/strong>，代价是块重排的 kernel。<\/li>\n<li><strong>cp_q 的通信恒为 0，且结果精确到浮点误差<\/strong>。<\/li>\n<\/ul>\n<h2>cp_q 的代价：多读的那份 KV<\/h2>\n<p><code>cp_q<\/code> 每卡要读<strong>全量<\/strong> KV，所以：<\/p>\n<pre><code>cp_q  多读  (1 − 1/N)·P·κ     来自 HBM      ~800 GB/s\ncp_qk 通信  (1 − 1/N)·P·κ     走互联        ~200 GB/s\n                ↑\n           字节数完全相同<\/code><\/pre>\n<p><strong>两边的字节数一模一样，胜负只取决于用哪种带宽。<\/strong><\/p>\n<p>HBM : 互联 ≈ 4 : 1 ⇒ cp_q 恒定赢 4 倍，与 P、N 无关。<\/p>\n<blockquote><p>这就是 Medha 的 KVP 在结构上占优的真正原因：不是「更聪明的算法」，<\/p>\n<p>而是<strong>把同样的搬运量从慢带宽挪到了快带宽<\/strong>。<\/p><\/blockquote>\n<h2>场景 2：decode 时 q = B<\/h2>\n<table><thead><tr><th>B<\/th><th>P<\/th><th>cp_q 每卡读<\/th><th>每 query 摊到<\/th><th>pair/步<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>4096<\/td><td>1024 KiB<\/td><td><strong>1024 KiB<\/strong><\/td><td>0.004 M<\/td><\/tr><tr><td>128<\/td><td>4096<\/td><td>1024 KiB<\/td><td>8 KiB<\/td><td>0.52 M<\/td><\/tr><tr><td>512<\/td><td>4096<\/td><td>1024 KiB<\/td><td><strong>2 KiB<\/strong><\/td><td>2.10 M<\/td><\/tr><tr><td>900<\/td><td>32768<\/td><td>8192 KiB<\/td><td>9.1 KiB<\/td><td>29.5 M<\/td><\/tr><\/tbody><\/table>\n<p>第 3 列与 B 无关（这是 cp_q 的固定代价），但<strong>第 4 列按 1/B 摊薄<\/strong>。<\/p>\n<p><code>B=1<\/code> 时（LLM decode）摊不开 ⇒ cp_q 永远不划算。<\/p>\n<p><code>B=512<\/code> 时（GR decode）摊得开 ⇒ cp_q 开始有意义。<\/p>\n<h2>什么时候必须用 cp_qk<\/h2>\n<table><thead><tr><th>条件<\/th><th>选择<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>KV 单卡装得下<\/td><td><strong>cp_q<\/strong><\/td><td>零通信、精确、无重排<\/td><\/tr><tr><td>KV 单卡装不下（L &gt; 32K）<\/td><td>cp_qk<\/td><td>只能切，通信是硬代价<\/td><\/tr><tr><td>有 softmax（LONGER）<\/td><td>都必须<\/td><td>需要 online softmax，归约不再是加法<\/td><\/tr><tr><td>q 很小（LONGER 的 50~250）<\/td><td>cp_q 也不划算<\/td><td>省下的绝对工作量本来就小<\/td><\/tr><\/tbody><\/table>\n<h2>为什么 LONGER 是例外<\/h2>\n<p>LONGER 的注意力有 softmax，而且 <code>q : L ≈ 1 : 40 ~ 1 : 100<\/code>：<\/p>\n<ul>\n<li>softmax ⇒ 必须 online softmax，跨卡要合并 <code>(max, sum)<\/code><\/li>\n<li>q 只有 50~250 ⇒ <code>q·L<\/code> 本来就小 ⇒ Amdahl 上限只有 1.2~1.3×<\/li>\n<\/ul>\n<p>这两条合起来造成一个尴尬的事实：<\/p>\n<p>**唯一真正需要长序列的模型（LONGER），是唯一需要复杂 CP 的模型；<\/p>\n<p>而 CP 很简单的模型（HSTU），是唯一不需要长序列的。**<\/p>\n<h2>常见误解<\/h2>\n<table><thead><tr><th>误解<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td>「ring 是唯一的 CP 实现」<\/td><td>cp_q（复制 KV）通信为 0，在 KV 装得下时严格更优<\/td><\/tr><tr><td>「zigzag 总是更好」<\/td><td>它只在<strong>因果<\/strong>掩码下有用；方阵（MTGR 静态段）下是负优化<\/td><\/tr><tr><td>「失衡 2−1/N 又不大」<\/td><td>它是<strong>计算项<\/strong>的失衡；当固定开销占 90% 时，修它只值 1~3%<\/td><\/tr><tr><td>「CP 省通信 ⇒ 值得做」<\/td><td>通信下界 Θ(Ldh) 已封死；决定成败的是有没有工作量可省<\/td><\/tr><tr><td>「加卡就该更快」<\/td><td>固定开销 ∝ N ⇒ 短序列上加卡是<strong>变慢<\/strong>（内点现象）<\/td><\/tr><\/tbody><\/table>\n<h2>三个可以直接算的判据<\/h2>\n<p><strong>判据 A（要不要切）<\/strong><\/p>\n<pre><code>KV 字节 = L · d · 2 · 2 · 层数\nL=32K, d=512, bf16, 32 层  →  1.0 GB\n一张 910B = 64 GB  →  装得下  →  不切<\/code><\/pre>\n<p><strong>判据 B（切了值不值）<\/strong><\/p>\n<pre><code>Amdahl 上限 = T(1) / T(∞)\n只在计算项占比 &gt; 50% 时才有意义<\/code><\/pre>\n<p><strong>判据 C（cp_q 还是 cp_qk）<\/strong><\/p>\n<pre><code>KV 装得下      → cp_q\nKV 装不下      → cp_qk\n有 softmax     → 两者都要 LSE 合并，先看 q/L<\/code><\/pre>", "code": "\"\"\"CP 的三种切法 —— 在同一个加法归约 attention 上实测差异。\n\n对应代码: Megatron `context_parallel/sequence_roll.py`、`parallel_state.py`\n          TransformerEngine `AttnFuncWithCPAndKVP2P`（ring）\n          Medha 的 KVP（切 KV、复制 Q）\n\n=======================================================================\n只有三种切法，区别只在「切谁」和「失衡怎么办」\n=======================================================================\n\n  (1) cp_qk   切 Q 也切 KV（经典 CP / ring attention）\n      每卡：q 的 1/N + kv 的 1/N\n      通信：(N-1) 轮，每轮 shard_kv 字节  —— 必须转圈补齐 KV\n      失衡：因果三角 => 2N/(N+1)（N=8 时 1.78）\n\n  (2) zigzag  在 (1) 之上把块配对\n      每卡：第 r 块 + 第 (2N-1-r) 块\n      通信：同 (1)\n      失衡：≈1.00（把「重卡 + 轻卡」合成一张卡）\n\n  (3) cp_q    只切 Q，KV 每卡一份全量\n      每卡：q 的 1/N + 全部 kv\n      通信：**0**（KV 是复制的）\n      失衡：读 KV 完全均衡；算 pair 对因果仍失衡\n             —— 但对 GR 的 decode（非因果、q=B）失衡也是 1.00\n\n=======================================================================\n这三条路线的取舍可以用一句话讲完\n=======================================================================\n    通信量 ∝ 你切掉的那一维\n    cp_qk 切了 KV  => 省显存，但要 (N-1) 轮通信\n    cp_q  不切 KV  => 零通信，但每卡都要存全量 KV\n\n所以：**KV 单卡装得下时，cp_q 严格优于 cp_qk。**\n这就是「GR 的 CP 是伪问题」的技术内容（docs/05）。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom _core import (World, count_pairs, load_imbalance, rng, step, table, title,\n                   zigzag_indices)\n\n\n# ======================================================================\n# 被切的那个 attention：纯加归约（HSTU/MTGR 的形态）\n# ======================================================================\ndef make_qkv(n, d=32, n_heads=4, seed=0):\n    g = rng(seed)\n    return (g.normal(0, 1, (n, d)), g.normal(0, 1, (n, d)),\n            g.normal(0, 1, (n, d)), g.normal(0, 1, (n, n_heads, d // n_heads)))\n\n\ndef local_out(q, k, v, mask, d=32, h=4):\n    \"\"\"在给定的 q/k/v 上算 SiLU 权重并乘 V。mask 是 [nq, nk]。\"\"\"\n    nq, nk = q.shape[0], k.shape[0]\n    hd = d // h\n    qh = q.reshape(nq, h, hd).transpose(1, 0, 2)\n    kh = k.reshape(nk, h, hd).transpose(1, 0, 2)\n    vh = v.reshape(nk, h, hd).transpose(1, 0, 2)\n    s = qh @ kh.transpose(0, 2, 1) / max(nq, nk)\n    s = np.where(mask[None], _silu(s), 0.0)\n    o = s @ vh\n    return o.transpose(1, 0, 2).reshape(nq, d)\n\n\ndef _silu(x):\n    out = np.empty_like(x)\n    p = x >= 0\n    out[p] = x[p] / (1 + np.exp(-x[p]))\n    e = np.exp(x[~p])\n    out[~p] = x[~p] * e / (1 + e)\n    return out\n\n\ndef reference(q, k, v, mask, d=32, h=4):\n    return local_out(q, k, v, mask, d, h)\n\n\n# ======================================================================\n# (3) cp_q：零通信\n# ======================================================================\ndef cp_q(world, q, k, v, mask, d=32, h=4):\n    n = q.shape[0]\n    c = n // world.size\n    outs, pairs = [], []\n    for r in range(world.size):\n        lo, hi = r * c, (r + 1) * c\n        o = local_out(q[lo:hi], k, v, mask[lo:hi], d, h)   # 全量 KV\n        outs.append(o)\n        pairs.append(int(mask[lo:hi].sum()))\n    return np.concatenate(outs, 0), pairs, 0\n\n\n# ======================================================================\n# (1) cp_qk：ring，每轮换一块 KV\n# ======================================================================\ndef _chunks(n: int, N: int) -> list[np.ndarray]:\n    c = n // N\n    return [np.arange(r * c, (r + 1) * c) for r in range(N)]\n\n\ndef cp_qk(world, q, k, v, mask, d=32, h=4):\n    \"\"\"ring：每卡持 q 的 1/N + kv 的 1/N，转 (N-1) 轮补齐。\n\n    注意 send/recv 的顺序：所有 rank 先同时 post send，再同时 recv。\n    这正是 TE `flash_attn_p2p_communicate` 里「偶数 rank 先发、奇数 rank 先收」\n    要解决的那个死锁问题的单进程等价写法。\n    \"\"\"\n    n, N = q.shape[0], world.size\n    blocks = _chunks(n, N)\n    cur_k = [k[b] for b in blocks]\n    cur_v = [v[b] for b in blocks]\n    acc_k = [[] for _ in range(N)]\n    acc_v = [[] for _ in range(N)]\n    comm = [0] * N\n\n    for _hop in range(N - 1):\n        # 1) 所有 rank 先 post send\n        for r in range(N):\n            pg = world[r]\n            dst = (r + 1) % N\n            pg.send(dst, cur_k[r])\n            pg.send(dst, cur_v[r])\n            comm[r] += cur_k[r].nbytes + cur_v[r].nbytes\n        # 2) 所有 rank 再 recv（此时 mailbox 一定非空）\n        for r in range(N):\n            pg = world[r]\n            src = (r - 1) % N\n            nk, nv = pg.recv(src), pg.recv(src)\n            acc_k[r].append(nk)\n            acc_v[r].append(nv)\n            cur_k[r], cur_v[r] = nk, nv\n\n    outs, pairs = [], []\n    for r in range(N):\n        own = blocks[r]\n        # 收到的顺序是 (r-1), (r-2), ..., (r-(N-1))\n        key_idx = np.concatenate([own] + [blocks[(r - 1 - hop) % N] for hop in range(N - 1)])\n        k_all = np.concatenate([k[own]] + acc_k[r], 0)\n        v_all = np.concatenate([v[own]] + acc_v[r], 0)\n        m = mask[np.ix_(own, key_idx)]\n        outs.append(local_out(q[own], k_all, v_all, m, d, h))\n        pairs.append(int(m.sum()))\n    return np.concatenate(outs, 0), pairs, sum(comm) // N\n\n\ndef zigzag_pairs(n: int, N: int, mask: np.ndarray) -> list[int]:\n    \"\"\"zigzag 的负载：rank r 拿第 r 块和第 (2N-1-r) 块。\n\n    正确性与 cp_qk 相同（纯加归约，求和顺序无关），所以这里只量失衡。\n    \"\"\"\n    c = n // (2 * N)\n    out = []\n    for r in range(N):\n        idx = zigzag_indices(n, N, r)\n        out.append(int(mask[np.ix_(idx, idx)].sum()))\n    return out\n\n\n# ======================================================================\ndef demo() -> None:\n    n, d, h = 256, 32, 4\n    q, k, v, _ = make_qkv(n, d, h)\n    mask_causal = np.tril(np.ones((n, n), dtype=bool))\n    mask_full = np.ones((n, n), dtype=bool)\n\n    title(\"CP 三种切法：pair、通信、失衡\")\n\n    # ---------------- 1. 全序列（训练 / prefill）----------------\n    print(\"\\n  [场景 1] 全序列 + 因果掩码（= HSTU/MTGR 训练、GR prefill）\")\n    ref = reference(q, k, v, mask_causal, d, h)\n    rows = []\n    for N in (2, 4, 8):\n        world = World(N)\n        out_q, pairs_q, comm_q = cp_q(world, q, k, v, mask_causal, d, h)\n        world = World(N)\n        out_qk, pairs_qk, comm_qk = cp_qk(world, q, k, v, mask_causal, d, h)\n        zz = zigzag_pairs(n, N, mask_causal)\n        rows.append((N,\n                     f\"{load_imbalance(pairs_q):.2f}\",\n                     f\"{load_imbalance(pairs_qk):.2f}\",\n                     f\"{load_imbalance(zz):.2f}\",\n                     f\"{comm_q / 1024:.0f}\", f\"{comm_qk / 1024:.0f}\",\n                     f\"{np.abs(out_qk - ref).max():.1e}\"))\n    print(table(rows, (\"N\", \"cp_q 失衡\", \"cp_qk 失衡\", \"zigzag 失衡\",\n                       \"cp_q 通信 KiB\", \"cp_qk 通信 KiB\", \"cp_qk 误差\")))\n    print(\"     => cp_q 的通信恒为 0，且结果精确（误差 1e-16 级）。\")\n    print(\"        cp_q 与 cp_qk 的『算』失衡相同，都是 2 − 1/N（N=8 时 1.87）。\")\n    print(\"        注意：两者的区别不是 pair 数，而是**通信**。\")\n    print(\"        zigzag 把失衡压到 1.00，代价是额外的重排 kernel。\")\n\n    print(\"\\n     注：cp_q 在因果掩码下『算』仍失衡（前面的 rank 看得少），\")\n    print(\"         但『读』是均衡的（每卡都读全量 KV）。GR 的瓶颈在读取。\")\n\n    # ---------------- 2. decode（beam）----------------\n    print(\"\\n  [场景 2] decode：q = B（beam 宽度），KV = P（非因果）\")\n    print(\"           这正是 beam 让 CP 重新有对象的地方\")\n    rows = []\n    kv_per_tok = d * 4 * 2                      # K+V 字节/token\n    for B, P in ((1, 4096), (128, 4096), (512, 4096), (900, 32768)):\n        full = P * kv_per_tok\n        rows.append((B, P,\n                     f\"{full / 1024:.0f}\",\n                     f\"{full / B / 1024:.1f}\",\n                     f\"{B * P / 1e6:.2f}\"))\n    print(table(rows, (\"B\", \"P\", \"cp_q 每卡读 KiB\", \"每 query 摊到 KiB\",\n                       \"pair/步 (M)\")))\n    print(\"     => cp_q 每卡要读全量 KV（第 3 列与 B 无关），\")\n    print(\"        但因为一个请求里有 B 个 query，**每 query 的读取量按 1/B 摊薄**。\")\n    print(\"        这是 LLM decode（B=1）永远做不到的事。\")\n\n    # ---------------- 3. 通信/计算 收支平衡点 ----------------\n    print(\"\\n  [场景 3] cp_q vs cp_qk 的真实账（两者的字节数其实相等）\")\n    print(\"            cp_q  多读  (1 − 1/N)·P·κ  来自 HBM（~800 GB/s）\")\n    print(\"            cp_qk 通信  (1 − 1/N)·P·κ  走互联（~200 GB/s）\")\n    rows = []\n    for P, N in ((1024, 8), (4096, 8), (16384, 8), (65536, 8)):\n        bytes_ = (N - 1) / N * P * kv_per_tok\n        t_read = bytes_ / 800e9\n        t_comm = bytes_ / 200e9\n        rows.append((P, N, f\"{bytes_ / 1024:.0f}\",\n                     f\"{t_read * 1e9:.0f} ns\", f\"{t_comm * 1e9:.0f} ns\",\n                     f\"{t_comm / t_read:.1f}x\"))\n    print(table(rows, (\"P\", \"N\", \"字节数 (两边相同)\", \"HBM 多读\", \"互联通信\",\n                       \"通信/多读\")))\n    print(\"     => **两边的字节数完全相等**。胜负只取决于用哪种带宽。\")\n    print(\"        HBM:互联 ≈ 4:1 => cp_q 恒定赢 4 倍，与 P、N 无关。\")\n    print(\"        这是 Medha 的 KVP 与 GR 的 cp_q 在结构上占优的真正原因。\")\n\n    # ---------------- 4. 何时该用 cp_qk ----------------\n    print(\"\\n  [场景 4] 什么时候反而必须用 cp_qk？\")\n    rows = [\n        (\"KV 单卡装得下\", \"cp_q\", \"零通信、精确、无重排\"),\n        (\"KV 单卡装不下（L > 32K）\", \"cp_qk\", \"只能切，通信是硬代价\"),\n        (\"有 softmax（LONGER）\", \"都必须\", \"需要 online softmax，归约不再是加法\"),\n        (\"q 很小（LONGER 的 50~250）\", \"cp_q 也不划算\", \"省下的绝对工作量本来就小\"),\n    ]\n    print(table(rows, (\"条件\", \"选择\", \"理由\")))\n\n\nif __name__ == \"__main__\":\n    demo()\n", "codePath": "parallel/cp_min.py", "out": "\n==============================================================================\nCP 三种切法：pair、通信、失衡\n==============================================================================\n\n  [场景 1] 全序列 + 因果掩码（= HSTU/MTGR 训练、GR prefill）\nN  cp_q 失衡  cp_qk 失衡  zigzag 失衡  cp_q 通信 KiB  cp_qk 通信 KiB  cp_qk 误差\n-  -------  --------  ---------  -----------  ------------  --------\n2  1.50     1.50      1.00       0            64            0.0e+00 \n4  1.75     1.75      1.00       0            96            2.8e-16 \n8  1.87     1.87      1.00       0            112           2.2e-16 \n     => cp_q 的通信恒为 0，且结果精确（误差 1e-16 级）。\n        cp_q 与 cp_qk 的『算』失衡相同，都是 2 − 1/N（N=8 时 1.87）。\n        注意：两者的区别不是 pair 数，而是**通信**。\n        zigzag 把失衡压到 1.00，代价是额外的重排 kernel。\n\n     注：cp_q 在因果掩码下『算』仍失衡（前面的 rank 看得少），\n         但『读』是均衡的（每卡都读全量 KV）。GR 的瓶颈在读取。\n\n  [场景 2] decode：q = B（beam 宽度），KV = P（非因果）\n           这正是 beam 让 CP 重新有对象的地方\nB    P      cp_q 每卡读 KiB  每 query 摊到 KiB  pair/步 (M)\n---  -----  ------------  --------------  ----------\n1    4096   1024          1024.0          0.00      \n128  4096   1024          8.0             0.52      \n512  4096   1024          2.0             2.10      \n900  32768  8192          9.1             29.49     \n     => cp_q 每卡要读全量 KV（第 3 列与 B 无关），\n        但因为一个请求里有 B 个 query，**每 query 的读取量按 1/B 摊薄**。\n        这是 LLM decode（B=1）永远做不到的事。\n\n  [场景 3] cp_q vs cp_qk 的真实账（两者的字节数其实相等）\n            cp_q  多读  (1 − 1/N)·P·κ  来自 HBM（~800 GB/s）\n            cp_qk 通信  (1 − 1/N)·P·κ  走互联（~200 GB/s）\nP      N  字节数 (两边相同)  HBM 多读    互联通信      通信/多读\n-----  -  ----------  --------  --------  -----\n1024   8  224         287 ns    1147 ns   4.0x \n4096   8  896         1147 ns   4588 ns   4.0x \n16384  8  3584        4588 ns   18350 ns  4.0x \n65536  8  14336       18350 ns  73400 ns  4.0x \n     => **两边的字节数完全相等**。胜负只取决于用哪种带宽。\n        HBM:互联 ≈ 4:1 => cp_q 恒定赢 4 倍，与 P、N 无关。\n        这是 Medha 的 KVP 与 GR 的 cp_q 在结构上占优的真正原因。\n\n  [场景 4] 什么时候反而必须用 cp_qk？\n条件                     选择         理由                       \n---------------------  ---------  -------------------------\nKV 单卡装得下               cp_q       零通信、精确、无重排               \nKV 单卡装不下（L > 32K）      cp_qk      只能切，通信是硬代价               \n有 softmax（LONGER）      都必须        需要 online softmax，归约不再是加法\nq 很小（LONGER 的 50~250）  cp_q 也不划算  省下的绝对工作量本来就小             \n"}, {"id": "ep", "group": "并行轴", "title": "EP", "blurb": "四步 + 三个量 + 路由相关性", "body": "<h1>06 · EP（专家并行）<\/h1>\n<blockquote><p><strong>一句话<\/strong>：EP 只切 MoE 层，通信量是 TP 的 k 倍，且<strong>与专家数无关<\/strong>。<\/p>\n<p>它对 GR 特别友好，因为 beam 天然提供了 batch。<\/p><\/blockquote>\n<h2>对应代码<\/h2>\n<table><thead><tr><th>来源<\/th><th>文件 / 链接<\/th><\/tr><\/thead><tbody><tr><td>vLLM<\/td><td><code>--enable-expert-parallel<\/code>（EP = TP × DP）<\/td><\/tr><tr><td>Megatron<\/td><td><code>megatron/core/transformer/moe/<\/code><\/td><\/tr><tr><td>MegaScale-Infer<\/td><td>arXiv 2504.02263（attention / FFN 分离 + EP + ping-pong）<\/td><\/tr><tr><td>Helix<\/td><td>arXiv 2507.07120（attention 用 KVP，FFN 用 TP×EP）<\/td><\/tr><tr><td>TEMPO<\/td><td>arXiv 2608.13057（EP 负载均衡，makespan）<\/td><\/tr><\/tbody><\/table>\n<h2>四步<\/h2>\n<pre><code>   本 rank 的 token  x [n, d]\n        │\n   ① router:  score = x @ Wg        [n, E]，取 top-k\n        │     → b_eff = n·k 个 (token, expert) 对\n        ▼\n   ② dispatch: all-to-all\n        │     每个 token 发到「持有该专家的那张卡」\n        │     体积 = b_eff · d · bytes\n        ▼\n   ③ grouped GEMM\n        │     每个专家算自己收到的那批行：rows_per_expert = b_eff / E\n        ▼\n   ④ combine: all-to-all\n        │     结果还回去，按 token 汇总\n        ▼\n     输出 [n, d]<\/code><\/pre>\n<h2>三个必须记住的量<\/h2>\n<h3>量 A：通信量与专家数无关<\/h3>\n<pre><code>V_EP = 2 · B · k · d · bytes\n        ↑\n     没有 E<\/code><\/pre>\n<table><thead><tr><th>E<\/th><th>all-to-all 字节<\/th><th>分片粒度<\/th><th>每专家行数<\/th><\/tr><\/thead><tbody><tr><td>8<\/td><td>512 KiB<\/td><td>2 专家/卡<\/td><td>128.0<\/td><\/tr><tr><td>16<\/td><td><strong>512 KiB<\/strong><\/td><td>4 专家/卡<\/td><td>64.0<\/td><\/tr><tr><td>64<\/td><td><strong>512 KiB<\/strong><\/td><td>16 专家/卡<\/td><td>16.0<\/td><\/tr><tr><td>256<\/td><td><strong>512 KiB<\/strong><\/td><td>64 专家/卡<\/td><td>4.0<\/td><\/tr><\/tbody><\/table>\n<p>第 2 列完全不变。<strong>加专家只改分片粒度，不改通信量。<\/strong><\/p>\n<p>这是「EP 能扩容量而不扩通信」的全部内容 —— 也是它比 TP 更适合做大模型的理由。<\/p>\n<h3>量 B：EP 的通信量是 TP 的 k 倍<\/h3>\n<pre><code>V_EP = 2·B·k·d         V_TP = 2·B·d\nV_EP / V_TP = k                  （k=8 时 8 倍）<\/code><\/pre>\n<p><strong>这个比值与 B 无关。<\/strong> 加大 beam 不会改变 EP 相对 TP 的代价 ——<\/p>\n<p>这是一个反直觉但重要的负结果。<\/p>\n<h3>量 C：每专家行数 = B·k / E<\/h3>\n<table><thead><tr><th>场景<\/th><th>B<\/th><th>E<\/th><th>行/专家<\/th><\/tr><\/thead><tbody><tr><td>LLM decode<\/td><td>1<\/td><td>256<\/td><td><strong>0.01<\/strong><\/td><\/tr><tr><td>LLM batch=32<\/td><td>32<\/td><td>256<\/td><td>0.25<\/td><\/tr><tr><td>GR beam=128<\/td><td>128<\/td><td>64<\/td><td>4.00<\/td><\/tr><tr><td>GR beam=512<\/td><td>512<\/td><td>64<\/td><td><strong>16.00<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>低并发 LLM 的 MoE 是「每个专家算不到 0.1 行」，GEMM 效率极差。<\/p>\n<p>GR 即使并发 = 1，beam 也提供了 512 的 batch。<\/p>\n<blockquote><p><strong>这是 beam 对 EP 唯一真正的正面作用<\/strong>，而且它是个<strong>新<\/strong>论点：<\/p>\n<p>现有 EP 文献都在讨论「continuous batching 提供 batch」，<\/p>\n<p>没人注意到 GR 不需要它 —— beam 自己就是 batch。<\/p><\/blockquote>\n<h2>唯一的结构性风险：路由相关性<\/h2>\n<p><code>parallel/ep_min.py<\/code> 的实测（同样的 B、同样的模型，只改输入相似度）：<\/p>\n<table><thead><tr><th>输入<\/th><th>噪声<\/th><th>激活专家<\/th><th>专家失衡<\/th><th>rank 失衡<\/th><\/tr><\/thead><tbody><tr><td>beam（同前缀）<\/td><td>0.02<\/td><td><strong>2/16<\/strong><\/td><td><strong>8.0×<\/strong><\/td><td>2.00×<\/td><\/tr><tr><td>beam（已分叉）<\/td><td>0.3<\/td><td>6/16<\/td><td>7.1×<\/td><td>1.82×<\/td><\/tr><tr><td>iid 独立请求<\/td><td>1.0<\/td><td>15/16<\/td><td>4.0×<\/td><td>1.59×<\/td><\/tr><\/tbody><\/table>\n<p><strong>只因为输入相似度不同，专家负载差一个量级。<\/strong><\/p>\n<p>为什么这特别要命：<\/p>\n<ul>\n<li>all-to-all 的完成时间取决于<strong>最忙的那个目的地<\/strong>（max column sum），不是平均值<\/li>\n<li>beam 的 B 条假设共享前缀 ⇒ 它们路由到同一批专家 ⇒ 热专家<\/li>\n<\/ul>\n<p>对比 LLM：<\/p>\n<table><thead><tr><th><\/th><th>batch 的构成<\/th><th>路由<\/th><\/tr><\/thead><tbody><tr><td>LLM<\/td><td>不同请求，天然分散<\/td><td>相对均匀<\/td><\/tr><tr><td>GR<\/td><td>同一请求的不同假设，天然聚拢<\/td><td><strong>相关<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>这是 GR 的 EP 与 LLM 的 EP 最关键的区别，也是唯一还没有公开工作的空白点。<\/p>\n<h2>硬约束：必须留在单机域内<\/h2>\n<p>12 层 MoE、bf16、d=2048、k=2：<\/p>\n<table><thead><tr><th>B<\/th><th>每步总量<\/th><th>卡内 HCCS 200 GB/s<\/th><th>跨机 200 Gbps<\/th><\/tr><\/thead><tbody><tr><td>128<\/td><td>25 MB<\/td><td>0.1 ms<\/td><td>1.0 ms<\/td><\/tr><tr><td>512<\/td><td>101 MB<\/td><td>0.5 ms<\/td><td>4.0 ms<\/td><\/tr><tr><td>900<\/td><td>177 MB<\/td><td>0.9 ms<\/td><td>7.1 ms<\/td><\/tr><\/tbody><\/table>\n<p>跨机是 4~7 ms 的<strong>硬增量<\/strong>，直接压在 20~40 ms 的 TPOT 上（+10~30%），<\/p>\n<p>且 P99 更糟。卡内只有 0.5 ms —— <strong>差一个量级<\/strong>。<\/p>\n<blockquote><p>这也解释了 Helix / MegaScale 为什么都强调 NVLink domain。<\/p><\/blockquote>\n<h2>与 CP / TP 的分工<\/h2>\n<table><thead><tr><th>轴<\/th><th>切什么<\/th><th>通信量<\/th><th>随 B 的走势<\/th><\/tr><\/thead><tbody><tr><td>TP<\/td><td>权重（每层都切）<\/td><td><code>2·B·d<\/code> all-reduce<\/td><td>∝ B，B 大时便宜<\/td><\/tr><tr><td>EP<\/td><td>专家（只切 MoE 层）<\/td><td><code>2·B·k·d<\/code> 两次 all-to-all<\/td><td>∝ B，是 TP 的 k 倍<\/td><\/tr><tr><td>CP<\/td><td>序列 / KV<\/td><td><code>2·(N−1)·L·d<\/code>（ring）<\/td><td><strong>与 B 无关<\/strong><\/td><\/tr><\/tbody><\/table>\n<p><strong>三个轴切的是三个不同的项<\/strong> —— 这就是「混合并行是必然的」而不是「可选的」的证明：<\/p>\n<ul>\n<li>权重读取 → 只有 TP/EP 能切<\/li>\n<li>prompt KV 读取 → 只有 CP 能切<\/li>\n<li>decode 的计算 → beam 能切<\/li>\n<\/ul>\n<h2>常见误解<\/h2>\n<table><thead><tr><th>误解<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td>「EP 的通信随专家数增长」<\/td><td>不增长。<code>V ∝ B·k<\/code>，与 E 无关<\/td><\/tr><tr><td>「EP 比 TP 省通信」<\/td><td>贵 k 倍。EP 的价值是<strong>扩容量<\/strong>，不是省通信<\/td><\/tr><tr><td>「beam 不影响 EP」<\/td><td>beam 就是 batch。它把每专家行数从 0.01 抬到 16<\/td><\/tr><tr><td>「路由失衡靠负载均衡 loss 解决」<\/td><td>那影响训练；推理时的失衡是<strong>输入相关性<\/strong>造成的<\/td><\/tr><tr><td>「EP 可以跨机」<\/td><td>跨机会吃掉 10~30% TPOT。单机域才是 EP 的舒适区<\/td><\/tr><\/tbody><\/table>\n<h2>对应代码<\/h2>\n<p><code>parallel/ep_min.py<\/code><\/p>\n<ul>\n<li>四步的完整实现（含「发错卡」的断言）<\/li>\n<li>量 A/B/C 三张表<\/li>\n<li>路由相关性的三行对照（最值得看的一张）<\/li>\n<li>跨机 vs 卡内的绝对耗时<\/li>\n<\/ul>", "code": "\"\"\"EP 最小实现 —— 把一个 MoE 层摊到 N 张卡上。\n\n对应代码: vLLM `--enable-expert-parallel`、Megatron `moe/`、\n          MegaScale-Infer（attention / FFN 分离 + EP）、\n          RankMixer 的 Sparse-MoE、OneRec 的 MoE\n\n=======================================================================\n一个 MoE + EP 层就四步\n=======================================================================\n\n  1. router     每个 token 对 E 个专家打分，取 top-k\n                => 产生 b_eff = (token 数) × k 个 (token, expert) 对\n\n  2. dispatch   all-to-all：把 token 发到「持有目标专家的那张卡」\n                体积 = b_eff × d × bytes\n\n  3. grouped GEMM  每个专家算自
