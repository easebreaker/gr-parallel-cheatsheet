<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GR 模型机制速查 · 模型 × 并行轴</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --panel2:#1b222b; --fg:#d7dee8; --dim:#8b97a7;
    --line:#242c37; --acc:#5ec8d8; --acc2:#e0b060; --ok:#6fbf73; --bad:#e06c75;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  /* ---------- 顶栏（只在窄屏出现） ---------- */
  .topbar{display:none;position:sticky;top:0;z-index:40;align-items:center;gap:10px;
          padding:9px 12px;background:rgba(21,26,33,.96);backdrop-filter:blur(8px);
          border-bottom:1px solid var(--line)}
  .topbar .burger{width:34px;height:34px;flex:0 0 34px;display:flex;align-items:center;
                  justify-content:center;border:1px solid var(--line);border-radius:8px;
                  background:var(--panel2);color:var(--fg);cursor:pointer;font-size:15px}
  .topbar .tt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;
              text-overflow:ellipsis}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45}
  /* ---------- 侧栏 ---------- */
  aside{width:264px;flex:0 0 264px;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;height:100vh;position:sticky;top:0;z-index:50}
  .brand{padding:16px 16px 10px}
  .brand h1{margin:0;font-size:15px;letter-spacing:.3px}
  .brand p{margin:4px 0 0;font-size:11.5px;color:var(--dim)}
  .search{padding:0 12px 10px}
  .search input{width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--line);
                background:var(--panel2);color:var(--fg);font-size:12.5px;outline:none}
  .search input:focus{border-color:var(--acc)}
  nav{overflow-y:auto;flex:1;padding-bottom:24px;-webkit-overflow-scrolling:touch}
  .grp{padding:12px 16px 4px;font-size:10.5px;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase}
  .item{padding:7px 16px 7px 20px;cursor:pointer;border-left:2px solid transparent;font-size:13px}
  .item:hover{background:var(--panel2)}
  .item.on{background:var(--panel2);border-left-color:var(--acc);color:#fff}
  .item small{display:block;color:var(--dim);font-size:10.5px;line-height:1.35}
  /* ---------- 布局 ---------- */
  .shell{display:flex;height:100vh}
  /* ---------- 主区 ---------- */
  main{flex:1;min-width:0;height:100vh;overflow-y:auto;padding:26px 40px 80px;max-width:1080px;
       -webkit-overflow-scrolling:touch}
  .head h2{margin:0 0 4px;font-size:22px}
  .head .blurb{color:var(--dim);font-size:13px;margin:0 0 18px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .tab{padding:7px 14px;cursor:pointer;font-size:12.5px;color:var(--dim);border-bottom:2px solid transparent}
  .tab:hover{color:var(--fg)}
  .tab.on{color:var(--acc);border-bottom-color:var(--acc)}
  .pane{display:none}
  .pane.on{display:block}
  /* ---------- 排版 ---------- */
  h1,h2,h3,h4{line-height:1.35}
  .doc h1{font-size:21px;margin:0 0 14px}
  .doc h2{font-size:16.5px;margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .doc h3{font-size:14.5px;margin:22px 0 8px;color:var(--acc)}
  .doc p{margin:9px 0}
  .doc ul{margin:8px 0;padding-left:22px}
  .doc li{margin:4px 0}
  .doc code{background:#0a0d12;border:1px solid var(--line);border-radius:4px;
            padding:1px 5px;font-family:var(--mono);font-size:12px;color:#a8d8e8}
  .doc pre{background:#0a0d12;border:1px solid var(--line);border-radius:8px;
           padding:14px 16px;overflow-x:auto;margin:14px 0}
  .doc pre code{background:none;border:none;padding:0;font-size:12px;line-height:1.55;color:#c3cdd9}
  .doc blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid var(--acc2);
                  background:#171d25;color:#c8d2de;border-radius:0 6px 6px 0}
  .doc blockquote p{margin:5px 0}
  .doc table{border-collapse:collapse;margin:14px 0;font-size:12.5px;width:100%}
  .doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  .doc th{background:var(--panel2);color:#cfd8e3;font-weight:600}
  .doc tr:nth-child(even) td{background:#131922}
  .doc a{color:var(--acc)}
  /* ---------- 代码 / 输出 ---------- */
  pre.src{background:#0a0d12;border:1px solid var(--line);border-radius:8px;padding:16px;
          overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.55;margin:0}
  .codebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
           font-size:11.5px;color:var(--dim);font-family:var(--mono)}
  .codebar button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
                  padding:3px 10px;border-radius:5px;cursor:pointer;font-size:11px}
  .codebar button:hover{border-color:var(--acc)}
  /* 简易高亮 */
  .k{color:#c792ea}.s{color:#c3e88d}.c{color:#5f6b7a;font-style:italic}.n{color:#f78c6c}.f{color:#82aaff}
  /* ---------- 矩阵 ---------- */
  .mx{border-collapse:collapse;font-size:13px;margin:18px 0}
  .mx th,.mx td{border:1px solid var(--line);padding:11px 16px}
  .mx th{background:var(--panel2);color:var(--dim);font-weight:600;font-size:12px}
  .mx td.cell{cursor:pointer;text-align:center;min-width:92px;font-weight:600}
  .mx td.cell:hover{outline:2px solid var(--acc)}
  .g0{background:#1d2a20;color:#8fce9a}   /* 无对象 */
  .g1{background:#2a2720;color:#dcc48a}   /* 有条件 */
  .g2{background:#1e2a30;color:#7fd0e0}   /* 主战场 */
  .gn{background:#212630;color:#8b97a7}   /* 无关/无定义 */
  .legend{font-size:12px;color:var(--dim);margin-top:10px}
  .kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);
       border-radius:4px;padding:0 5px;font-size:11px}
  /* ---------- 窄屏：抽屉式侧栏 ---------- */
  @media (max-width:820px){
    body{font-size:14.5px}
    .topbar{display:flex}
    .shell{height:auto;min-height:100vh;padding-top:0}
    aside{position:fixed;top:0;left:0;bottom:0;height:100%;width:min(84vw,300px);
          flex:none;transform:translateX(-102%);transition:transform .22s ease;
          box-shadow:2px 0 26px rgba(0,0,0,.5)}
    body.drawer aside{transform:translateX(0)}
    body.drawer .scrim{display:block}
    main{height:auto;overflow:visible;padding:14px 15px 72px;max-width:none}
    .brand p{display:none}
    .head h2{font-size:19px}
    .doc h1{font-size:18.5px}
    .doc h2{font-size:15.5px;margin:24px 0 8px}
    .doc h3{font-size:14px}
    /* 宽表格在窄屏横向滚动，不挤成竖排 */
    .doc{overflow-x:auto}
    .doc table{font-size:11.5px;min-width:0}
    .doc table th,.doc table td{padding:5px 7px;white-space:nowrap}
    .doc pre,.doc pre code{font-size:11px}
    .doc pre{padding:11px 12px}
    .mx th,.mx td{padding:8px 9px;font-size:11.5px}
    .mx td.cell{min-width:70px}
    .tabs{gap:0;overflow-x:auto}
    .tab{padding:8px 12px;white-space:nowrap}
  }
</style>
</head>

</div>
<div class="shell">
<aside id="side">
  <div class="brand">
    <h1>GR 机制速查</h1>
    <p>7 个模型 · 4 个并行轴 · 可跑的最小实现</p>

  <div class="search"><input id="q" placeholder="搜索（/ 聚焦）"></div>
  <nav id="nav"></nav>
</aside>
<div class="scrim" id="scrim"></div>
<main id="main"></main>
</div>
<script>
const DATA = [{"id": "map", "group": "总览", "title": "00 · 地图", "blurb": "四个模型 × 三个并行轴的一页总表", "body": "<h1>00 · 地图：七个模型 × 四个并行轴<\/h1>\n<blockquote><p>这个文件夹只回答一个问题：<strong>一个模型能不能切、该切哪一维、切了值不值。<\/strong><\/p>\n<p>答案不来自实验，来自三条结构事实：<strong>归约代数、掩码拓扑、单卡容量<\/strong>，<\/p>\n<p>再加一个统一变量：<strong><code>q/L<\/code><\/strong>。<\/p><\/blockquote>\n<h2>一句话总表<\/h2>\n<table><thead><tr><th>模型<\/th><th>CP<\/th><th>EP<\/th><th>TP<\/th><th>beam<\/th><th>一句话<\/th><\/tr><\/thead><tbody><tr><td>TIGER<\/td><td>无对象<\/td><td>不适用<\/td><td>不需要<\/td><td>无对象<\/td><td>S=20 / B=10~20 ⇒ 全是小量<\/td><\/tr><tr><td>HSTU<\/td><td>能切但不需要<\/td><td>仅 MoE 版<\/td><td>可以<\/td><td>无关<\/td><td>纯加归约，但 KV 单卡装得下<\/td><\/tr><tr><td>MTGR<\/td><td>有对象<\/td><td>有条件<\/td><td>可以<\/td><td>无关<\/td><td>静态段是方阵 ⇒ 失衡 1.00<\/td><\/tr><tr><td>LONGER<\/td><td>对象小<\/td><td>论文未用<\/td><td>可以<\/td><td>无关<\/td><td><code>q/L≈1e-2<\/code>，Amdahl 只 1.2~1.3×<\/td><\/tr><tr><td>RankMixer<\/td><td>无定义<\/td><td>主战场<\/td><td>可以<\/td><td>无关<\/td><td>T 是特征子空间数，没有 L 维<\/td><\/tr><tr><td>HyFormer<\/td><td>买延迟<\/td><td>仅 MoE<\/td><td>有用<\/td><td>不适用<\/td><td>q≈16，算便宜读贵 ⇒ CP 切读<\/td><\/tr><tr><td>OpenOneRec<\/td><td>有对象<\/td><td>闭源才有<\/td><td>8 卡触顶<\/td><td>主战场<\/td><td>q=B=512，beam 是主维度<\/td><\/tr><\/tbody><\/table>\n<h2>统一变量：<code>q/L<\/code><\/h2>\n<p>所有 CP 结论都可以由这一个比值推出来。<\/p>\n<table><thead><tr><th>模型<\/th><th>q<\/th><th>L<\/th><th><code>q/L<\/code><\/th><th>归约<\/th><th>CP 有对象吗<\/th><\/tr><\/thead><tbody><tr><td>TIGER（encoder）<\/td><td>3S≈60<\/td><td>3S≈60<\/td><td>1.0<\/td><td>softmax<\/td><td><strong>无<\/strong>（都太小）<\/td><\/tr><tr><td>HSTU<\/td><td>L<\/td><td>L<\/td><td>1.0<\/td><td><strong>纯加<\/strong><\/td><td>能切，但容量说不需要<\/td><\/tr><tr><td>MTGR<\/td><td>L<\/td><td>L<\/td><td>0.94<\/td><td><strong>纯加<\/strong><\/td><td>有（方阵，失衡 1.00）<\/td><\/tr><tr><td>LONGER（cross）<\/td><td>100~250<\/td><td>10K<\/td><td><strong>0.01~0.025<\/strong><\/td><td>softmax<\/td><td>有，但上限 1.2~1.3×<\/td><\/tr><tr><td>HyFormer<\/td><td>16<\/td><td>10K<\/td><td><strong>0.0016<\/strong><\/td><td>softmax<\/td><td>有，且<strong>是真的有用<\/strong>（切读）<\/td><\/tr><tr><td>OpenOneRec（decode）<\/td><td><strong>B=512<\/strong><\/td><td>P≈3K<\/td><td>0.17<\/td><td>softmax<\/td><td>有（beam 让 q 变大）<\/td><\/tr><tr><td>RankMixer<\/td><td>T=16<\/td><td><strong>无<\/strong><\/td><td>—<\/td><td>无<\/td><td><strong>无定义<\/strong><\/td><\/tr><\/tbody><\/table>\n<pre><code>q/L ≈ 1        → 「方阵」。CP 的收益 ∝ 1/C，但容量判据可能说不需要\nq/L ≪ 1        → 「扁矩阵」。能省的绝对工作量本来就小\nq/L 由 B 决定  → beam 把一个「扁平」的 decode 变回了「方阵」<\/code><\/pre>\n<h2>三条判据<\/h2>\n<p>任何「能不能并行」的问题，按顺序问三句：<\/p>\n<h3>判据 1：归约代数 —— 这一步允许切开吗？<\/h3>\n<p>看输出是不是 <code>Σ_j w_ij V_j<\/code> 这种<strong>纯加<\/strong>形式。<\/p>\n<table><thead><tr><th>模型<\/th><th>归约<\/th><th>跨卡合并方式<\/th><\/tr><\/thead><tbody><tr><td>HSTU<\/td><td><strong>纯加<\/strong>（SiLU）<\/td><td>直接相加，精确<\/td><\/tr><tr><td>MTGR<\/td><td><strong>纯加<\/strong>（同上）<\/td><td>直接相加，精确<\/td><\/tr><tr><td>LONGER<\/td><td><strong>softmax<\/strong><\/td><td>必须 online softmax / LSE<\/td><\/tr><tr><td>HyFormer<\/td><td><strong>softmax<\/strong><\/td><td>同上<\/td><\/tr><tr><td>TIGER<\/td><td><strong>softmax<\/strong><\/td><td>同上<\/td><\/tr><tr><td>OpenOneRec<\/td><td><strong>softmax<\/strong><\/td><td>同上<\/td><\/tr><tr><td>RankMixer<\/td><td>无 attention<\/td><td>不适用<\/td><\/tr><\/tbody><\/table>\n<blockquote><p>只有 HSTU / MTGR 是纯加。<strong>「三类 GR 都是纯加归约」这句话是错的。<\/strong><\/p><\/blockquote>\n<h3>判据 2：掩码拓扑 —— 切开后失衡多少？<\/h3>\n<table><thead><tr><th>掩码形状<\/th><th>每块工作量<\/th><th>失衡度 max/mean<\/th><\/tr><\/thead><tbody><tr><td>方阵（非因果 / MTGR 静态段）<\/td><td>相同<\/td><td><strong>1.00<\/strong><\/td><\/tr><tr><td>因果三角（HSTU、LONGER merged、TIGER encoder）<\/td><td>∝ 块序号<\/td><td><strong>2 − 1/N<\/strong>（N=8 → 1.87）<\/td><\/tr><tr><td>zigzag 配对后<\/td><td>相同<\/td><td><strong>1.00<\/strong>（代价：重排 kernel）<\/td><\/tr><\/tbody><\/table>\n<p>MTGR 的静态段占比 93~98% ⇒ 整段接近方阵 ⇒ <strong>比纯因果模型更好切<\/strong>。<\/p>\n<h3>判据 3：单卡容量 —— 需要切吗？<\/h3>\n<pre><code>KV 字节 = L · d · 2(K/V) · bytes · 层数<\/code><\/pre>\n<table><thead><tr><th>模型<\/th><th>d<\/th><th>L<\/th><th>KV（32 层）<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>HSTU<\/td><td>512<\/td><td>32K<\/td><td>2.1 GB<\/td><td>装得下 ⇒ 不切<\/td><\/tr><tr><td>LONGER<\/td><td><strong>32<\/strong><\/td><td>10K<\/td><td>9.8 MiB<\/td><td>装得下（要到 100 万才不够）<\/td><\/tr><tr><td>TIGER<\/td><td>64<\/td><td>60<\/td><td>0.18 MiB<\/td><td>装得下<\/td><\/tr><tr><td>OpenOneRec<\/td><td>2048<\/td><td>3K<\/td><td>1.6 GB<\/td><td>装得下<\/td><\/tr><\/tbody><\/table>\n<blockquote><p><strong>前两条说「能切」，第三条才说「要不要切」。<\/strong><\/p>\n<p>大部分争论失败在把前两条当成了第三条。<\/p><\/blockquote>\n<h2>四个并行轴各切什么<\/h2>\n<table><thead><tr><th>轴<\/th><th>切什么<\/th><th>通信量<\/th><th>随 B 的走势<\/th><th>谁需要<\/th><\/tr><\/thead><tbody><tr><td>CP<\/td><td>序列 / prompt KV<\/td><td>ring: <code>2(N−1)Pd<\/code>；cp_q: <code>B·d<\/code> 的 LSE<\/td><td><strong>与 B 无关<\/strong><\/td><td>长 prompt 的 prefill<\/td><\/tr><tr><td>EP<\/td><td>专家<\/td><td><code>2·B·k·d<\/code> 两次 all-to-all<\/td><td>∝ B，是 TP 的 k 倍<\/td><td>MoE 模型<\/td><\/tr><tr><td>TP<\/td><td>权重（每层）<\/td><td><code>2·B·d<\/code> all-reduce<\/td><td>∝ B，B 大时便宜<\/td><td>单卡装不下<\/td><\/tr><tr><td>beam<\/td><td>搜索宽度 / tree KV<\/td><td>全局 top-B：<code>B·K·4<\/code> 字节<\/td><td><strong>极小（MB 级）<\/strong><\/td><td>只有自回归 GR<\/td><\/tr><\/tbody><\/table>\n<p><strong>读法<\/strong>：先看「谁需要」，再看通信量。<\/p>\n<h2>一个必须记住的负结论<\/h2>\n<p><strong>每一项成本只有唯一一个轴能切。<\/strong> 所以混合并行不是「把加速比乘起来」，<\/p>\n<p>而是「把每一项分别除以它那个轴的度数，再相加」。<\/p>\n<pre><code>t_mixed = Σ f_i / n_i          speedup = 1 / Σ(f_i / n_i)<\/code><\/pre>\n<p>细节见 <code>11-混合并行.md<\/code>。那里有一个惊人但正确的事实：<\/p>\n<p><strong>乘积公式会「低估」<\/strong>（3.26× vs 2.17×），因为单轴加速比里已经含了<\/p>\n<p>「不受影响的那部分」，乘起来就重复计数了。<\/p>\n<h2>四个最常见的混淆<\/h2>\n<table><thead><tr><th>混淆<\/th><th>正确说法<\/th><\/tr><\/thead><tbody><tr><td>「HSTU 二次复杂度 ⇒ 需要 CP」<\/td><td>二次是真的，但单卡装得下 ⇒ 不需要<\/td><\/tr><tr><td>「三类 GR 都是纯加归约」<\/td><td><strong>LONGER / HyFormer / TIGER / OpenOneRec 都是 softmax<\/strong><\/td><\/tr><tr><td>「RankMixer 也有 T 个 token ⇒ 也能切序列」<\/td><td>T 是<strong>特征子空间<\/strong>数，不是序列长度<\/td><\/tr><tr><td>「OpenOneRec 是 MoE，所以能上 EP」<\/td><td><strong>开源的 OpenOneRec 是 dense Qwen3<\/strong>；只有闭源 OneRec 有 24 专家<\/td><\/tr><\/tbody><\/table>\n<h2>怎么用这个文件夹<\/h2>\n<pre><code>python3 run_all.py            # 全部跑一遍，最后打印总表\npython3 run_all.py hstu       # 只看一个\npython3 models/longer_min.py  # 单个文件的完整输出<\/code><\/pre>\n<p>网页：双击 <code>index.html<\/code>（侧栏导航 + 搜索 + 交叉矩阵）。<\/p>\n<p>网页内容由 <code>build.py<\/code> 从这些 <code>.py<\/code> 和 <code>.md<\/code> 生成，改完源码重跑一次即可。<\/p>\n<h2>文件清单<\/h2>\n<pre><code>机制速查/\n├── index.html                 交互式查看器（自包含，可直接双击）\n├── build.py                   从 py + md 生成 index.html\n├── run_all.py                 一次跑完所有 demo\n├── _core.py                   共用的 shape/成本打印 + 假 ProcessGroup\n├── models/\n│   ├── hstu_min.py            纯加归约（SiLU 代替 softmax）\n│   ├── mtgr_min.py            三段掩码 + GLN\n│   ├── longer_min.py          token merge + 扁矩阵 + softmax\n│   ├── hyformer_min.py        16 个 query 读整段\n│   ├── tiger_min.py           RQ-VAE + 小 beam + 约束解码\n│   ├── rankmixer_min.py       零参数 token mixing（转置）\n│   └── onerec_min.py          SID + encoder-decoder + beam\n├── parallel/\n│   ├── cp_min.py              cp_q / cp_qk / zigzag 三方案实测\n│   ├── ep_min.py              四步 + 三个量 + 路由相关性\n│   ├── beam_min.py            naive vs tree attention vs 静态 KV\n│   └── mixed_min.py           CP×EP×TP×beam 的组合规则\n└── docs/                      每个文件对应的机制说明<\/code><\/pre>", "code": "", "codePath": "", "out": ""}, {"id": "hstu", "group": "模型", "title": "HSTU", "blurb": "SiLU 代替 softmax ⇒ 纯加归约", "body": "<h1>01 · HSTU<\/h1>\n<blockquote><p><strong>一句话<\/strong>：把 softmax 换成 SiLU，于是 attention 变成一次普通的加法归约 ——<\/p>\n<p>这一行改动同时决定了它的速度、它的 CP 可行性、以及它为什么不需要 CP。<\/p><\/blockquote>\n<h2>论文<\/h2>\n<ul>\n<li>Zhai et al., *Actions Speak Louder than Words: Trillion-Parameter Sequential<\/li>\n<\/ul>\n<p>  Transducers for Generative Recommendations*, <strong>ICML 2024<\/strong>（Meta）<\/p>\n<ul>\n<li>代码：<code>facebookresearch/generative-recommenders<\/code>（本仓库 <code>_vendor/<\/code> 下有）<\/li>\n<\/ul>\n<h2>结构<\/h2>\n<pre><code> 用户行为序列 (item_id, action, timestamp)\n        │\n        ▼\n   ┌─ 逐 token 嵌入 ─┐\n   │  item emb       │\n   │  action emb     │  ← 三类特征分别嵌入后相加\n   │  time bucket    │\n   └────────┬────────┘\n            ▼\n      ┌───────────────────────────────┐\n      │  HSTU block  × L              │\n      │                               │\n      │   X ──► Q,K,V,U  (四组投影)   │\n      │        │                      │\n      │        │  score = QKᵀ / N     │  ← N = max_seq_len\n      │        │  score += rab(t)     │  ← 时间差查表，O(N²) 张量\n      │        │  A = SiLU(score)     │  ← 关键：不是 softmax\n      │        │  out = A @ V         │  ← 纯加归约\n      │        │  out *= SiLU(U)      │  ← 门控\n      │        └─► + 残差 / LN        │\n      └────────┬──────────────────────┘\n               ▼\n         逐 token 打分 (pointwise) 或 序列聚合 (non-pointwise)<\/code><\/pre>\n<h2>四个机制<\/h2>\n<h3>1. SiLU 代替 softmax（最重要）<\/h3>\n<pre><code>LLM:     A = softmax(score)        A 的每一行和 = 1\nHSTU:    A = SiLU(score)           A 的每一行和 = 任意\n\nout_i = Σ_j A_ij · V_j<\/code><\/pre>\n<p>softmax 的行和恒为 1 ⇒ <code>out_i<\/code> 依赖<strong>整个键集合<\/strong>。少看一半键，结果的<strong>尺度就错了<\/strong>。<\/p>\n<p>SiLU 没有归一化 ⇒ <code>A_ij<\/code> 与键集合无关 ⇒ 输出就是加权和的一部分，<strong>可以分块算再相加<\/strong>。<\/p>\n<blockquote><p>这是 CP 在 HSTU 上「零归约」的全部技术内容。<code>models/hstu_min.py<\/code> 的 <code>[验证 1]<\/code> 用一个<\/p>\n<p><code>max_abs_err ≈ 1e-16<\/code> 的对比把它证明了。<\/p><\/blockquote>\n<h3>2. average factor（除以 N，而不是除以 Σ）<\/h3>\n<p>论文把这个因子叫做 normalization，防止注意力权重随序列长度变大。它有两个实现陷阱：<\/p>\n<ul>\n<li><strong>必须在 SiLU 之前<\/strong>：放到后面会让权重尺度随 L 漂移<\/li>\n<li><strong>必须只除一次<\/strong>：在 CP 下如果每张卡都除一次 N，结果会被放大<\/li>\n<\/ul>\n<h3>3. rab：relative attention bias<\/h3>\n<p>时间戳差值分桶 → 查表 → 得到一个标量，加到 score 上。<\/p>\n<ul>\n<li>参数只有 <code>num_buckets + 1<\/code> 个（<strong>O(1)<\/strong>）<\/li>\n<li>前向张量是 <code>[B, N, N]<\/code>（<strong>O(N²)<\/strong>）<\/li>\n<\/ul>\n<blockquote><p>Meta 的生产实现（<code>modules/stu.py:205<\/code>）里<strong>没有 timestamps、没有 rab，只有窗口<\/strong>。<\/p>\n<p>也就是说：rab 是参考实现的特性，生产上被窗口替代了。<\/p>\n<p>这条事实经常被误读成「rab 是结构性缺陷」。<\/p><\/blockquote>\n<h3>4. u-v 门控<\/h3>\n<p><code>out = (A @ V) ⊙ SiLU(U)<\/code>。U 是<strong>第四组投影<\/strong>，不是 V 的复用。<\/p>\n<p>少一组投影不会报错，但会让模型少一个自由度 —— 这类 bug 只影响精度，不影响 shape。<\/p>\n<h2>成本<\/h2>\n<table><thead><tr><th>量<\/th><th>公式<\/th><th>N=4096 时<\/th><\/tr><\/thead><tbody><tr><td>可见 pair<\/td><td><code>N²<\/code>（无 mask）/ <code>N(N+1)/2<\/code>（因果）<\/td><td>8.4 M<\/td><\/tr><tr><td>FLOPs<\/td><td><code>2 · pairs · d · h<\/code><\/td><td>1.07 G<\/td><\/tr><tr><td>rab 张量<\/td><td><code>N² · 4<\/code> 字节<\/td><td>64 MiB<\/td><\/tr><tr><td>KV 字节<\/td><td><code>N · d · 2 · 2 · 层数<\/code><\/td><td>见判据 3<\/td><\/tr><\/tbody><\/table>\n<h2>并行含义<\/h2>\n<table><thead><tr><th>轴<\/th><th>结论<\/th><th>原因<\/th><\/tr><\/thead><tbody><tr><td><strong>CP<\/strong><\/td><td><strong>数学可行，但不需要<\/strong><\/td><td>纯加归约 ⇒ 零归约；但 N≤32K 时 KV 单卡装得下<\/td><\/tr><tr><td>TP<\/td><td>可以<\/td><td>切 head / 切 d，通用<\/td><\/tr><tr><td>EP<\/td><td>只有 MoE 版本才有意义<\/td><td>原版 HSTU 是 dense<\/td><\/tr><tr><td>beam<\/td><td>无关<\/td><td>判别式，没有自回归<\/td><\/tr><\/tbody><\/table>\n<p><strong>为什么「不需要」值得单独强调<\/strong>：CP 在 LLM 上的全部难点来自「KV 必须分片」。<\/p>\n<p>HSTU 的 KV 在 32K 以内单卡装得下 ⇒ 这个前提不成立 ⇒ 四个难点（online softmax、<\/p>\n<p>负载配平、自定义归约原语、跨卡状态）全部消失，<strong>一个都不剩<\/strong>。<\/p>\n<h2>常见误解<\/h2>\n<table><thead><tr><th>误解<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td>「HSTU 是纯加归约」<\/td><td>对 HSTU 成立，但<strong>不适用于 LONGER<\/strong>（LONGER 用 softmax）<\/td><\/tr><tr><td>「rab 必须物化，所以是结构性缺陷」<\/td><td>Meta 生产路径用窗口绕开了 rab；是已解决的实现代价<\/td><\/tr><tr><td>「二次复杂度 ⇒ 一定要 CP」<\/td><td>二次是真的，但容量判据说不用切<\/td><\/tr><tr><td>「SiLU 替换 softmax 只是省了一点算力」<\/td><td>它改变的是<strong>归约的代数性质<\/strong>，不是速度<\/td><\/tr><\/tbody><\/table>\n<h2>对应代码<\/h2>\n<p><code>models/hstu_min.py<\/code><\/p>\n<ul>\n<li><code>[验证 1]<\/code> 分块求和 vs 整体，<code>max_abs_err ≈ 1e-16<\/code><\/li>\n<li><code>[验证 2]<\/code> 同一份 score 下 SiLU 行和 ≠ 1、softmax 行和 = 1<\/li>\n<li><code>[验证 3]<\/code> pair 与 rab 张量随 N 的真实增长<\/li>\n<\/ul>", "code": "\"\"\"HSTU 最小实现 —— 只保留决定「并行性」的那一半。\n\n论文: Zhai et al., \"Actions Speak Louder than Words: Trillion-Parameter\n      Sequential Transducers for Generative Recommendations\" (ICML'24)\n\n=======================================================================\n一个 HSTU block 里有四个事实，前两个决定了「能不能 CP、要不要 CP」\n=======================================================================\n\n(1) 没有 softmax。\n    HSTU 用 SiLU 代替 softmax：  A = SiLU(score)\n    于是输出是   out_i = Σ_j w_ij · V_j        —— 一个「纯加」归约。\n\n    后果极强：w_ij 不依赖键集合 J(i)。\n    => 把 KV 切开，各卡算局部 Σ，跨卡直接相加就是精确结果。\n    => 不需要 online softmax、不需要 LSE 配平、不需要专门 kernel。\n\n(2) 分数除以 max_seq_len（不是除以 Σ）。\n    论文里的 \"average factor\"。它必须在 SiLU 之前。\n    放到后面会让输出尺度随 L 漂移，几百步后 NaN。\n\n(3) rab（relative attention bias）由时间戳分桶查表得到：\n    参数只有 O(N)，但前向张量是 O(N²)，必须实体化成 [B,N,N]。\n    Meta 的生产路径（modules/stu.py）里没有 rab，只有窗口。\n\n(4) 门控：out = (A @ V) ⊙ SiLU(U)。U 是第四个投影，不是 V。\n\n=======================================================================\n复杂度（一个 block，单样本）\n=======================================================================\n    pairs  = N²                （无 mask）\n    FLOPs  = 2·N²·d·h\n    rab    = N²·4 字节\n\n这确实是真的二次 —— 但见 mtgr_min.py 的结论：\nGR 的 KV 在 N ≤ 32K 时单卡装得下 ⇒ 「不需要切」。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom _core import count_pairs, flops_attn, rng, silu, softmax, step, title\n\n\nclass HSTUBlock:\n    def __init__(self, d: int = 64, n_heads: int = 4, n_buckets: int = 8):\n        self.d = d\n        self.n_heads = n_heads\n        self.head_dim = d // n_heads\n        self.n_buckets = n_buckets\n        g = rng(0)\n        s = 1.0 / np.sqrt(d)\n        # 四组投影：Q / K / V / U。U 是门控，不是 value。\n        self.Wq, self.Wk, self.Wv, self.Wu = (g.normal(0, s, (d, d)) for _ in range(4))\n        self.Wo = g.normal(0, s, (d, d))\n        # rab：时间差 → 桶 → 一个标量。参数 O(n_buckets)，前向张量 O(N²)。\n        self.rab_table = g.normal(0, 0.1, (n_buckets,))\n\n    # ------------------------------------------------------------------\n    def rel_bias(self, tq: np.ndarray, tk: np.ndarray) -> np.ndarray:\n        \"\"\"[Nq] × [Nk] 时间戳 -> [Nq,Nk] 偏置。这一步就是 O(N²) 的来源。\"\"\"\n        delta = np.abs(tq[:, None] - tk[None, :]).astype(np.float64)\n        bucket = np.minimum((delta / 60.0).astype(np.int64), self.n_buckets - 1)\n        return self.rab_table[bucket]\n\n    def _heads(self, x: np.ndarray) -> np.ndarray:\n        return x.reshape(x.shape[0], self.n_heads, self.head_dim).transpose(1, 0, 2)\n\n    def weights(self, xq, xk, tq, tk, mask) -> np.ndarray:\n        \"\"\"只算权重矩阵 A = SiLU(scale·QK^T + rab)，不乘 V。\n\n        单独拆出来，是为了下面演示「分块求和」时能看到 A 是可加的。\n        \"\"\"\n        qh = self._heads(xq @ self.Wq)                      # [h, Nq, hd]\n        kh = self._heads(xk @ self.Wk)                      # [h, Nk, hd]\n        scores = qh @ kh.transpose(0, 2, 1)                 # [h, Nq, Nk]\n        # (2) average factor：除以 max_seq_len，且在 SiLU 之前\n        scores = scores / max(xq.shape[0], xk.shape[0])\n        # (3) rab 实体化\n        scores = scores + self.rel_bias(tq, tk)[None]\n        # (1) 关键一行：SiLU 而不是 softmax —— 没有按列归一化\n        return np.where(mask[None], silu(scores), 0.0)\n\n    # ------------------------------------------------------------------\n    def forward(self, x, timestamps, mask):\n        n, d = x.shape\n        attn = self.weights(x, x, timestamps, timestamps, mask)   # [h, N, N]\n        vh = self._heads(x @ self.Wv)\n        out = attn @ vh                                          # 纯加归约\n        out = out.transpose(1, 0, 2).reshape(n, d)\n        out = out * silu(x @ self.Wu)                            # (4) 门控\n        return out @ self.Wo, attn\n\n\ndef make_causal(n: int) -> np.ndarray:\n    return np.tril(np.ones((n, n), dtype=bool))\n\n\n# ======================================================================\ndef demo() -> None:\n    title(\"HSTU：为什么它是「纯加归约」，以及这对 CP 意味着什么\")\n\n    n, d, h = 64, 64, 4\n    block = HSTUBlock(d=d, n_heads=h)\n    x = rng(1).normal(0, 1, (n, d))\n    ts = np.sort(rng(2).uniform(0, 600, n))\n    mask = make_causal(n)\n\n    out, attn = block.forward(x, ts, mask)\n\n    step(\"输入\", N=n, d=d, heads=h)\n    step(\"q/k/v/u\", shape=f\"({n},{d}) x4\", note=\"U 是门控\")\n    step(\"A = SiLU(...)\", shape=tuple(attn.shape), note=\"O(N^2) 张量\")\n    step(\"rab\", shape=(n, n), note=\"O(N^2) 张量，参数只有 8 个\")\n    step(\"可见 pair\", pairs=count_pairs(mask), total=n * n)\n    step(\"FLOPs\", val=f\"{flops_attn(count_pairs(mask), d // h, h) / 1e6:.2f} M\")\n    step(\"rab 字节\", val=f\"{n * n * 4 / 1024:.1f} KiB\", note=\"与参数无关\")\n\n    # ---------------- 验证 1：纯加归约 ⇒ 分块求和精确 ----------------\n    print(\"\\n  [验证 1] 把 KV 切成两段，各段独立算 partial，再相加：\")\n    half = n // 2\n    vh = block._heads(x @ block.Wv)\n    a_all = block.weights(x, x, ts, ts, mask)\n    partial = []\n    for lo, hi in ((0, half), (half, n)):\n        a = block.weights(x, x[lo:hi], ts, ts[lo:hi], mask[:, lo:hi])\n        part = a @ vh[:, lo:hi, :]\n        partial.append(part)\n        step(f\"rank {len(partial)-1} partial\", pairs=count_pairs(mask[:, lo:hi]),\n             bytes=f\"{part.nbytes/1024:.1f} KiB\")\n    merged = partial[0] + partial[1]\n    merged = merged.transpose(1, 0, 2).reshape(n, d) * silu(x @ block.Wu)\n    merged = merged @ block.Wo\n    err = np.abs(merged - out).max()\n    step(\"整体 vs 分块\", max_abs_err=f\"{err:.3e}\", verdict=\"精确相等\" if err < 1e-6 else \"不等\")\n    print(\"     => 跨卡只需要一次加法，不需要 LSE、不需要 rescale。这就是 CP 在\")\n    print(\"        HSTU/MTGR 上『零归约』的全部技术内容。\")\n\n    # ---------------- 验证 2：softmax 为什么不行 ----------------\n    print(\"\\n  [验证 2] 同一份 score 换成 softmax，分块就不成立了：\")\n    s = block._heads(x @ block.Wq) @ block._heads(x @ block.Wk).transpose(0, 2, 1)\n    s = s / n + block.rel_bias(ts, ts)[None]\n    s = np.where(mask[None], s, -1e9)\n    print(f\"     SiLU   某行权重和 = {attn[0, -1].sum():.4f}  （≠1，可加）\")\n    print(f\"     softmax 该行权重和 = {softmax(s[0], -1)[-1].sum():.4f}  （恒 =1，必须先拿到全部 KV）\")\n    print(\"     => 有 softmax 就要 online softmax / LSE；没有就只是加法。\")\n    print(\"        LONGER 用了 softmax ⇒ 它是唯一需要复杂 CP 的 GR（见 docs/04）。\")\n\n    # ---------------- 验证 3：二次性 ----------------\n    print(\"\\n  [验证 3] 工作量随 N 的真实增长（决定 CP 有没有对象）：\")\n    rows = []\n    for nn in (512, 1024, 2048, 4096):\n        pairs = count_pairs(make_causal(nn))\n        rows.append((nn, pairs, f\"{flops_attn(pairs, 16, h) / 1e9:.2f} G\",\n                     f\"{nn * nn * 4 / 1024 ** 2:.1f} MiB\"))\n    from _core import table\n    print(table(rows, (\"N\", \"pairs\", \"FLOPs\", \"rab 张量\")))\n\n\nif __name__ == \"__main__\":\n    demo()\n", "codePath": "models/hstu_min.py", "out": "\n==============================================================================\nHSTU：为什么它是「纯加归约」，以及这对 CP 意味着什么\n==============================================================================\n  输入                           N=64  d=64  heads=4\n  q/k/v/u                      shape=(64,64) x4  note=U 是门控\n  A = SiLU(...)                shape=(4, 64, 64)  note=O(N^2) 张量\n  rab                          shape=(64, 64)  note=O(N^2) 张量，参数只有 8 个\n  可见 pair                      pairs=2080  total=4096\n  FLOPs                        val=0.27 M\n  rab 字节                       val=16.0 KiB  note=与参数无关\n\n  [验证 1] 把 KV 切成两段，各段独立算 partial，再相加：\n  rank 0 partial               pairs=1552  bytes=32.0 KiB\n  rank 1 partial               pairs=528  bytes=32.0 KiB\n  整体 vs 分块                     max_abs_err=6.661e-16  verdict=精确相等\n     => 跨卡只需要一次加法，不需要 LSE、不需要 rescale。这就是 CP 在\n        HSTU/MTGR 上『零归约』的全部技术内容。\n\n  [验证 2] 同一份 score 换成 softmax，分块就不成立了：\n     SiLU   某行权重和 = -0.0548  （≠1，可加）\n     softmax 该行权重和 = 1.0000  （恒 =1，必须先拿到全部 KV）\n     => 有 softmax 就要 online softmax / LSE；没有就只是加法。\n        LONGER 用了 softmax ⇒ 它是唯一需要复杂 CP 的 GR（见 docs/04）。\n\n  [验证 3] 工作量随 N 的真实增长（决定 CP 有没有对象）：\nN     pairs    FLOPs   rab 张量  \n----  -------  ------  --------\n512   131328   0.02 G  1.0 MiB \n1024  524800   0.07 G  4.0 MiB \n2048  2098176  0.27 G  16.0 MiB\n4096  8390656  1.07 G  64.0 MiB\n"}, {"id": "mtgr", "group": "模型", "title": "MTGR", "blurb": "三段掩码 ⇒ 静态段是方阵", "body": "<h1>02 · MTGR<\/h1>\n<blockquote><p><strong>一句话<\/strong>：MTGR = HSTU block + 一个非因果的三段掩码。<\/p>\n<p>而这个掩码的形状，恰好让它的 CP 比纯因果模型<strong>更好做<\/strong>。<\/p><\/blockquote>\n<h2>论文<\/h2>\n<ul>\n<li><em>MTGR: Industrial-Scale Generative Recommendation Framework in Meituan<\/em>,<\/li>\n<\/ul>\n<p>  <strong>arXiv 2505.18654<\/strong>（CIKM'25）<\/p>\n<ul>\n<li>美团技术博客：<a href=\"https://tech.meituan.com/2025/05/19/Meituan-Generative-Recommendation.html\" target=\"_blank\" rel=\"noopener\">https://tech.meituan.com/2025/05/19/Meituan-Generative-Recommendation.html<\/a><\/li>\n<\/ul>\n<h2>结构<\/h2>\n<pre><code> |&lt;--------- 静态 S ---------&gt;|&lt;-- 动态 R --&gt;|&lt;- 候选 K -&gt;|\n   U(用户画像)  S(历史行为)      R(当日实时)     C/I(曝光样本)\n        │            │               │              │\n        └────────────┴───────────────┴──────────────┘\n                          │\n                    Group-LayerNorm        ← 不同语义域各自归一化\n                          │\n                  HSTU block × L            ← 与 01 完全相同\n                          │\n                  逐候选打分<\/code><\/pre>\n<h2>三条掩码规则（论文原文）<\/h2>\n<ul>\n<li><strong>静态段对所以 token 可见<\/strong><\/li>\n<\/ul>\n<p>   U 和 S 来自聚合窗口之前，不会泄漏未来信息。<\/p>\n<ul>\n<li><strong>实时段内部因果<\/strong><\/li>\n<\/ul>\n<p>   只能看更早发生的实时行为。<\/p>\n<ul>\n<li><strong>候选段只看自己<\/strong><\/li>\n<\/ul>\n<p>   候选之间不能互相偷看。<\/p>\n<pre><code>        S(0..95)      R(96..119)   C(120..127)\n   ┌──────────────┬───────────┬──────────┐\n S │ 全可见 (方阵) │   全可见   │  全可见   │\n   ├──────────────┼───────────┼──────────┤\n R │    全可见     │  因果三角  │  不可见   │\n   ├──────────────┼───────────┼──────────┤\n C │    全可见     │ 按时间戳   │ 只有自己  │\n   └──────────────┴───────────┴──────────┘<\/code><\/pre>\n<p><strong>第 3 条最容易被忽略<\/strong>：如果不隔离候选，同一批曝光里后发生的那个会把答案泄漏给<\/p>\n<p>先发生的那个 —— 离线 AUC 虚高、上线崩掉。这是推荐系统独有的坑。<\/p>\n<h2>为什么要动态掩码<\/h2>\n<p>论文里说的场景：一次请求聚合「用户一天」的数据，但候选曝光发生在一天中的不同时刻。<\/p>\n<ul>\n<li>朴素因果掩码：候选按时间倒序排，看起来「更晚的候选能看到更早的行为」—— 看起来对<\/li>\n<li>实际上：某些候选发生在某些实时行为<strong>之前<\/strong>，因果掩码会让它看到未来的行为<\/li>\n<\/ul>\n<p>所以他们用<strong>时间戳 + 因果<\/strong>双条件，而不是单纯的位置因果。这需要每个候选有自己的时间戳，<\/p>\n<p>掩码因此是<strong>动态<\/strong>的（依赖样本内容，不是固定的三角）。<\/p>\n<h2>成本：闭式 pair 数<\/h2>\n<pre><code>    pairs = S²  +  [P(P+1) − S(S+1)]/2  +  K·(P+1)        P = S + R\n            ↑         ↑                      ↑\n         静态方阵   实时因果三角         候选看整段前缀 + 自己<\/code><\/pre>\n<p>这个式子可以<strong>逐位验证<\/strong>（<code>models/mtgr_min.py<\/code> 里 <code>assert<\/code> 了）。<\/p>\n<p>实测的密度（pairs / n²）：<\/p>\n<table><thead><tr><th>配置<\/th><th>pairs<\/th><th>密度<\/th><th>静态占比<\/th><\/tr><\/thead><tbody><tr><td>S=1000, R=60<\/td><td>1.07 M<\/td><td><strong>0.938<\/strong><\/td><td>93%<\/td><\/tr><tr><td>S=2000, R=100<\/td><td>4.22 M<\/td><td><strong>0.950<\/strong><\/td><td>95%<\/td><\/tr><tr><td>S=4000, R=60<\/td><td>16.3 M<\/td><td><strong>0.983<\/strong><\/td><td>98%<\/td><\/tr><\/tbody><\/table>\n<blockquote><p><strong>密度 0.94~0.98 意味着：MTGR 的注意力矩阵几乎是一整个方阵。<\/strong><\/p>\n<p>这是它和纯因果模型（密度 0.5）最本质的差别。<\/p><\/blockquote>\n<h2>并行含义<\/h2>\n<table><thead><tr><th>轴<\/th><th>结论<\/th><th>原因<\/th><\/tr><\/thead><tbody><tr><td><strong>CP<\/strong><\/td><td><strong>有对象，而且比纯因果好做<\/strong><\/td><td>静态段是方阵 ⇒ 失衡 1.00<\/td><\/tr><tr><td>EP<\/td><td>有条件<\/td><td>Scaling User Module 是 MoE，但 GLN 的归约轴需核实<\/td><\/tr><tr><td>TP<\/td><td>可以<\/td><td>常规<\/td><\/tr><tr><td>beam<\/td><td>无关<\/td><td>判别式（它是 ranker，不是 generator）<\/td><\/tr><\/tbody><\/table>\n<h3>为什么「方阵更好切」<\/h3>\n<p>把长度切成 N 块，看每块的工作量：<\/p>\n<table><thead><tr><th>掩码<\/th><th>每块工作量<\/th><th>失衡度<\/th><\/tr><\/thead><tbody><tr><td>方阵<\/td><td>全部相同<\/td><td><strong>1.00<\/strong><\/td><\/tr><tr><td>因果三角<\/td><td>第 r 块 ∝ r<\/td><td><strong>2 − 1/N<\/strong>（N=8 → 1.87）<\/td><\/tr><tr><td>zigzag 配对<\/td><td>相同<\/td><td>1.00（代价：重排 kernel）<\/td><\/tr><\/tbody><\/table>\n<p>静态段占比 93%~98% ⇒ 整段的失衡度被拉向 1.00，<strong>而且不需要 zigzag<\/strong>。<\/p>\n<blockquote><p>这解释了 <code>gr-cp-cost-model<\/code> 里那条预言：MTGR 上「2·CP mini-chunk +37%」的收益<\/p>\n<p>应该会<strong>缩水<\/strong> —— 因为在方阵主导的结构里，配对本来就没多少可配。<\/p><\/blockquote>\n<h2>GLN 的并行含义<\/h2>\n<p>Group-LayerNorm：不同语义域（U / S / R / C）各自算均值和方差。<\/p>\n<ul>\n<li>只需<strong>组内<\/strong>统计量 ⇒ 是 token-wise 的<\/li>\n<li>与 CP 的序列切分正交：切到哪一段就只用那一段的统计量，不跨卡<\/li>\n<\/ul>\n<p>只要保证「每个 token 只用自己的组内统计」，GLN 就不会成为 CP 的新同步点。<\/p>\n<p><strong>例外<\/strong>：如果某个组的 token 被切到了两张卡上，组内均值就必须跨卡归约 ——<\/p>\n<p>这是一个需要核实的实现细节（MTGR 的 GLN 归约轴）。<\/p>\n<h2>常见误解<\/h2>\n<table><thead><tr><th>误解<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td>「MTGR 和 HSTU 一样，所以 CP 结论一样」<\/td><td>掩码不同 ⇒ 失衡度不同。MTGR 更好切<\/td><\/tr><tr><td>「动态掩码 ⇒ 掩码必须跨卡传递」<\/td><td><code>cp_q<\/code> 下每卡自己那段掩码自己知道，零传递<\/td><\/tr><tr><td>「候选只有几十个，切它没意义」<\/td><td>对，候选段不切。切的是静态段<\/td><\/tr><tr><td>「静态段对所以 token 可见 ⇒ 必须复制」<\/td><td>复制的是 KV（<code>cp_q<\/code>），这正是零通信的做法<\/td><\/tr><\/tbody><\/table>\n<h2>对应代码<\/h2>\n<p><code>models/mtgr_min.py<\/code><\/p>\n<ul>\n<li>三段掩码的逐位构造 + 闭式 pair 数的 assert<\/li>\n<li>掩码的 ASCII 打印（能看到方阵 / 三角 / 对角线三种形状）<\/li>\n<li>三段失衡度的对照表<\/li>\n<li>GLN 的前后 std 对比<\/li>\n<li>同一个 HSTU block 换掩码，输出范数如何变化<\/li>\n<\/ul>", "code": "\"\"\"MTGR 最小实现 —— 关键只有一件事：三段式掩码。\n\n论文: \"MTGR: Industrial-Scale Generative Recommendation Framework in Meituan\"\n      arXiv 2505.18654（CIKM'25）\n\n=======================================================================\nMTGR = HSTU block + 一个非因果的三段掩码 + GLN\n=======================================================================\n\ntoken 序列被切成三段（顺序即拼接顺序）：\n\n    |<---- 静态 S ---->|<-- 实时 R -->|<- 候选 K ->|\n    U(用户画像) S(历史)   R(当天行为)     C/I(曝光样本)\n\n三条掩码规则（论文原文的三条，逐条对应）：\n\n  1. 静态段对【所有】token 可见     —— U/S 来自聚合窗口之前，不会泄漏\n  2. 实时段内部【因果】             —— 只能看更早的实时行为\n  3. 候选段【只看自己】             —— 候选之间不能互相偷看\n\n第 3 条最容易被忽略：如果不隔离，同一批曝光样本里后发生的那个会\n把答案泄漏给先发生的那个，线上 AUC 会在训练时虚高、上线后崩掉。\n\n=======================================================================\n为什么这个掩码是 CP 分析的入口\n=======================================================================\npair 数（闭式，可被暴力掩码逐位验证）：\n\n    pairs = S²  +  [P(P+1) − S(S+1)]/2  +  K·(P+1)\n            ^         ^                      ^\n         静态方阵   实时因果三角        候选看整段前缀+自己\n    P = S + R\n\n三段的 CP 性质完全不同：\n\n    静态 S²   ——  方阵。工作量对任何切法都均匀，失衡度 = 1.00\n    实时三角  ——  因果三角。失衡度 = 2 − 1/N（就是经典的那条）\n    候选 K    ——  K 很小（几十），切它没有意义\n\n=> MTGR 的 CP 难度由「静态段占比」决定。\n   静态段越长，整段越接近方阵，CP 越好做。\n   这是 MTGR 比纯因果模型（HSTU 全序列 causal）更「可切」的结构原因。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom _core import count_pairs, rng, step, table, title\n\nfrom hstu_min import HSTUBlock\n\n\n# ======================================================================\ndef build_mtgr_mask(s: int, r: int, k: int, candidate_time: np.ndarray | None = None,\n                    r_time: np.ndarray | None = None) -> np.ndarray:\n    \"\"\"按论文的三条规则构造 [P+K, P+K] 布尔掩码（True = 可见）。\n\n    s: 静态段长度（U + 历史）\n    r: 实时段长度\n    k: 候选数\n    \"\"\"\n    p = s + r\n    n = p + k\n    mask = np.zeros((n, n), dtype=bool)\n\n    # 规则 1：静态段内部全可见，且对后面所有 token 可见\n    mask[:s, :s] = True\n    mask[:, :s] = True\n\n    # 规则 2：实时段内部因果\n    mask[s:p, s:p] = np.tril(np.ones((r, r), dtype=bool))\n\n    # 规则 3：候选只看自己（+ 静态 + 自己时间戳之前的实时行为）\n    for i in range(k):\n        row = p + i\n        mask[row, row] = True\n        mask[row, s:p] = True\n        if candidate_time is not None and r_time is not None:\n            # 时间戳细化：更早发生的候选看不到更晚的实时行为\n            mask[row, s:p] = r_time < candidate_time[i]\n    return mask\n\n\ndef closed_form_pairs(s: int, r: int, k: int) -> int:\n    p = s + r\n    return s * s + (p * (p + 1) - s * (s + 1)) // 2 + k * (p + 1)\n\n\ndef group_layer_norm(x: np.ndarray, groups: list[int], eps: float = 1e-5) -> np.ndarray:\n    \"\"\"GLN：不同语义域的 token 各自归一化，再拼回去。\n\n    为什么需要它：U（画像，稀疏 ID 多）和 R（实时行为，稠密）分布差很远，\n    共享一个 LN 会让 dominant 的那组把另一组压掉。\n    并行上的含义：GLN 只需要组内统计量 => 是 token-wise 的，\n    与 CP 的序列切分正交（切到哪一段就只用那一段的统计量，不跨卡）。\n    \"\"\"\n    out = np.empty_like(x)\n    lo = 0\n    for g in groups:\n        blk = x[lo:lo + g]\n        mu = blk.mean(axis=0, keepdims=True)\n        var = blk.var(axis=0, keepdims=True)\n        out[lo:lo + g] = (blk - mu) / np.sqrt(var + eps)\n        lo += g\n    return out\n\n\n# ======================================================================\ndef demo() -> None:\n    title(\"MTGR：三段掩码如何决定 CP 的难度\")\n\n    s, r, k, d = 96, 24, 8, 64\n    mask = build_mtgr_mask(s, r, k)\n    pairs = count_pairs(mask)\n\n    step(\"静态 S\", val=s, note=\"U + 历史\")\n    step(\"实时 R\", val=r)\n    step(\"候选 K\", val=k, note=\"GR 里通常只有几十个\")\n    step(\"总长度\", val=s + r + k)\n    step(\"可见 pair\", val=pairs)\n    step(\"闭式\", val=closed_form_pairs(s, r, k), note=\"必须逐位相等\")\n    assert pairs == closed_form_pairs(s, r, k), \"闭式与暴力掩码不符\"\n\n    print(\"\\n  掩码结构（# 可见，. 屏蔽）：\")\n    _print_mask(mask, ((\"S\", s), (\"R\", r), (\"C\", k)))\n\n    # ---------------- 三段各自的 CP 性质 ----------------\n    print(\"\\n  [核心] 把整段按 1/N 切开，看三段的失衡度：\")\n    rows = []\n    for n in (2, 4, 8):\n        # 静态段：方阵，任何切法都均匀\n        static_imb = 1.00\n        # 实时段：因果三角，经典结果 2N/(N+1)\n        causal_imb = 2 * n / (n + 1)\n        # 候选段：不看序列，切了也没意义\n        rows.append((n, f\"{static_imb:.2f}\", f\"{causal_imb:.2f}\",\n                     f\"{static_imb:.2f}\"))\n    print(table(rows, (\"N\", \"静态 S²\", \"实时 三角\", \"整体(全静态)\")))\n    print(\"     => 静态段占比越高，整段越接近方阵，CP 越好做。\")\n    print(\"        这就是 MTGR 比 HSTU（全序列 causal）更『可切』的结构原因。\")\n\n    # ---------------- 静态段占比的现实数值 ----------------\n    print(\"\\n  [现实] 静态 vs 实时的比例（决定 CP 到底难不难）：\")\n    rows = []\n    for s_, r_ in ((1000, 60), (2000, 100), (4000, 60)):\n        m = build_mtgr_mask(s_, r_, 8)\n        total = count_pairs(m)\n        seq = m.shape[0]\n        rows.append((f\"S={s_} R={r_}\", total, f\"{total/seq**2:.3f}\",\n                     f\"{s_*s_/total*100:.0f}%\"))\n    print(table(rows, (\"配置\", \"pairs\", \"密度 pairs/n²\", \"静态占 pairs\")))\n    print(\"     => 密度越接近 1.0，越像方阵；静态段吃掉大部分 pair。\")\n\n    # ---------------- GLN ----------------\n    print(\"\\n  [GLN] 组内归一化，跨组不归一化：\")\n    x = np.concatenate([rng(3).normal(0, 5, (s, d)),\n                        rng(4).normal(0, 1, (r, d)),\n                        rng(5).normal(0, 1, (k, d))])\n    y = group_layer_norm(x, [s, r, k])\n    step(\"原始 std（三组）\",\n         val=\" / \".join(f\"{x[lo:lo+g].std():.2f}\" for lo, g in ((0, s), (s, r), (s + r, k))))\n    step(\"GLN 后 std（三组）\",\n         val=\" / \".join(f\"{y[lo:lo+g].std():.2f}\" for lo, g in ((0, s), (s, r), (s + r, k))))\n    print(\"     => 三组都变成 1，但彼此没有被混在一起。这是 GLN 的全部内容。\")\n\n    # ---------------- 喂给 HSTU block ----------------\n    print(\"\\n  [串联] 同一个 HSTU block，只换掩码：\")\n    blk = HSTUBlock(d=d, n_heads=4)\n    xin = rng(6).normal(0, 1, (s + r + k, d))\n    ts = np.sort(rng(7).uniform(0, 1000, s + r + k))\n    out, attn = blk.forward(xin, ts, mask)\n    same_out, same_attn = blk.forward(xin, ts, np.tril(np.ones_like(mask)))\n    step(\"MTGR 掩码\", pairs=count_pairs(mask),\n         norm=f\"{np.linalg.norm(attn):.2f}\")\n    step(\"纯 causal\", pairs=count_pairs(np.tril(np.ones_like(mask))),\n         norm=f\"{np.linalg.norm(same_attn):.2f}\")\n    print(\"     => 掩码只改『哪些 pair 被计入』，不改任何算子。\")\n    print(\"        所以 MTGR 的并行性分析 = 一个掩码拓扑问题（见 parallel/cp_min.py）。\")\n\n\ndef _print_mask(mask: np.ndarray, groups) -> None:\n    edges, lo = [], 0\n    for _, g in groups:\n        edges.append((lo, lo + g))\n        lo += g\n    n = mask.shape[0]\n    stride = max(1, n // 40)\n    for i in range(0, n, stride):\n        row = \"\".join(\"#\" if mask[i, j] else \".\" for j in range(0, n, stride))\n        tag = \"S\" if i < edges[0][1] else (\"R\" if i < edges[1][1] else \"C\")\n        print(f\"    {tag} {row}\")\n\n\nif __name__ == \"__main__\":\n    demo()\n", "codePath": "models/mtgr_min.py", "out": "\n==============================================================================\nMTGR：三段掩码如何决定 CP 的难度\n==============================================================================\n  静态 S                         val=96  note=U + 历史\n  实时 R                         val=24\n  候选 K                         val=8  note=GR 里通常只有几十个\n  总长度                          val=128\n  可见 pair                      val=12788\n  闭式                           val=12788  note=必须逐位相等\n\n  掩码结构（# 可见，. 屏蔽）：\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    S ################################...........\n    R #################################..........\n    R ##################################.........\n    R ###################################........\n    R ####################################.......\n    R #####################################......\n    R ######################################.....\n    R #######################################....\n    R ########################################...\n    C #########################################..\n    C ########################################.#.\n    C ########################################..#\n\n  [核心] 把整段按 1/N 切开，看三段的失衡度：\nN  静态 S²  实时 三角  整体(全静态)\n-  -----  -----  -------\n2  1.00   1.33   1.00   \n4  1.00   1.60   1.00   \n8  1.00   1.78   1.00   \n     => 静态段占比越高，整段越接近方阵，CP 越好做。\n        这就是 MTGR 比 HSTU（全序列 causal）更『可切』的结构原因。\n\n  [现实] 静态 vs 实时的比例（决定 CP 到底难不难）：\n配置            pairs     密度 pairs/n²  静态占 pairs\n------------  --------  -----------  ---------\nS=1000 R=60   1070318   0.938        93%      \nS=2000 R=100  4221858   0.950        95%      \nS=4000 R=60   16274318  0.983        98%      \n     => 密度越接近 1.0，越像方阵；静态段吃掉大部分 pair。\n\n  [GLN] 组内归一化，跨组不归一化：\n  原始 std（三组）                   val=5.03 / 1.01 / 0.96\n  GLN 后 std（三组）                val=1.00 / 1.00 / 1.00\n     => 三组都变成 1，但彼此没有被混在一起。这是 GLN 的全部内容。\n\n  [串联] 同一个 HSTU block，只换掩码：\n  MTGR 掩码                      pairs=12788  norm=17.05\n  纯 causal                     pairs=8256  norm=14.44\n     => 掩码只改『哪些 pair 被计入』，不改任何算子。\n        所以 MTGR 的并行性分析 = 一个掩码拓扑问题（见 parallel/cp_min.py）。\n"}, {"id": "rankmixer", "group": "模型", "title": "RankMixer", "blurb": "转置代替 attention ⇒ 没有 L 维", "body": "<h1>03 · RankMixer<\/h1>\n<blockquote><p><strong>一句话<\/strong>：它把 quadratic self-attention 换成了<strong>一次转置<\/strong>。<\/p>\n<p>代价为零，收益是 MFU 从 4.5% 涨到 45% —— 同时这也意味着 CP 没有定义。<\/p><\/blockquote>\n<h2>论文<\/h2>\n<ul>\n<li>Zhu et al., <em>RankMixer: Scaling Up Ranking Models in Industrial Recommenders<\/em>,<\/li>\n<\/ul>\n<p>  <strong>arXiv 2507.15551<\/strong>（CIKM'25，字节）<\/p>\n<ul>\n<li>关键数字：MFU <strong>4.5% → 45%<\/strong>，参数量放大两个数量级而延迟基本不变，<\/li>\n<\/ul>\n<p>  1B dense 全量上线（+0.3% 用户活跃天数、+1.08% 使用时长）<\/p>\n<h2>结构<\/h2>\n<pre><code> 拼接后的特征向量 e_input  (N 个特征组)\n        │  按语义切成 T 个 token\n        ▼\n   x_0  x_1  ...  x_{T-1}           每个 T×D\n        │\n   ┌────┴─────────────────────────────────────┐\n   │  Multi-Head Token Mixing（零参数）        │\n   │                                          │\n   │  每个 token 沿 D 切成 H 份 (H = T)        │\n   │  把所有 token 的第 h 份拼成一个新 token    │\n   │      s_h = [x_0.h | x_1.h | ... | x_{T-1}.h] │\n   │  =&gt; reshape + transpose，没有矩阵乘        │\n   └────┬─────────────────────────────────────┘\n        ▼\n   s_0  s_1  ...  s_{H-1}\n        │\n   ┌────┴─────────────────────────────────────┐\n   │  Per-token FFN（每个 token 独立参数）      │\n   │  参数 = 共享 FFN × T，FLOPs 不变           │\n   │  ↓ 可替换为 Sparse-MoE（ReLU 路由 + L1）   │\n   └────┬─────────────────────────────────────┘\n        ▼\n      残差 → 下一层 ... → mean pooling → 多任务头<\/code><\/pre>\n<h2>两个机制<\/h2>\n<h3>1. Multi-head Token Mixing：转置即混合<\/h3>\n<p>为什么它能替代 attention：<strong>attention 的作用是让不同 token 的特征互相看见<\/strong>。<\/p>\n<p>转置也做到了这件事，只是方式不同：<\/p>\n<table><thead><tr><th><\/th><th>attention<\/th><th>token mixing<\/th><\/tr><\/thead><tbody><tr><td>做什么<\/td><td>每个 token 用<strong>内积<\/strong>加权聚合别的 token<\/td><td>每个 token 的<strong>特征块<\/strong>被搬到另一个 token 里<\/td><\/tr><tr><td>参数<\/td><td>Q/K/V 三组<\/td><td><strong>0<\/strong><\/td><\/tr><tr><td>FLOPs<\/td><td><code>2·T²·D<\/code><\/td><td><strong>0<\/strong>（只有数据搬运）<\/td><\/tr><tr><td>前提<\/td><td>token 在同一嵌入空间<\/td><td>无<\/td><\/tr><\/tbody><\/table>\n<p>论文的论证很硬：推荐的特征空间<strong>异构<\/strong>（用户 ID 空间上亿，行为序列稠密），<\/p>\n<p>跨空间的<strong>内积没有意义<\/strong>。所以 attention 在这里不但贵，而且不比免费的转置更好。<\/p>\n<p>小例子（T=3, D=6, H=3）：<\/p>\n<pre><code>输入                             输出\ntoken0: [0 1 | 2 3 | 4 5]        s0: [0 1 | 6 7 | 12 13]   ← 所有 token 的第 0 份\ntoken1: [6 7 | 8 9 | 10 11]      s1: [2 3 | 8 9 | 14 15]   ← 所有 token 的第 1 份\ntoken2: [12 13|14 15|16 17]      s2: [4 5 |10 11| 16 17]   ← 所有 token 的第 2 份<\/code><\/pre>\n<p><code>H = T<\/code> 是为了让 token 数不变，残差才能直接相加。<\/p>\n<h3>2. Per-token FFN：参数隔离<\/h3>\n<p>每个 token 有<strong>自己的一套<\/strong> FFN 权重。<\/p>\n<ul>\n<li>参数量 = 共享 FFN × T（T=16 就是 16 倍）<\/li>\n<li>FLOPs <strong>完全不变<\/strong>（每个 token 仍然只做一次矩阵乘）<\/li>\n<\/ul>\n<p>所以它是「加参数不加算力」的纯容量手段。论文的动机是<\/p>\n<p><strong>特征子空间支配问题<\/strong>：共享 FFN 会让高频特征淹没长尾特征。<\/p>\n<h3>3. Sparse-MoE 变体<\/h3>\n<p>把每个 token 的 dense FFN 换成 MoE：<\/p>\n<ul>\n<li><strong>ReLU 门 + L1 惩罚<\/strong>，不是 top-k softmax<\/li>\n<li>每个 token 激活的专家数<strong>不同<\/strong>（高信息量的 token 自己多要几个）<\/li>\n<\/ul>\n<h2>成本<\/h2>\n<table><thead><tr><th>量<\/th><th>公式<\/th><th>T=16, D=64, k=4<\/th><\/tr><\/thead><tbody><tr><td>token mixing<\/td><td><code>0<\/code><\/td><td>0<\/td><\/tr><tr><td>Per-token FFN<\/td><td><code>2·T·D·(kD)·2<\/code><\/td><td>1.05 M FLOPs<\/td><\/tr><tr><td>参数<\/td><td><code>T · D · kD · 2<\/code><\/td><td>0.52 M<\/td><\/tr><tr><td>可见 pair<\/td><td><strong>不存在<\/strong><\/td><td>0<\/td><\/tr><\/tbody><\/table>\n<h2>并行含义<\/h2>\n<table><thead><tr><th>轴<\/th><th>结论<\/th><th>原因<\/th><\/tr><\/thead><tbody><tr><td><strong>CP<\/strong><\/td><td><strong>无定义<\/strong><\/td><td>没有序列维 L。T 是特征子空间数（~16），不是长度<\/td><\/tr><tr><td>TP<\/td><td>可以，但 T 太小<\/td><td>切 D 有效；切 T 会打破 per-token FFN 的意义<\/td><\/tr><tr><td><strong>EP<\/strong><\/td><td><strong>主战场<\/strong><\/td><td>Sparse-MoE 的专家数才是参数量所在<\/td><\/tr><tr><td>beam<\/td><td>无关<\/td><td>判别式，没有自回归<\/td><\/tr><\/tbody><\/table>\n<h3>这条为什么最值得记住<\/h3>\n<p>用户历史 L 从 512 涨到 8192，这个模块的：<\/p>\n<ul>\n<li>FLOPs：<strong>不变<\/strong><\/li>\n<li>激活字节：<strong>不变<\/strong><\/li>\n<li>pair 数：<strong>恒为 0<\/strong><\/li>\n<\/ul>\n<p><strong>四列里三列与 L 无关。<\/strong> 所以「按序列切（CP）」在 RankMixer 上没有定义 ——<\/p>\n<p>不是「不需要」，是<strong>没有那个维度<\/strong>。<\/p>\n<h3>MFU 从 4.5% 到 45% 的含义<\/h3>\n<p>这 10 倍不是「优化」，是<strong>换了瓶颈<\/strong>：<\/p>\n<ul>\n<li>之前：一堆手工特征交叉（CPU 时代遗产），memory-bound，MFU 4.5%<\/li>\n<li>之后：干净的大 GEMM，compute-bound，MFU 45%<\/li>\n<\/ul>\n<p><strong>从 memory-bound 变成 compute-bound，正好是 TP/EP 开始有效的条件。<\/strong><\/p>\n<h2>常见误解<\/h2>\n<table><thead><tr><th>误解<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td>「RankMixer 也有 T 个 token，所以也能切序列」<\/td><td>T 是特征维度，与用户历史 L 无关<\/td><\/tr><tr><td>「token mixing 是一种 attention」<\/td><td>它是转置。零参数零 FLOPs，没有内积<\/td><\/tr><tr><td>「per-token FFN 是 MoE」<\/td><td>不是。每个 token 看<strong>不同<\/strong>输入，MoE 专家看<strong>同一<\/strong>输入<\/td><\/tr><tr><td>「MFU 提升意味着模型变快」<\/td><td>它意味着硬件利用率变高；绝对延迟不一定降<\/td><\/tr><\/tbody><\/table>\n<h2>对应代码<\/h2>\n<p><code>models/rankmixer_min.py<\/code><\/p>\n<ul>\n<li>token mixing 的小例子（打印 head 的去向）+ <code>inverse(forward(x)) == x<\/code><\/li>\n<li>三种混合方式的成本对比（MHTM 恒为 0）<\/li>\n<li>「L 变化但本模块工作量不变」的四列表<\/li>\n<li>ReLU 路由：每个 token 激活数不同 + L1 惩罚<\/li>\n<\/ul>", "code": "\"\"\"RankMixer 最小实现 —— 「把 attention 换成免费的数据搬运」。\n\n论文: Zhu et al., \"RankMixer: Scaling Up Ranking Models in Industrial\n      Recommenders\", arXiv 2507.15551（CIKM'25，字节）\n\n=======================================================================\n它到底做了什么（两句话）\n=======================================================================\n1. Multi-head Token Mixing (MHTM)：把每个 token 沿特征维切成 H 份，\n   再把所有 token 的第 h 份拼成一个新 token。\n   —— 这是一次 reshape + transpose，**零参数、零 FLOPs**。\n\n2. Per-token FFN：每个 token 用**自己专属**的 FFN 参数。\n   —— 参数是共享 FFN 的 T 倍，但 FLOPs 完全一样。\n\n   +-----------------------------------------------------------------+\n   |  输入  T 个 token × D 维                                        |\n   |    x_0 = [h0|h1|h2|h3]      <- 每个 token 切成 H=4 份           |\n   |    x_1 = [h0|h1|h2|h3]                                          |\n   |    x_2 = [h0|h1|h2|h3]                                          |\n   |                                                                 |\n   |  MHTM（转置，免费）                                             |\n   |    s_0 = [x0.h0 | x1.h0 | x2.h0]   <- 同一个 head 跨 token 拼接  |\n   |    s_1 = [x0.h1 | x1.h1 | x2.h1]                                |\n   |    s_2 = [x0.h2 | x1.h2 | x2.h2]                                |\n   |                                                                 |\n   |  逐 token FFN（各自独立参数）                                    |\n   |  ---------------------------------------------------------------|\n   +-----------------------------------------------------------------+\n\n=======================================================================\n为什么这一页是「并行性」而不是「精度」的全部关键\n=======================================================================\n\n  **T 不是序列长度。**\n  T 是「特征子空间」的个数，是模型超参（论文里 H=T，典型 16 左右）。\n  用户行为历史 L 根本不进这个模块 —— L 在序列侧被别的模块消化。\n\n  所以：\n    pairs（query,key 对）  = 0        <- 没有 attention，没有 pair\n    复杂度                 ∝ T·D²·k   <- 线性于 T，与 L 无关\n    转置成本               ∝ T·D     <- MTE/拷贝，可被融合成 0\n\n  => CP 在 RankMixer 上**没有对象**：不存在「按序列切」这件事。\n     能切的是 T（特征子空间）和 D（隐藏维），以及 MoE 的专家。\n\n  论文自己的数字说明了同一件事：MFU 4.5% -> 45%。\n  它把模型从 memory-bound 推到 compute-bound —— 也就是说，\n  瓶颈从「搬数据」变成了「算 GEMM」，而那正是 TP / EP 的强项。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom _core import rng, step, table, title\n\n\n# ======================================================================\nclass MultiHeadTokenMixing:\n    \"\"\"零参数的 token 混合：split-head -> transpose -> concat。\"\"\"\n\n    def __init__(self, T: int, D: int, H: int | None = None):\n        assert D % (H or T) == 0\n        self.T, self.D = T, D\n        self.H = H or T          # 论文：H = T，保证 token 数不变，残差能加\n\n    def forward(self, x: np.ndarray) -> np.ndarray:\n        \"\"\"[T, D] -> [H, T*D/H]。纯 reshape/transpose。\"\"\"\n        T, D, H = self.T, self.D, self.H\n        dh = D // H\n        return x.reshape(T, H, dh).transpose(1, 0, 2).reshape(H, T * dh)\n\n    def inverse(self, s: np.ndarray) -> np.ndarray:\n        \"\"\"[H, T*D/H] -> [T, D]。残差相加前必须转回去。\"\"\"\n        T, D, H = self.T, self.D, self.H\n        dh = D // H\n        return s.reshape(H, T, dh).transpose(1, 0, 2).reshape(T, D)\n\n\nclass PerTokenFFN:\n    \"\"\"每个 token 一套参数，输入是它自己那一路。\"\"\"\n\n    def __init__(self, n_tokens: int, D: int, k: int = 4):\n        self.D, self.k = D, k\n        g = rng(0)\n        s = 1.0 / np.sqrt(D)\n        self.W1 = g.normal(0, s, (n_tokens, D, k * D))\n        self.W2 = g.normal(0, s, (n_tokens, k * D, D))\n\n    def forward(self, x: np.ndarray) -> np.ndarray:\n        # 第 i 个 token 只跟自己那组权重做乘 —— 参数隔离\n        h = np.einsum(\"td,tdk->tk\", x, self.W1)\n        h = h * (1.0 / (1.0 + np.exp(-h)))          # SiLU/GELU 均可\n        return np.einsum(\"tk,tkd->td\", h, self.W2)\n\n    @property\n    def params(self) -> int:\n        return self.W1.size + self.W2.size\n\n\nclass RankMixerBlock:\n    def __init__(self, T: int, D: int, k: int = 4):\n        self.mix = MultiHeadTokenMixing(T, D)\n        self.pffn = PerTokenFFN(T, D, k)\n\n    def forward(self, x: np.ndarray) -> np.ndarray:\n        s = self.mix.forward(x)\n        s = s + self.pffn.forward(s)                 # 残差（形状都是 [T, D]）\n        return s\n\n\n# ======================================================================\nclass ReLURouter:\n    \"\"\"Sparse-MoE 的路由：ReLU 门 + L1 惩罚。\n\n    与 Top-k 的区别：每个 token 激活的专家数**不同**，\n    高信息量的 token 可以自己多要几个专家。\n    代价是负载更难均衡 —— 这正是 EP 的输入端。\n    \"\"\"\n\n    def __init__(self, D: int, n_experts: int, l1: float = 1e-3):\n        self.n_experts, self.l1 = n_experts, l1\n        self.Wg = rng(9).normal(0, 1 / np.sqrt(D), (D, n_experts))\n\n    def forward(self, x: np.ndarray):\n        gate = np.maximum(x @ self.Wg, 0.0)          # ReLU，不是 softmax\n        active = (gate > 0).sum(axis=1)              # 每个 token 的激活数不同\n        penalty = self.l1 * np.abs(gate).sum()       # L1 把稀疏度压出来\n        return gate, active, penalty\n\n\ndef moe_ffn(gate: np.ndarray, x: np.ndarray, experts: list[np.ndarray]) -> np.ndarray:\n    \"\"\"稀疏计算：只有 gate>0 的 (token, expert) 对才做 FFN。\"\"\"\n    out = np.zeros_like(x)\n    for e, W in enumerate(experts):\n        rows = gate[:, e] > 0\n        if rows.any():\n            out[rows] += (x[rows] @ W) * gate[rows, e][:, None]\n    return out\n\n\n# ======================================================================\ndef demo() -> None:\n    title(\"RankMixer：没有 L，没有 pair，所以 CP 没有对象\")\n\n    T, D, k = 16, 64, 4\n    blk = RankMixerBlock(T, D, k)\n    x = rng(1).normal(0, 1, (T, D))\n    y = blk.forward(x)\n\n    step(\"输入\", shape=x.shape, note=\"T 个特征 token，D 维\")\n    step(\"MHTM 输出\", shape=blk.mix.forward(x).shape)\n    step(\"MHTM 参数\", val=0, note=\"纯 reshape/transpose\")\n    step(\"PFFN 参数\", val=f\"{blk.pffn.params/1e6:.3f} M\",\n         note=f\"共享 FFN 的 {T} 倍\")\n    step(\"PFFN FLOPs\", val=f\"{2*T*D*k*D*2/1e6:.3f} M\")\n    print(\"     => 注意：**没有 Q、没有 K、没有 pair**。\")\n\n    # ---------------- 转置到底在做什么 ----------------\n    print(\"\\n  [看懂 MHTM] 用小例子打印 head 的去向（T=3, D=6, H=3）：\")\n    small = np.arange(18, dtype=float).reshape(3, 6)\n    mix = MultiHeadTokenMixing(3, 6, 3)\n    s = mix.forward(small)\n    print(\"     输入 x[t, d]：\")\n    for t in range(3):\n        print(f\"       token{t}: {small[t]}\")\n    print(\"     输出（每个新 token 是『同一个 head 跨 token』拼出来的）：\")\n    for h in range(3):\n        print(f\"       s{h}: {s[h]}\")\n    print(f\"     inverse(forward(x)) == x ? {np.allclose(mix.inverse(s), small)}\")\n    print(\"     => 一次 0-FLOP 的转置，把『token 之间』的信息换了个位置。\")\n\n    # ---------------- 与 self-attention 的代价对比 ----------------\n    print(\"\\n  [代价] 同样 T 个 token，三种混合方式的成本：\")\n    rows = []\n    for TT in (16, 64, 256):\n        attn = 2 * TT * TT * D * 2               # QK^T + AV\n        mixv = 0                                  # 参数free\n        pffn = 2 * TT * D * k * D * 2\n        rows.append((TT, f\"{mixv} (纯搬运)\", f\"{attn/1e6:.2f} M\", f\"{pffn/1e6:.2f} M\",\n                     f\"{attn/pffn:.2f}x\"))\n    print(table(rows, (\"T\", \"MHTM\", \"self-attn\", \"PFFN\", \"attn/PFFN\")))\n    print(\"     => T 越大，self-attention 越亏；MHTM 一直免费。\")\n    print(\"        这就是论文说的『replace quadratic self-attention』。\")\n\n    # ---------------- 关键：T 与序列长度无关 ----------------\n    print(\"\\n  [核心事实] 用户历史 L 从 512 涨到 8192，这个模块的工作量不变：\")\n    rows = []\n    for L in (512, 1024, 2048, 4096, 8192):\n        rows.append((L, f\"{2*T*D*k*D*2/1e6:.3f} M\", f\"{T*D*8/1024:.1f} KiB\",\n                     \"0\"))\n    print(table(rows, (\"用户历史 L\", \"本模块 FLOPs\", \"激活字节\", \"pairs\")))\n    print(\"     => 4 列里有 3 列与 L 无关。\")\n    print(\"        所以『按序列切（CP）』在 RankMixer 上没有定义。\")\n\n    # ---------------- Sparse-MoE：这才是 EP 的入口 ----------------\n    print(\"\\n  [Sparse-MoE] ReLU 路由让每个 token 激活不同数量的专家：\")\n    router = ReLURouter(D, n_experts=8)\n    gate, active, penalty = router.forward(y)\n    step(\"gate 形状\", shape=gate.shape, note=\"[T, n_experts]\")\n    step(\"每 token 激活专家数\", val=list(active), note=\"不固定\")\n    step(\"平均激活\", val=f\"{active.mean():.2f} / 8\")\n    step(\"L1 惩罚\", val=f\"{penalty:.4f}\", note=\"把稀疏度压出来\")\n    step(\"稀疏 FFN 的 (token,expert) 对\", val=int((gate > 0).sum()),\n         note=\"这就是 EP 的 all-to-all token 数\")\n\n    print(\"\\n  [并行含义] RankMixer 的四条结论：\")\n    rows = [\n        (\"CP\", \"无对象\", \"没有 L 维，T 是特征子空间数（~16）\"),\n        (\"TP\", \"可以，但 T 太小\", \"切 D 有效；切 T 会打破 per-token FFN 的意义\"),\n        (\"EP\", \"**主战场**\", \"Sparse-MoE 的专家数才是参数量所在\"),\n        (\"beam\", \"无关\", \"RankMixer 是判别式，没有自回归 decode\"),\n    ]\n    print(table(rows, (\"轴\", \"状态\", \"原因\")))\n\n\nif __name__ == \"__main__\":\n    demo()\n", "codePath": "models/rankmixer_min.py", "out": "\n==============================================================================\nRankMixer：没有 L，没有 pair，所以 CP 没有对象\n==============================================================================\n  输入                           shape=(16, 64)  note=T 个特征 token，D 维\n  MHTM 输出                      shape=(16, 64)\n  MHTM 参数                      val=0  note=纯 reshape/transpose\n  PFFN 参数                      val=0.524 M  note=共享 FFN 的 16 倍\n  PFFN FLOPs                   val=1.049 M\n     => 注意：**没有 Q、没有 K、没有 pair**。\n\n  [看懂 MHTM] 用小例子打印 head 的去向（T=3, D=6, H=3）：\n     输入 x[t, d]：\n       token0: [0. 1. 2. 3. 4. 5.]\n       token1: [ 6.  7.  8.  9. 10. 11.]\n       token2: [12. 13. 14. 15. 16. 17.]\n     输出（每个新 token 是『同一个 head 跨 token』拼出来的）：\n       s0: [ 0.  1.  6.  7. 12. 13.]\n       s1: [ 2.  3.  8.  9. 14. 15.]\n       s2: [ 4.  5. 10. 11. 16. 17.]\n     inverse(forward(x)) == x ? True\n     => 一次 0-FLOP 的转置，把『token 之间』的信息换了个位置。\n\n  [代价] 同样 T 个 token，三种混合方式的成本：\nT    MHTM     self-attn  PFFN     attn/PFFN\n---  -------  ---------  -------  ---------\n16   0 (纯搬运)  0.07 M     1.05 M   0.06x    \n64   0 (纯搬运)  1.05 M     4.19 M   0.25x    \n256  0 (纯搬运)  16.78 M    16.78 M  1.00x    \n     => T 越大，self-attention 越亏；MHTM 一直免费。\n        这就是论文说的『replace quadratic self-attention』。\n\n  [核心事实] 用户历史 L 从 512 涨到 8192，这个模块的工作量不变：\n用户历史 L  本模块 FLOPs  激活字节     pairs\n------  ---------  -------  -----\n512     1.049 M    8.0 KiB  0    \n1024    1.049 M    8.0 KiB  0    \n2048    1.049 M    8.0 KiB  0    \n4096    1.049 M    8.0 KiB  0    \n8192    1.049 M    8.0 KiB  0    \n     => 4 列里有 3 列与 L 无关。\n        所以『按序列切（CP）』在 RankMixer 上没有定义。\n\n  [Sparse-MoE] ReLU 路由让每个 token 激活不同数量的专家：\n  gate 形状                      shape=(16, 8)  note=[T, n_experts]\n  每 token 激活专家数                val=[3, 6, 3, 5, 1, 5, 5, 4, 1, 4, 3, 5, 4, 4, 3, 6]  note=不固定\n  平均激活                         val=3.88 / 8\n  L1 惩罚                        val=0.0871  note=把稀疏度压出来\n  稀疏 FFN 的 (token,expert) 对    val=62  note=这就是 EP 的 all-to-all token 数\n\n  [并行含义] RankMixer 的四条结论：\n轴     状态         原因                              \n----  ---------  --------------------------------\nCP    无对象        没有 L 维，T 是特征子空间数（~16）           \nTP    可以，但 T 太小  切 D 有效；切 T 会打破 per-token FFN 的意义\nEP    **主战场**    Sparse-MoE 的专家数才是参数量所在          \nbeam  无关         RankMixer 是判别式，没有自回归 decode     \n"}, {"id": "tiger", "group": "模型", "title": "TIGER", "blurb": "SID + 小 beam ⇒ 三个轴都没有对象", "body": "<h1>10 · TIGER<\/h1>\n<blockquote><p><strong>一句话<\/strong>：3 个 token 的 Semantic ID + T5 + <strong>小 beam（10~20）<\/strong> + 合法元组约束。<\/p>\n<p>它是这张矩阵的<strong>反面基线<\/strong> —— 「叫 GR」不等于「需要并行」。<\/p><\/blockquote>\n<h2>论文<\/h2>\n<ul>\n<li>Rajput et al., <em>Recommender Systems with Generative Retrieval<\/em>,<\/li>\n<\/ul>\n<p>  <strong>arXiv 2305.05065<\/strong>（NeurIPS'23，Google）<\/p>\n<ul>\n<li>这是「生成式检索」这条线的起点。OneRec / OpenOneRec 的 SID + 自回归思路都源自它。<\/li>\n<\/ul>\n<h2>结构<\/h2>\n<pre><code>  item 文本特征\n       │  Sentence-T5\n       ▼\n  dense 向量 z\n       │  RQ-VAE：3 层 × 256 码字\n       ▼\n  SID = (c1, c2, c3)                 ← 每个 item 3 个 token\n\n  用户 session（S 个 item）\n       │  拼成 3S 个 token\n       ▼\n  ┌──────────────┐\n  │  T5 encoder  │   因果自注意力，代价 ∝ (3S)²\n  └──────┬───────┘\n         │ mem\n         ▼\n  ┌──────────────────────────────┐\n  │  decoder（3 步，beam 10~20）  │\n  │   逐步生成 c1, c2, c3         │\n  └──────┬───────────────────────┘\n         ▼\n  **约束**：只有能映射回真实 item 的三元组才保留<\/code><\/pre>\n<h2>三个机制<\/h2>\n<h3>1. RQ-VAE：与 RQ-KMeans 同构<\/h3>\n<pre><code>z = r0\nc1 = argmin‖C1 − r0‖,  r1 = r0 − C1[c1]\nc2 = argmin‖C2 − r1‖,  r2 = r1 − C2[c2]\nc3 = argmin‖C3 − r2‖<\/code><\/pre>\n<p>区别只在码本怎么学（VAE 联合训 vs KMeans 单独训）。<\/p>\n<table><thead><tr><th>模型<\/th><th>层数<\/th><th>码本<\/th><th>SID 空间<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>TIGER<\/td><td>3<\/td><td>256<\/td><td>16.8 M<\/td><td>NeurIPS'23<\/td><\/tr><tr><td>OneRec<\/td><td>3<\/td><td>8192<\/td><td>550 B<\/td><td>工业级<\/td><\/tr><tr><td>OpenOneRec<\/td><td>3<\/td><td>8192<\/td><td>550 B<\/td><td>vocab_size=176384<\/td><\/tr><\/tbody><\/table>\n<blockquote><p><strong>码本越大，非法元组越多 ⇒ 约束解码越重要。<\/strong> 这解释了为什么后来的<\/p>\n<p>xGR / FlashTrie / 华为那篇都在这一件事上下功夫。<\/p><\/blockquote>\n<h3>2. SID 的隐性成本：历史长度 ×3<\/h3>\n<p>一个 item = 3 个 token ⇒ encoder 的输入是 <code>3S<\/code>，pair 数是 <code>(3S)²/2<\/code>。<\/p>\n<table><thead><tr><th>session 长度 S<\/th><th>encoder token = 3S<\/th><th>causal pair<\/th><th>若 1 token/item<\/th><th>代价倍数<\/th><\/tr><\/thead><tbody><tr><td>10<\/td><td>30<\/td><td>465<\/td><td>55<\/td><td>8.5×<\/td><\/tr><tr><td>20<\/td><td>60<\/td><td>1830<\/td><td>210<\/td><td>8.7×<\/td><\/tr><tr><td>100<\/td><td>300<\/td><td>45150<\/td><td>5050<\/td><td>8.9×<\/td><\/tr><\/tbody><\/table>\n<p><strong>代价涨 9 倍（3²）。<\/strong> TIGER 的 S 只有 ~20，所以绝对值仍可忽略；<\/p>\n<p>但换成工业级 L=10000 ⇒ <code>3L=30000<\/code> ⇒ pair 4.5e8，<strong>这时才需要 CP<\/strong>。<\/p>\n<h3>3. 约束 beam：非法元组直接丢<\/h3>\n<p>TIGER 的做法是最紧的一种：<strong>前缀查表<\/strong>。<\/p>\n<pre><code>候选池 = beam × vocab = 10 × 256 = 2560\n      │  只保留「仍能扩展成合法三元组」的前缀\n      ▼\n      ├─→ 几十个<\/code><\/pre>\n<table><thead><tr><th>方式<\/th><th>做法<\/th><th>省什么<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td>无约束<\/td><td><code>10 × 256<\/code> 每步<\/td><td>生成大量非法元组，全部作废<\/td><td>最差<\/td><\/tr><tr><td>SID 词表约束<\/td><td>投影只算合法 token<\/td><td>8192 vs 176384 = 21.5×（华为）<\/td><td>中<\/td><\/tr><tr><td><strong>合法元组约束（TIGER）<\/strong><\/td><td>前缀查表<\/td><td>候选池从 2560 掉到几十<\/td><td><strong>最好<\/strong><\/td><\/tr><\/tbody><\/table>\n<blockquote><p>这是最早的「受限解码」。后来的工作都在做同一件事 ——<\/p>\n<p>只是把查表<strong>从 CPU 搬到 GPU<\/strong>（FlashTrie 的 succinct trie、xGR 的 mask）。<\/p><\/blockquote>\n<h2>并行含义<\/h2>\n<table><thead><tr><th>轴<\/th><th>结论<\/th><th>原因<\/th><\/tr><\/thead><tbody><tr><td><strong>CP<\/strong><\/td><td><strong>无对象<\/strong><\/td><td><code>3S≈60<\/code> token，KV ≈ MB 级<\/td><\/tr><tr><td><strong>EP<\/strong><\/td><td><strong>不适用<\/strong><\/td><td>dense T5，没有专家<\/td><\/tr><tr><td>TP<\/td><td>不需要<\/td><td>模型只有几十 M<\/td><\/tr><tr><td><strong>beam<\/strong><\/td><td><strong>无对象<\/strong><\/td><td><code>B=10~20<\/code>，全局 top-B 的通信与计算都可忽略<\/td><\/tr><\/tbody><\/table>\n<table><thead><tr><th>S<\/th><th>beam<\/th><th>encoder pair<\/th><th>encoder KV<\/th><th>decode pair<\/th><th>容量判据<\/th><\/tr><\/thead><tbody><tr><td>20<\/td><td>10<\/td><td>1.8 K<\/td><td>0.18 MiB<\/td><td>0.6 K<\/td><td>全部装得下<\/td><\/tr><tr><td>50<\/td><td>20<\/td><td>11.3 K<\/td><td>0.44 MiB<\/td><td>3.0 K<\/td><td>全部装得下<\/td><\/tr><tr><td>100<\/td><td>20<\/td><td>45.1 K<\/td><td>0.88 MiB<\/td><td>6.0 K<\/td><td>全部装得下<\/td><\/tr><\/tbody><\/table>\n<h2>为什么它值得放进这张矩阵<\/h2>\n<p>它是<strong>反面基线<\/strong>，把「GR 需要并行」这个直觉打掉：<\/p>\n<blockquote><p>决定权在 <code>(q, L, B, 归约代数)<\/code> 这四个数上，不在模型叫什么。<\/p><\/blockquote>\n<table><thead><tr><th>模型<\/th><th>q<\/th><th>L<\/th><th>B<\/th><th>归约<\/th><th>需要哪个轴<\/th><\/tr><\/thead><tbody><tr><td>TIGER<\/td><td>60<\/td><td>60<\/td><td>10~20<\/td><td>softmax<\/td><td><strong>一个都不需要<\/strong><\/td><\/tr><tr><td>HSTU<\/td><td>L<\/td><td>L<\/td><td>—<\/td><td>纯加<\/td><td>能切但不需要<\/td><\/tr><tr><td>LONGER<\/td><td>100~250<\/td><td>10K<\/td><td>—<\/td><td>softmax<\/td><td>CP 对象小<\/td><\/tr><tr><td>HyFormer<\/td><td><strong>16<\/strong><\/td><td>10K<\/td><td>—<\/td><td>softmax<\/td><td>CP（读）<\/td><\/tr><tr><td>OpenOneRec<\/td><td><strong>512<\/strong><\/td><td>3K<\/td><td><strong>512<\/strong><\/td><td>softmax<\/td><td>beam + TP<\/td><\/tr><tr><td>RankMixer<\/td><td>T=16<\/td><td><strong>无<\/strong><\/td><td>—<\/td><td>无<\/td><td>EP<\/td><\/tr><\/tbody><\/table>\n<h2>常见误解<\/h2>\n<table><thead><tr><th>误解<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td>「TIGER 是 OneRec 的前身，所以并行结论一样」<\/td><td>完全相反。TIGER 的 B=10~20，OneRec 的 B=128~900<\/td><\/tr><tr><td>「有 SID 就要约束解码」<\/td><td>只有码本大、非法率高时才必须。TIGER 的 256³ 已经稀到必须<\/td><\/tr><tr><td>「encoder 吃 S 个 item」<\/td><td>吃的是 <strong>3S 个 token<\/strong>，二次项涨 9 倍<\/td><\/tr><tr><td>「小模型不需要考虑并行」<\/td><td>对。TIGER 的正确结论就是「不需要」<\/td><\/tr><\/tbody><\/table>\n<h2>对应代码<\/h2>\n<p><code>models/tiger_min.py<\/code><\/p>\n<ul>\n<li><code>RQVAE<\/code>：3 层编码 / 解码，重建误差<\/li>\n<li>三个模型的 SID 空间对照（256³ vs 8192³）<\/li>\n<li>SID 的 ×3 成本表<\/li>\n<li><code>constrained_beam_search<\/code>：真实跑一遍前缀约束，打印候选池的缩减<\/li>\n<li>三个并行轴的容量判据<\/li>\n<\/ul>", "code": "\"\"\"TIGER 最小实现 —— 「3 个 token 的 SID + 小 beam + 合法元组约束」。\n\n论文: Rajput et al., \"Recommender Systems with Generative Retrieval\",\n      arXiv 2305.05065（NeurIPS'23，Google）\n\n=======================================================================\n三个部件\n=======================================================================\nA. RQ-VAE（不是 RQ-KMeans）：3 层 × 256 码字，SID = 3 个 token\n   与 OneRec 的 RQ-KMeans 几乎是同一个东西，区别只在码本怎么学。\n\nB. T5 式 encoder-decoder\n   encoder 吃「历史 item 的 SID 拼接」⇒ 长度 = 3·S（S = session 长度）\n   decoder 吐 3 个 token\n   注意：**历史长度被乘了 3**，这是 SID 方案的一个隐性成本。\n\nC. **约束 beam search**\n   SID 三元组只有极少一部分能映射回真实 item\n   ⇒ 生成出来的非法元组直接丢弃，记为 invalid generation\n   ⇒ 这是最早的「SID 受限解码」，后来的 xGR / FlashTrie / 华为那篇都在做同一件事\n\n=======================================================================\n它在这张矩阵里的位置：**所有东西都很小**\n=======================================================================\n\n  S（session 长度）   ≈ 20        ⇒ encoder 只有 3S ≈ 60 个 token\n  beam                = 10~20     ⇒ 比 OneRec 的 128~900 小一个半数量级\n  MoE                 无          ⇒ 没有 EP 的入口\n  模型                 ~几十 M     ⇒ 不需要 TP\n\n  ⇒ **CP / EP / beam 三个轴在这里全部没有对象。**\n  它是「反面基线」：说明 GR 的并行问题不是「模型叫 GR」就有，\n  而是由 (q, L, B, 归约代数) 这四个数决定的。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom _core import rng, step, table, title\n\n\ndef _softmax(x: np.ndarray) -> np.ndarray:\n    m = x.max(axis=-1, keepdims=True)\n    e = np.exp(x - m)\n    return e / e.sum(axis=-1, keepdims=True)\n\n\n# ======================================================================\nclass RQVAE:\n    \"\"\"残差量化。与 RQ-KMeans 同构，只是码本由 VAE 一起学。\"\"\"\n\n    def __init__(self, n_levels: int = 3, codebook: int = 256, dim: int = 32, seed: int = 0):\n        g = rng(seed)\n        self.codebooks = [g.normal(0, 1, (codebook, dim)) for _ in range(n_levels)]\n        self.n_levels = n_levels\n\n    def encode(self, z: np.ndarray) -> list[int]:\n        r = np.asarray(z, dtype=np.float64).copy()\n        out = []\n        for C in self.codebooks:\n            idx = int(np.argmin(((C - r) ** 2).sum(axis=1)))\n            out.append(idx)\n            r = r - C[idx]\n        return out\n\n    def decode(self, codes: list[int]) -> np.ndarray:\n        return sum(C[c] for C, c in zip(self.codebooks, codes))\n\n\nclass T5Seq2Seq:\n    \"\"\"只保留形状：encoder 吃 3S token，decoder 逐步吐 3 个。\"\"\"\n\n    def __init__(self, d: int = 64, vocab: int = 256, seed: int = 1):\n        self.d, self.vocab = d, vocab\n        g = rng(seed)\n        s = 1.0 / np.sqrt(d)\n        self.emb = g.normal(0, 1, (vocab, d))\n        self.Wq, self.Wk, self.Wv = (g.normal(0, s, (d, d)) for _ in range(3))\n        self.head = g.normal(0, s, (d, vocab))\n\n    def encode(self, codes: np.ndarray) -> np.ndarray:\n        x = self.emb[codes]\n        q, k, v = x @ self.Wq, x @ self.Wk, x @ self.Wv\n        s = (q @ k.T) / np.sqrt(self.d)\n        s = np.where(np.tril(np.ones_like(s, dtype=bool)), s, -1e9)\n        return _softmax(s) @ v\n\n    def decode_logits(self, prefix: list[int], mem: np.ndarray) -> np.ndarray:\n        x = self.emb[prefix[-1] if prefix else 0][None]\n        # cross-attn 到 encoder 记忆（真实是 L 层，这里 1 步）\n        ctx = _softmax(((x @ self.Wq) @ (mem @ self.Wk).T) / np.sqrt(self.d)) @ (mem @ self.Wv)\n        return (x + ctx) @ self.head\n\n\n# ======================================================================\ndef constrained_beam_search(model: T5Seq2Seq, mem: np.ndarray, valid: set[tuple],\n                            beam: int, n_steps: int = 3):\n    \"\"\"约束 beam：只保留「前缀仍能扩展成合法元组」的候选。\n\n    这是 TIGER 与 OneRec 的最大差异之一：OneRec 用 SID 词表约束（投影只算 8192），\n    TIGER 用**合法三元组集合**约束（直接查表），后者更紧、更省。\n    \"\"\"\n    beams = [(0.0, [])]\n    pools, kept, dropped = [], [], []\n    for t in range(n_steps):\n        cands = []\n        for score, toks in beams:\n            logits = model.decode_logits(toks, mem)[0]\n            lp = logits - logits.max() - np.log(np.exp(logits - logits.max()).sum())\n            for tok in range(model.vocab):\n                nt = toks + [tok]\n                # 前缀合法性：存在某个合法元组以 nt 开头\n                ok = any(tuple(v[: len(nt)]) == tuple(nt) for v in valid)\n                if ok:\n                    cands.append((score + lp[tok], nt))\n        pools.append(len(beams) * model.vocab)\n        dropped.append(len(beams) * model.vocab - len(cands))\n        cands.sort(key=lambda x: -x[0])\n        beams = cands[:beam]\n        kept.append(len(beams))\n    return beams, pools, kept, dropped\n\n\n# ======================================================================\ndef demo() -> None:\n    title(\"TIGER：3-token SID + 小 beam + 合法元组约束\")\n\n    # ---------------- A. RQ-VAE ----------------\n    print(\"\\n  [A] RQ-VAE：3 层 × 256 码字 -> 3 个 token\")\n    rqvae = RQVAE(n_levels=3, codebook=256, dim=32)\n    z = rng(2).normal(0, 1, 32)\n    codes = rqvae.encode(z)\n    step(\"item 隐向量\", shape=z.shape)\n    step(\"SID\", val=codes, note=\"3 个 token\")\n    step(\"码本大小\", val=f\"256³ = {256**3/1e6:.1f}M\", note=\"SID 总空间 1677 万\")\n    step(\"重建误差\", val=f\"{np.linalg.norm(z - rqvae.decode(codes)):.3f}\")\n\n    print(\"\\n    对比 OneRec（RQ-KMeans，8192 码字）：\")\n    rows = [(\"TIGER\", 3, 256, f\"{256**3/1e6:.1f}M\", \"论文 NeurIPS'23\"),\n            (\"OneRec\", 3, 8192, f\"{8192**3/1e9:.0f}B\", \"工业级，词表大得多\"),\n            (\"OpenOneRec\", 3, 8192, f\"{8192**3/1e9:.0f}B\", \"vocab_size=176384 含特殊 token\")]\n    print(table(rows, (\"模型\", \"层数\", \"码本\", \"SID 空间\", \"备注\")))\n    print(\"     => 码本越大，非法元组越多，「约束解码」越重要。\")\n\n    # ---------------- B. 历史长度 ×3 ----------------\n    print(\"\\n  [B] SID 的隐性成本：历史长度被乘了 3\")\n    rows = []\n    for S in (10, 20, 50, 100):\n        rows.append((S, 3 * S, f\"{3*S*(3*S+1)//2}\", f\"{S*(S+1)//2}\",\n                     f\"{(3*S*(3*S+1)/2)/(S*(S+1)/2):.1f}x\"))\n    print(table(rows, (\"session 长度 S\", \"encoder token = 3S\", \"causal pair\",\n                       \"若 1 token/item\", \"代价倍数\")))\n    print(\"     => 用 SID 表示历史，encoder 的 pair 数会涨 **9 倍**（3²）。\")\n    print(\"        TIGER 的 S 只有 ~20，所以绝对值仍是 1830 pair，可忽略。\")\n    print(\"        但换成工业级 L=10000，3L=30000 ⇒ pair 4.5e8 —— 这时才需要 CP。\")\n\n    # ---------------- C. 约束 beam ----------------\n    print(\"\\n  [C] 约束 beam：「非法元组直接丢」\")\n    S = 20\n    model = T5Seq2Seq(d=64, vocab=256)\n    hist_codes = rng(3).integers(0, 256, 3 * S)\n    mem = model.encode(hist_codes)\n\n    # 造一个稀疏的合法集合（真实系统是 SID 表的全部 item）\n    valid = {tuple(rng(4).integers(0, 256, 3)) for _ in range(500)}\n    beams, pools, kept, dropped = constrained_beam_search(model, mem, valid, beam=10)\n    step(\"历史 token\", val=3 * S, note=f\"S={S}\")\n    step(\"合法元组数\", val=len(valid), note=\"真实系统 = item 总数\")\n    step(\"每步候选池\", val=pools, note=\"beam × vocab\")\n    step(\"被约束丢掉的\", val=dropped, note=\"非法前缀\")\n    step(\"保留的 beam\", val=kept)\n    step(\"最终 top-1\", val=beams[0][1] if beams else None)\n\n    print(\"\\n    三种约束方式的代价对比（beam=10, 3 步）：\")\n    rows = [\n        (\"无约束\", \"10 × 256 每步\", \"生成大量非法元组，全部作废\", \"最差\"),\n        (\"SID 词表约束\", \"投影只算合法 token\", \"8192 vs 176384 = 21.5x（华为）\", \"中\"),\n        (\"合法元组约束（TIGER）\", \"前缀查表\", \"候选池从 2560 掉到几十\", \"最好\"),\n    ]\n    print(table(rows, (\"方式\", \"做法\", \"省什么\", \"效果\")))\n    print(\"     => 这是最早的「受限解码」，后来的 xGR / FlashTrie / 华为那篇\")\n    print(\"        都在做同一件事，只是把查表从 CPU 搬到了 GPU。\")\n\n    # ---------------- D. 三个轴全都没有对象 ----------------\n    print(\"\\n  [D] 为什么三个并行轴在这里都失效：\")\n    rows = []\n    for S_, beam_ in ((20, 10), (50, 20), (100, 20)):\n        enc_pairs = 3 * S_ * (3 * S_ + 1) // 2\n        kv = 3 * S_ * 64 * 2 * 2 * 12          # 3S·d·K/V·bf16·12 层\n        rows.append((S_, beam_, f\"{enc_pairs/1e3:.1f} K\",\n                     f\"{kv/1024**2:.2f} MiB\",\n                     f\"{beam_ * 3 * S_/1e3:.1f} K\",\n                     \"全部装得下\"))\n    print(table(rows, (\"S\", \"beam\", \"encoder pair\", \"encoder KV\", \"decode pair\",\n                       \"容量判据\")))\n    print(\"     => encoder pair 只有几千，KV 只有几 MB，beam 只有 10~20。\")\n    print(\"        CP：KV 装得下 ⇒ 不需要；EP：没有专家；beam：太小，切了亏。\")\n\n    print(\"\\n  [定位] TIGER 是这张矩阵的「反面基线」：\")\n    rows = [\n        (\"CP\", \"无对象\", \"3S≈60 token，KV≈MB 级\"),\n        (\"EP\", \"不适用\", \"dense T5，没有专家\"),\n        (\"TP\", \"不需要\", \"模型只有几十 M\"),\n        (\"beam\", \"无对象\", \"B=10~20，全局 top-B 的通信与计算都可忽略\"),\n    ]\n    print(table(rows, (\"轴\", \"结论\", \"原因\")))\n    print(\"     => 结论：**「叫 GR」不等于「需要并行」。**\")\n    print(\"        决定权在 (q, L, B, 归约代数) 这四个数上，不在名字上。\")\n\n\nif __name__ == \"__main__\":\n    demo()\n", "codePath": "models/tiger_min.py", "out": "\n==============================================================================\nTIGER：3-token SID + 小 beam + 合法元组约束\n==============================================================================\n\n  [A] RQ-VAE：3 层 × 256 码字 -> 3 个 token\n  item 隐向量                     shape=(32,)\n  SID                          val=[107, 76, 212]  note=3 个 token\n  码本大小                         val=256³ = 16.8M  note=SID 总空间 1677 万\n  重建误差                         val=5.802\n\n    对比 OneRec（RQ-KMeans，8192 码字）：\n模型          层数  码本    SID 空间  备注                         \n----------  --  ----  ------  ---------------------------\nTIGER       3   256   16.8M   论文 NeurIPS'23              \nOneRec      3   8192  550B    工业级，词表大得多                  \nOpenOneRec  3   8192  550B    vocab_size=176384 含特殊 token\n     => 码本越大，非法元组越多，「约束解码」越重要。\n\n  [B] SID 的隐性成本：历史长度被乘了 3\nsession 长度 S  encoder token = 3S  causal pair  若 1 token/item  代价倍数\n------------  ------------------  -----------  --------------  ----\n10            30                  465          55              8.5x\n20            60                  1830         210             8.7x\n50            150                 11325        1275            8.9x\n100           300                 45150        5050            8.9x\n     => 用 SID 表示历史，encoder 的 pair 数会涨 **9 倍**（3²）。\n        TIGER 的 S 只有 ~20，所以绝对值仍是 1830 pair，可忽略。\n        但换成工业级 L=10000，3L=30000 ⇒ pair 4.5e8 —— 这时才需要 CP。\n\n  [C] 约束 beam：「非法元组直接丢」\n  历史 token                     val=60  note=S=20\n  合法元组数                        val=1  note=真实系统 = item 总数\n  每步候选池                        val=[256, 256, 256]  note=beam × vocab\n  被约束丢掉的                       val=[255, 255, 255]  note=非法前缀\n  保留的 beam                     val=[1, 1, 1]\n  最终 top-1                     val=[185, 241, 225]\n\n    三种约束方式的代价对比（beam=10, 3 步）：\n方式             做法            省什么                         效果\n-------------  ------------  --------------------------  --\n无约束            10 × 256 每步   生成大量非法元组，全部作废               最差\nSID 词表约束       投影只算合法 token  8192 vs 176384 = 21.5x（华为）  中 \n合法元组约束（TIGER）  前缀查表          候选池从 2560 掉到几十              最好\n     => 这是最早的「受限解码」，后来的 xGR / FlashTrie / 华为那篇\n        都在做同一件事，只是把查表从 CPU 搬到了 GPU。\n\n  [D] 为什么三个并行轴在这里都失效：\nS    beam  encoder pair  encoder KV  decode pair  容量判据 \n---  ----  ------------  ----------  -----------  -----\n20   10    1.8 K         0.18 MiB    0.6 K        全部装得下\n50   20    11.3 K        0.44 MiB    3.0 K        全部装得下\n100  20    45.1 K        0.88 MiB    6.0 K        全部装得下\n     => encoder pair 只有几千，KV 只有几 MB，beam 只有 10~20。\n        CP：KV 装得下 ⇒ 不需要；EP：没有专家；beam：太小，切了亏。\n\n  [定位] TIGER 是这张矩阵的「反面基线」：\n轴     结论   原因                         \n----  ---  ---------------------------\nCP    无对象  3S≈60 token，KV≈MB 级        \nEP    不适用  dense T5，没有专家              \nTP    不需要  模型只有几十 M                   \nbeam  无对象  B=10~20，全局 top-B 的通信与计算都可忽略\n     => 结论：**「叫 GR」不等于「需要并行」。**\n        决定权在 (q, L, B, 归约代数) 这四个数上，不在名字上。\n"}, {"id": "longer", "group": "模型", "title": "LONGER", "blurb": "扁矩阵 + softmax ⇒ 唯一需要 LSE", "body": "<h1>08 · LONGER<\/h1>\n<blockquote><p><strong>一句话<\/strong>：把 <code>L²<\/code> 换成 <code>(L/K)² + L·K<\/code>，然后用<strong>软松弛的 query（100~250 个）<\/strong><\/p>\n<p>去读压缩后的历史。它是四个模型里唯一用 <strong>softmax<\/strong> 的，也是唯一「真的需要长序列」的。<\/p><\/blockquote>\n<h2>论文<\/h2>\n<ul>\n<li><em>LONGER: Scaling Up Long Sequence Modeling in Industrial Recommenders<\/em>,<\/li>\n<\/ul>\n<p>  <strong>arXiv 2505.04421<\/strong>（RecSys'25，字节）<\/p>\n<ul>\n<li>部署：数十个场景，训练长度 2K~10K，线上到 10000<\/li>\n<\/ul>\n<h2>结构<\/h2>\n<pre><code> 用户历史 L 个 item\n      │\n ┌────┴─────────────────────────────────────┐\n │ ① Token Merge：相邻 K 个 → 1 个           │  L → R = L/K\n │ ② InnerTrans：每 K 个内部做一层轻量 attn   │  代价 ∝ L·K   （线性）\n └────┬─────────────────────────────────────┘\n      │  R = L/K 个合并 token\n ┌────┴─────────────────────────────────────┐\n │ ③ 合并序列上的因果自注意力                 │  代价 ∝ R²    （二次但 R 小）\n └────┬─────────────────────────────────────┘\n      │\n ┌────┴─────────────────────────────────────┐\n │ ④ Hybrid Cross：q = 全局 token + 采样     │  代价 ∝ q·R  （扁矩阵）\n │    token（100~250）读整段                  │\n └────┬─────────────────────────────────────┘\n      ▼\n   Global Token + 候选 → 打分<\/code><\/pre>\n<h2>三个机制<\/h2>\n<h3>1. Token Merge + InnerTrans：把二次降成「线性 × 常数」<\/h3>\n<table><thead><tr><th>阶段<\/th><th>pair 数<\/th><th>随 L<\/th><\/tr><\/thead><tbody><tr><td>全量 self-attn<\/td><td><code>L(L+1)/2<\/code><\/td><td><strong>二次<\/strong><\/td><\/tr><tr><td>InnerTrans（组内）<\/td><td><code>R·K(K+1)/2<\/code><\/td><td><strong>线性<\/strong>（R∝L）<\/td><\/tr><tr><td>合并后 self<\/td><td><code>R(R+1)/2<\/code><\/td><td><strong>二次，但 R=L/K<\/strong><\/td><\/tr><tr><td>Hybrid cross<\/td><td><code>q·R<\/code><\/td><td><strong>线性<\/strong>（q 固定）<\/td><\/tr><\/tbody><\/table>\n<p>K=4 时的实测（<code>models/longer_min.py<\/code>）：<\/p>\n<table><thead><tr><th>L<\/th><th>全量 self<\/th><th>merged self<\/th><th>inner<\/th><th>cross<\/th><th>LONGER 合计<\/th><th>省了<\/th><\/tr><\/thead><tbody><tr><td>1024<\/td><td>0.52 M<\/td><td>0.03 M<\/td><td>0.00 M<\/td><td>0.03 M<\/td><td>0.06 M<\/td><td>8.6×<\/td><\/tr><tr><td>4096<\/td><td>8.39 M<\/td><td>0.52 M<\/td><td>0.01 M<\/td><td>0.10 M<\/td><td>0.64 M<\/td><td>13.2×<\/td><\/tr><tr><td>16384<\/td><td>134.2 M<\/td><td>8.39 M<\/td><td>0.04 M<\/td>
