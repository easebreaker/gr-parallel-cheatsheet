己收到的那批行\n\n  4. combine    all-to-all：把结果还回去\n                体积 = b_eff × d × bytes\n\n=======================================================================\n三个必须记住的量（EP 全部分析的起点）\n=======================================================================\n\n  (A) 通信量        V_EP = 2 · B · k · d · bytes\n                    ^^^^^^^^^^^^^^^^^^^^^^^^^^^^\n                    与专家数 E **无关**。加专家只改分片粒度，不改通信量。\n\n  (B) 与 TP 的比值  V_EP / V_TP = k     （TP 一次 all-reduce = 2·B·d）\n                    k=8 时 EP 的通信量是 TP 的 8 倍。这是 EP 的固定成本。\n\n  (C) 每专家行数     rows_per_expert = B·k / E\n                    LLM 低并发 decode: 1×8/256 = 0.03 行 -> GEMM 效率极差\n                    GR    beam  decode: 512×8/64 = 64 行  -> 效率正常\n                    **这就是「beam 是 EP 的天然饲料」。**\n\n=======================================================================\n唯一的结构性风险：路由相关性\n=======================================================================\nbeam 的 B 条假设共享前缀，输入几乎相同 => 它们**路由到同一批专家**。\n负载失衡因此从 1.0x 放大到几倍，而 all-to-all 的完成时间取决于\n最忙的那个目的地（max column sum），不是平均值。\n\n这是 GR 的 EP 与 LLM 的 EP 最关键的区别：\nLLM 的 batch 是「不同请求」，天然分散；\nGR 的 batch 是「同一请求的不同假设」，天然聚拢。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom _core import rng, step, table, title\n\n\n# ======================================================================\nclass MoELayer:\n    def __init__(self, d: int = 64, n_experts: int = 8, top_k: int = 2, n_ranks: int = 4):\n        self.d, self.E, self.k, self.N = d, n_experts, top_k, n_ranks\n        assert n_experts % n_ranks == 0\n        self.experts_per_rank = n_experts // n_ranks\n        g = rng(0)\n        s = 1.0 / np.sqrt(d)\n        self.Wg = g.normal(0, s, (d, n_experts))\n        self.W1 = [g.normal(0, s, (d, 4 * d)) for _ in range(n_experts)]\n        self.W2 = [g.normal(0, s, (4 * d, d)) for _ in range(n_experts)]\n\n    # ------------------------------------------------------------------\n    def route(self, x: np.ndarray):\n        \"\"\"返回 (top-k 专家下标, 门控权重)，形状都是 [n_tokens, k]。\"\"\"\n        logits = x @ self.Wg\n        idx = np.argsort(-logits, axis=1)[:, : self.k]\n        w = np.take_along_axis(logits, idx, axis=1)\n        return idx, np.maximum(w, 0.0)              # ReLU 门\n\n    def owner(self, expert: int) -> int:\n        return expert // self.experts_per_rank\n\n    # ------------------------------------------------------------------\n    def forward_ep(self, x: np.ndarray):\n        \"\"\"完整四步。x 是【本 rank】那批 token（例如一个请求的全部 beam）。\"\"\"\n        n = x.shape[0]\n        idx, w = self.route(x)                       # [n, k]\n\n        # ---- 2. dispatch：按目的地 rank 分桶 ----\n        inbox = {r: [] for r in range(self.N)}\n        for t in range(n):\n            for j in range(self.k):\n                e = int(idx[t, j])\n                inbox[self.owner(e)].append((t, e, x[t] * w[t, j]))\n        dispatched = sum(len(v) for v in inbox.values())\n\n        # ---- 3+4. 每个 rank 只算自己持有的专家，结果汇总回 token ----\n        acc = np.zeros_like(x)\n        for r, items in inbox.items():\n            for t, e, val in items:\n                assert self.owner(e) == r, \"dispatch 把 token 发错卡了\"\n                acc[t] += np.maximum(val @ self.W1[e], 0.0) @ self.W2[e]\n\n        return acc, dispatched, inbox\n\n    # ------------------------------------------------------------------\n    def stats(self, x: np.ndarray):\n        idx, _ = self.route(x)\n        load = np.zeros(self.E, dtype=int)\n        for e in idx.reshape(-1):\n            load[e] += 1\n        per_rank = np.array([\n            load[r * self.experts_per_rank:(r + 1) * self.experts_per_rank].sum()\n            for r in range(self.N)\n        ])\n        return load, per_rank\n\n\n# ======================================================================\ndef demo() -> None:\n    title(\"EP：四步、三个量、一个风险\")\n\n    d, E, k, N = 64, 16, 2, 4\n    layer = MoELayer(d=d, n_experts=E, top_k=k, n_ranks=N)\n\n    # ---------------- 四步 ----------------\n    B = 512\n    x = rng(1).normal(0, 1, (B, d))\n    step(\"输入 token\", val=B, note=\"正好等于一个请求的 beam 宽度\")\n    idx, w = layer.route(x)\n    step(\"router 输出\", shape=idx.shape, note=f\"top-{k} of {E}\")\n    step(\"b_eff = B·k\", val=B * k, note=\"dispatch 的对象数\")\n    acc, dispatched, inbox = layer.forward_ep(x)\n    step(\"dispatch 的对数\", val=dispatched)\n    step(\"每个 rank 收到的行数\", val=[len(v) for v in inbox.values()])\n    step(\"输出\", shape=acc.shape)\n\n    # ---------------- 量 A ----------------\n    print(\"\\n  [量 A] 通信量与专家数无关：\")\n    rows = []\n    for EE in (8, 16, 64, 256):\n        v = 2 * B * k * d * 4\n        rows.append((EE, f\"{v / 1024:.0f} KiB\", f\"{EE // N} 专家/卡\",\n                     f\"{B * k / EE:.1f}\"))\n    print(table(rows, (\"专家数 E\", \"all-to-all 字节\", \"分片粒度\", \"每专家行数\")))\n    print(\"     => 第 2 列完全不变。加专家只改第 3、4 列。\")\n\n    # ---------------- 量 B ----------------\n    print(\"\\n  [量 B] EP 的通信量是 TP 的 k 倍：\")\n    v_ep = 2 * B * k * d * 4\n    v_tp = 2 * B * d * 4\n    step(\"V_EP\", val=f\"{v_ep / 1024:.0f} KiB\")\n    step(\"V_TP\", val=f\"{v_tp / 1024:.0f} KiB\")\n    step(\"比值\", val=f\"{v_ep / v_tp:.0f}x\", note=\"等于 k，与 B 无关\")\n\n    # ---------------- 量 C ----------------\n    print(\"\\n  [量 C] 每专家行数 = B·k/E（GEMM 效率的真正开关）：\")\n    rows = []\n    for label, BB, EE in ((\"LLM decode B=1\", 1, 256),\n                          (\"LLM batch 32\", 32, 256),\n                          (\"GR beam 128\", 128, 64),\n                          (\"GR beam 512\", 512, 64)):\n        rows.append((label, BB, EE, f\"{BB * k / EE:.2f}\"))\n    print(table(rows, (\"场景\", \"B\", \"E\", \"行/专家\")))\n    print(\"     => 低并发 LLM 的 MoE 是「每个专家算不到 0.1 行」，纯浪费。\")\n    print(\"        GR 即使并发=1，beam 也提供了 512 的 batch。\")\n    print(\"        这是 beam 对 EP 唯一真正的正面作用。\")\n\n    # ---------------- 风险 ----------------\n    print(\"\\n  [风险] beam 的假设互相相似 => 路由聚拢 => 失衡放大：\")\n    base = rng(2).normal(0, 1, d)\n    rows = []\n    for label, noise in ((\"beam（同前缀）\", 0.02), (\"beam（已分叉）\", 0.3),\n                         (\"iid 独立请求\", 1.0)):\n        xx = base[None] + noise * rng(3).normal(0, 1, (B, d))\n        load, per_rank = layer.stats(xx)\n        active = int((load > 0).sum())\n        rows.append((label, f\"{noise}\", f\"{active}/{E}\",\n                     f\"{load.max() / (load.mean() + 1e-9):.1f}x\",\n                     f\"{per_rank.max() / (per_rank.mean() + 1e-9):.2f}x\"))\n    print(table(rows, (\"输入\", \"噪声\", \"激活专家\", \"专家失衡\", \"rank 失衡\")))\n    print(\"     => 同样的 B、同样的模型，只因为输入相似度不同，\")\n    print(\"        专家负载可以差一个量级。而 all-to-all 等的是最忙的那个。\")\n    print(\"        这是 GR 的 EP 与 LLM 的 EP 最关键的区别。\")\n\n    # ---------------- 硬约束 ----------------\n    print(\"\\n  [硬约束] all-to-all 的绝对耗时（12 层 MoE，bf16，d=2048）：\")\n    rows = []\n    for Bv in (128, 512, 900):\n        dd = 2048\n        v = 2 * Bv * k * dd * 2 * 12 / 1e6      # MB\n        rows.append((Bv, f\"{v:.0f} MB\", f\"{v / 200:.1f} ms\", f\"{v / 25:.1f} ms\"))\n    print(table(rows, (\"B\", \"每步总量\", \"卡内 HCCS 200GB/s\", \"跨机 200Gbps\")))\n    print(\"     => 跨机是 4~7 ms 的硬增量，直接压在 20~40 ms 的 TPOT 上（+10~30%）。\")\n    print(\"        卡内 HCCS 只有 0.5 ms。差一个量级。\")\n    print(\"        => GR 的 EP 应留在单机域内（Helix / MegaScale 同结论）。\")\n\n    # ---------------- 定位 ----------------\n    print(\"\\n  [定位] 三个轴各切什么：\")\n    rows = [\n        (\"TP\", \"权重（每层都切）\", \"2·B·d 每层 all-reduce\", \"∝ B，B 大时便宜\"),\n        (\"EP\", \"专家（只切 MoE 层）\", \"2·B·k·d 两次 all-to-all\", \"∝ B，是 TP 的 k 倍\"),\n        (\"CP\", \"序列 / KV\", \"2·(N−1)·L·d (ring)\", \"与 B 无关\"),\n    ]\n    print(table(rows, (\"轴\", \"切什么\", \"通信量\", \"随 B 的走势\")))\n\n\nif __name__ == \"__main__\":\n    demo()\n", "codePath": "parallel/ep_min.py", "out": "\n==============================================================================\nEP：四步、三个量、一个风险\n==============================================================================\n  输入 token                     val=512  note=正好等于一个请求的 beam 宽度\n  router 输出                    shape=(512, 2)  note=top-2 of 16\n  b_eff = B·k                  val=1024  note=dispatch 的对象数\n  dispatch 的对数                 val=1024\n  每个 rank 收到的行数                val=[204, 247, 252, 321]\n  输出                           shape=(512, 64)\n\n  [量 A] 通信量与专家数无关：\n专家数 E  all-to-all 字节  分片粒度     每专家行数\n-----  -------------  -------  -----\n8      512 KiB        2 专家/卡   128.0\n16     512 KiB        4 专家/卡   64.0 \n64     512 KiB        16 专家/卡  16.0 \n256    512 KiB        64 专家/卡  4.0  \n     => 第 2 列完全不变。加专家只改第 3、4 列。\n\n  [量 B] EP 的通信量是 TP 的 k 倍：\n  V_EP                         val=512 KiB\n  V_TP                         val=256 KiB\n  比值                           val=2x  note=等于 k，与 B 无关\n\n  [量 C] 每专家行数 = B·k/E（GEMM 效率的真正开关）：\n场景              B    E    行/专家 \n--------------  ---  ---  -----\nLLM decode B=1  1    256  0.01 \nLLM batch 32    32   256  0.25 \nGR beam 128     128  64   4.00 \nGR beam 512     512  64   16.00\n     => 低并发 LLM 的 MoE 是「每个专家算不到 0.1 行」，纯浪费。\n        GR 即使并发=1，beam 也提供了 512 的 batch。\n        这是 beam 对 EP 唯一真正的正面作用。\n\n  [风险] beam 的假设互相相似 => 路由聚拢 => 失衡放大：\n输入         噪声    激活专家   专家失衡  rank 失衡\n---------  ----  -----  ----  -------\nbeam（同前缀）  0.02  2/16   8.0x  2.00x  \nbeam（已分叉）  0.3   6/16   7.1x  1.82x  \niid 独立请求   1.0   15/16  4.0x  1.59x  \n     => 同样的 B、同样的模型，只因为输入相似度不同，\n        专家负载可以差一个量级。而 all-to-all 等的是最忙的那个。\n        这是 GR 的 EP 与 LLM 的 EP 最关键的区别。\n\n  [硬约束] all-to-all 的绝对耗时（12 层 MoE，bf16，d=2048）：\nB    每步总量    卡内 HCCS 200GB/s  跨机 200Gbps\n---  ------  ---------------  ----------\n128  25 MB   0.1 ms           1.0 ms    \n512  101 MB  0.5 ms           4.0 ms    \n900  177 MB  0.9 ms           7.1 ms    \n     => 跨机是 4~7 ms 的硬增量，直接压在 20~40 ms 的 TPOT 上（+10~30%）。\n        卡内 HCCS 只有 0.5 ms。差一个量级。\n        => GR 的 EP 应留在单机域内（Helix / MegaScale 同结论）。\n\n  [定位] 三个轴各切什么：\n轴   切什么           通信量                    随 B 的走势       \n--  ------------  ---------------------  --------------\nTP  权重（每层都切）      2·B·d 每层 all-reduce    ∝ B，B 大时便宜    \nEP  专家（只切 MoE 层）  2·B·k·d 两次 all-to-all  ∝ B，是 TP 的 k 倍\nCP  序列 / KV       2·(N−1)·L·d (ring)     与 B 无关        \n"}, {"id": "beam", "group": "并行轴", "title": "beam", "blurb": "KV 冗余 / 重排 / host 同步", "body": "<h1>07 · beam（搜索宽度并行 / 执行优化）<\/h1>\n<blockquote><p><strong>一句话<\/strong>：beam 的三次提速分别消掉「KV 冗余读取」「KV 重排」「host 同步」。<\/p>\n<p>但它不是一个高天花板的并行轴 —— 反算出来只有 1.3~2.2×。<\/p><\/blockquote>\n<h2>对应代码<\/h2>\n<table><thead><tr><th>工作<\/th><th>一句话<\/th><th>关键数字<\/th><\/tr><\/thead><tbody><tr><td>PagedAttention (2309.06180)<\/td><td>beam 的 COW 块共享<\/td><td>55% 显存节省<\/td><\/tr><tr><td>Trie-based beam (2502.00085)<\/td><td>前缀树共享 KV<\/td><td>4~8× 显存，2.4× 加速<\/td><\/tr><tr><td>xGR (2512.11529)<\/td><td>xAttention + xBeam + xSchedule<\/td><td>2.89~3.49× 吞吐<\/td><\/tr><tr><td>NVIDIA GR-Inference<\/td><td>ContextKV / BeamKV / BeamPath<\/td><td>1.50~2.53× vs SGLang<\/td><\/tr><tr><td>华为 (2611.23339)<\/td><td>Tree Attn + TorchAir，<strong>910B4 单卡<\/strong><\/td><td><strong>25× vs vLLM<\/strong><\/td><\/tr><tr><td>美团 SLM 引擎<\/td><td>静态 DAG + AOTInductor<\/td><td>P99 70 ms，MFU 41%<\/td><\/tr><tr><td>One Global Beam (2610.06718)<\/td><td>把一个 beam 摊到多卡<\/td><td>少见的「beam 作为分布式轴」<\/td><\/tr><tr><td>FlashTrie (2607.10044)<\/td><td>GPU 约束 beam（trie）<\/td><td>800M ID，&lt;2 ms<\/td><\/tr><\/tbody><\/table>\n<h2>三种摆法<\/h2>\n<pre><code>(0) 朴素：beam 摆 batch 维\n\n    q = [B, d]                      KV = B 份，各 [P+t, d]\n    ┌──────┬──────┬──────┬──────┐\n    │beam0 │beam1 │beam2 │beam3 │   → prompt KV 读 B 遍\n    │ P+t  │ P+t  │ P+t  │ P+t  │\n    └──────┴──────┴──────┴──────┘\n\n(1) Tree Attention：beam 摆序列维\n\n    q = [B, d]                      KV = 1 份，[P + B·t, d]\n    ┌──────────────────────────────┬─────────────────────┐\n    │  prompt (只一份)              │ step0:B │ step1:B  │\n    └──────────────────────────────┴─────────────────────┘\n                     ↑ 掩码限制「每个 token 只看自己的祖先」\n\n(2) 静态 KV + 掩码代替重排\n\n    预分配 [P + B·(N−1)]\n    剪枝时不动 KV，只改掩码<\/code><\/pre>\n<h2>实测正确性与字节账<\/h2>\n<p><code>parallel/beam_min.py<\/code>（B=4, P=8, 3 步）：<\/p>\n<table><thead><tr><th><\/th><th>naive<\/th><th>tree<\/th><\/tr><\/thead><tbody><tr><td>输出<\/td><td>—<\/td><td>与 naive <code>max_err = 1.1e-16<\/code><\/td><\/tr><tr><td>KV 读取<\/td><td>108 行<\/td><td>36 行（<strong>3.0×<\/strong>）<\/td><\/tr><\/tbody><\/table>\n<p>tree attention <strong>不是近似<\/strong>，它只是把同一批 <code>(query, key)<\/code> 对换了个布局。<\/p>\n<p>放大到真实尺寸（B, P=1024, d=2048, 3 步）：<\/p>\n<table><thead><tr><th>B<\/th><th>静态 KV 分配<\/th><th>vLLM 重排（最坏）<\/th><th>树掩码<\/th><th>重排/掩码<\/th><\/tr><\/thead><tbody><tr><td>128<\/td><td>10.0 MiB<\/td><td>1024 MiB<\/td><td>0.17 MiB<\/td><td>5958×<\/td><\/tr><tr><td>512<\/td><td>16.0 MiB<\/td><td>4096 MiB<\/td><td>1.25 MiB<\/td><td>3277×<\/td><\/tr><tr><td>900<\/td><td>22.1 MiB<\/td><td>7200 MiB<\/td><td>3.20 MiB<\/td><td>2253×<\/td><\/tr><\/tbody><\/table>\n<p><strong>掩码比 KV 重排小两三个数量级。<\/strong> 所以「不搬 KV，改掩码」是这一层的全部收益。<\/p>\n<h2>华为那张表（910B4，OpenOneRec-1.7B，L=1024）<\/h2>\n<table><thead><tr><th>方法<\/th><th>BW=128<\/th><th>BW=512<\/th><\/tr><\/thead><tbody><tr><td>vLLM<\/td><td>244.7 ms<\/td><td>1989 ms<\/td><\/tr><tr><td>自研（Tree Attn + TorchAir）<\/td><td><strong>59.1 ms<\/strong><\/td><td><strong>79.0 ms<\/strong><\/td><\/tr><tr><td>加速比<\/td><td>4.1×<\/td><td><strong>25×<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>同一篇里更关键的三个数（用来反解成本律）：<\/p>\n<table><thead><tr><th>BW<\/th><th>TPOT（NPU 时间）<\/th><\/tr><\/thead><tbody><tr><td>128<\/td><td>14.2 ms<\/td><\/tr><tr><td>512<\/td><td>24.0 ms<\/td><\/tr><\/tbody><\/table>\n<p><strong>BW 涨 4×，时间只涨 1.69×。<\/strong><\/p>\n<h2>成本律：t(B) = F + a·B + b·B²<\/h2>\n<p>三项的来源：<\/p>\n<table><thead><tr><th>项<\/th><th>来源<\/th><th>与 B 的关系<\/th><\/tr><\/thead><tbody><tr><td><code>F<\/code><\/td><td>权重读取、prompt KV 读取（<strong>B 个 query 共享一次读取<\/strong>）、launch<\/td><td>常数<\/td><\/tr><tr><td><code>a·B<\/code><\/td><td>QKV 投影、FFN、LM head<\/td><td>线性<\/td><\/tr><tr><td><code>b·B²<\/code><\/td><td>tree 内部 <code>B<\/code> 个 query 对 <code>B·t<\/code> 个新 KV 的交互<\/td><td><strong>二次（beam 独有）<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>用两个公开点反解，取 <code>b ≥ 0<\/code>：<\/p>\n<pre><code>F = 10.93 + 65536·b  ≥ 10.93 ms\n\nB=128 天花板 = 14.2 / 10.93 = 1.30×\nB=512 天花板 = 24.0 / 10.93 = 2.20×<\/code><\/pre>\n<p><strong>这就是「无限张卡也拿不到」的上限。<\/strong><\/p>\n<h3>为什么 F 与 B 无关：关键的一行<\/h3>\n<p>tree attention 下，一次 decode 的 KV 形状是 <code>[P + B·t, d]<\/code>，<\/p>\n<p>而 query 有 <code>B<\/code> 个 ⇒ <strong>同一份 KV 被 B 个 query 共用一次读取<\/strong>。<\/p>\n<pre><code>KV 读取量 ∝ (P + B·t) · d · 层数        没有独立的 B 因子<\/code><\/pre>\n<p>对比 vLLM（beam 摆 batch 维）：<\/p>\n<pre><code>KV 读取量 ∝ B · (P + t) · d · 层数      有 B 因子<\/code><\/pre>\n<p>⇒ vLLM 在 BW 128→512 时从 244 ms 涨到 1989 ms（<strong>8.1×<\/strong>，接近线性），<\/p>\n<p>华为从 59 ms 涨到 79 ms（<strong>1.3×<\/strong>）。<\/p>\n<blockquote><p><strong>华为的 25× 不是把计算做快了，是把 B 从 KV 项里消掉了。<\/strong><\/p><\/blockquote>\n<h2>所以 beam 并行的天花板<\/h2>\n<pre><code>t(B, N) = F + a·B / N    →  N→∞ 时  →  F<\/code><\/pre>\n<p>计算随 N 线性缩，<strong>KV 读取完全不缩<\/strong>。这不是实现问题，是结构问题。<\/p>\n<p>和你 CP 那边「CP 输在不能摊薄」是同一个机制，只是换了变量。<\/p>\n<h2>三层各自消掉什么<\/h2>\n<table><thead><tr><th>手段<\/th><th>消掉的东西<\/th><th>量级<\/th><\/tr><\/thead><tbody><tr><td>Tree Attention<\/td><td>prompt KV 被读 B 遍<\/td><td><strong>B 倍<\/strong><\/td><\/tr><tr><td>静态 KV + 掩码<\/td><td>每步 KV 重排 + PagedAttention 元数据<\/td><td>1~2 个数量级<\/td><\/tr><tr><td>循环展开 + 图<\/td><td>每步一次 host 同步<\/td><td>取决于步数<\/td><\/tr><tr><td>SID 受限解码<\/td><td>在全词表上算 logits<\/td><td>21.5×（8192 vs 176384）<\/td><\/tr><\/tbody><\/table>\n<p><strong>注意顺序<\/strong>：华为那篇的标题就是结论 ——<\/p>\n<p><em>Optimize the Cob, Then the Kernel<\/em>。先把整条流水线理顺，再优化单个 kernel。<\/p>\n<p>他们的 attention kernel 其实<strong>比自研 baseline 慢<\/strong>（4.4 ms vs 3.7 ms），<\/p>\n<p>但因为省掉了 KV 重排，端到端反而持平或更快。<\/p>\n<h2>空白在哪<\/h2>\n<table><thead><tr><th>位置<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>单卡 tree attention / 静态 KV / 图展开<\/td><td><strong>已被占满<\/strong>（华为 2026-11）<\/td><\/tr><tr><td>beam 作为分布式轴（GR）<\/td><td><strong>空白<\/strong>（One Global Beam 只做了组合搜索，不是 DNN）<\/td><\/tr><tr><td>beam × EP 的路由相关性<\/td><td><strong>空白<\/strong><\/td><\/tr><tr><td>beam 的成本律（三项式）<\/td><td><strong>空白<\/strong>（只有 <code>L≈D·f(B)<\/code> 这类口头经验）<\/td><\/tr><tr><td>beam 让 CP 重新有对象（q=B）<\/td><td><strong>空白<\/strong><\/td><\/tr><\/tbody><\/table>\n<h2>常见误解<\/h2>\n<table><thead><tr><th>误解<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td>「beam 越大越慢，线性」<\/td><td>实测 4× beam 只涨 1.69×；二次项在 GR 的 3 步里可能根本不主导<\/td><\/tr><tr><td>「beam 是解码参数，不是并行维」<\/td><td>在 GR 里它是主维度，B 从 128 到 900<\/td><\/tr><tr><td>「多卡能线性加速 beam」<\/td><td>天花板 1.3~2.2×（由 F 决定），加卡不能突破<\/td><\/tr><tr><td>「tree attention 有精度损失」<\/td><td>无。<code>max_err = 1e-16<\/code>，它是精确的布局变换<\/td><\/tr><tr><td>「优化 attention kernel 最有效」<\/td><td>华为的 kernel 更慢但端到端更快 ⇒ 瓶颈不在 kernel<\/td><\/tr><\/tbody><\/table>\n<h2>对应代码<\/h2>\n<p><code>parallel/beam_min.py<\/code><\/p>\n<ul>\n<li>naive vs tree 的数值一致性（<code>1.1e-16<\/code>）<\/li>\n<li>KV 读取行数的 3× 差<\/li>\n<li>静态 KV / 重排 / 掩码的三列字节账<\/li>\n<li>成本律的两点反解与天花板<\/li>\n<li>三层各自消掉什么的总结表<\/li>\n<\/ul>", "code": "\"\"\"beam 的三次提速 —— 每一层都只改一件事。\n\n对应工作: vLLM PagedAttention (COW 共享, 55% 显存)\n          Trie-based beam decoding (arXiv 2502.00085)\n          xGR / NVIDIA GR-Inference（ContextKV + BeamKV + BeamPath）\n          华为 \"Optimize the Cob, Then the Kernel\" (arXiv 2611.23339)\n\n=======================================================================\n同一个 beam search，三种摆法\n=======================================================================\n\n  (0) 朴素：beam 摆在 batch 维\n      Q = [B, d]，KV = 每条 beam 各一份 [P + t, d]\n      => 同一份 prompt KV 被读 B 遍\n\n  (1) Tree Attention：beam 摆在**序列维**\n      把 B 个新 token 拼到 prompt 后面：[P + B·t]\n      用一个树形掩码限制「每个 token 只能看自己的祖先」\n      => prompt KV 只读 1 遍。**这是 25× 的主要来源。**\n\n  (2) 静态 KV + 掩码代替重排\n      预分配 [P + B·(N−1)] 的连续空间，不做 block 管理\n      beam 被剪掉时不做 KV 重排，只更新掩码\n      => 消掉每步的 KV copy 与 PagedAttention 的元数据开销\n\n  (3) 循环展开 + 图\n      3 步 decode 全部塞进一张图，beam 选择留在设备上\n      => 消掉 host 同步（vLLM 每步一次 engine invocation）\n\n=======================================================================\n三层的收益量级（华为 910B4，OpenOneRec-1.7B，L=1024）\n=======================================================================\n    BW=128 : vLLM 244.7 ms -> 59.1 ms   (4.1x)\n    BW=512 : vLLM 1989  ms -> 79.0 ms   (25x)\n    BW 从 128 涨到 512（4x），时间只涨 1.69x（14.2 -> 24.0 ms）\n\n最后一行是最重要的事实：**beam 不是线性成本**。\n把 t(B) = F + a·B + b·B² 拿两个点解，得到 F ≥ 10.93 ms，\n于是「无限卡」时的 Amdahl 上限：\n    B=128: 14.2 / 10.93 = 1.30x\n    B=512: 24.0 / 10.93 = 2.20x\n=> beam 并行不是能效杠杆，它是一个**天花板很低的轴**。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom _core import mib, rng, step, table, title\n\n\n# ======================================================================\ndef _softmax(x: np.ndarray) -> np.ndarray:\n    m = x.max(-1, keepdims=True)\n    e = np.exp(x - m)\n    return e / e.sum(-1, keepdims=True)\n\n\ndef _attn(q, k, v, mask):\n    \"\"\"mask: [nq, nk] bool。标准 softmax attention。\"\"\"\n    s = (q @ k.T) / np.sqrt(q.shape[-1])\n    s = np.where(mask, s, -1e9)\n    return _softmax(s) @ v\n\n\n# ======================================================================\nclass BeamSearch:\n    \"\"\"一个小到能一眼看完的 beam search。\n\n    prompt: [P, d]          每步的 K/V 来自这里\n    parents[t][i]: 第 t 步第 i 条 beam 来自上一步的第几个父 beam\n    \"\"\"\n\n    def __init__(self, P=8, d=8, B=4, vocab=8, steps=3, seed=0):\n        self.P, self.d, self.B, self.V, self.steps = P, d, B, vocab, steps\n        g = rng(seed)\n        self.prompt = g.normal(0, 1, (P, d))\n        self.Wq, self.Wk, self.Wv = (\n            g.normal(0, 1 / np.sqrt(d), (d, d)) for _ in range(3)\n        )\n        self.emb = g.normal(0, 1, (vocab, d))\n        self.head = g.normal(0, 1 / np.sqrt(d), (d, vocab))\n        # 固定一份父指针，保证 naive 与 tree 走同一棵搜索树\n        self.parents = [np.arange(B)]\n        for _ in range(steps - 1):\n            self.parents.append(g.integers(0, B, B))\n\n    # ------------------------------------------------------------------\n    def _path(self, pick: list[int]) -> list[int]:\n        \"\"\"一条 beam 祖先的 (step, beam) 序列。pick[t] = 第 t 步取了哪条。\"\"\"\n        return list(zip(range(len(pick)), pick))\n\n    # ------------------------------------------------------------------\n    def naive_step(self, t: int, tokens: list[list[int]]):\n        \"\"\"(0) 每条 beam 当成独立序列，各算一遍。\"\"\"\n        outs, kv_read = [], 0\n        for b in range(self.B):\n            pk = self._ancestor_tokens(t, tokens, b)\n            kv = np.concatenate([self.prompt, self.emb[pk]], 0)\n            kv_read += kv.shape[0]\n            q = self.emb[tokens[t][b]][None]\n            out = _attn(q @ self.Wq, kv @ self.Wk, kv @ self.Wv,\n                        np.ones((1, kv.shape[0]), dtype=bool))\n            outs.append(out[0])\n        return np.stack(outs), kv_read\n\n    def _ancestor_tokens(self, t: int, tokens: list[list[int]], b: int) -> list[int]:\n        path, cur = [], b\n        for step in range(t, 0, -1):\n            path.append(tokens[step - 1][cur])\n            cur = int(self.parents[step][cur])\n        return list(reversed(path))\n\n    # ------------------------------------------------------------------\n    def tree_step(self, t: int, tokens: list[list[int]]):\n        \"\"\"(1) 一个 buffer + 树掩码，prompt 只读一遍。\"\"\"\n        # buffer 布局：prompt | step0 的 B 个 | step1 的 B 个 | ... | step(t-1) 的 B 个\n        buf = [self.prompt]\n        slot = {}                                  # (step, beam) -> 行号\n        for s in range(t):\n            buf.append(self.emb[tokens[s]])\n            for b in range(self.B):\n                slot[(s, b)] = self.P + s * self.B + b\n        kv = np.concatenate(buf, 0)\n\n        # 掩码：每行只看 prompt + 自己的祖先链\n        nq = self.B\n        mask = np.zeros((nq, kv.shape[0]), dtype=bool)\n        mask[:, : self.P] = True\n        for b in range(self.B):\n            # 祖先链：从第 t 条 beam 回溯\n            cur = b\n            for s in range(t - 1, -1, -1):\n                mask[b, slot[(s, cur)]] = True\n                cur = int(self.parents[s + 1][cur])\n\n        q = self.emb[tokens[t]] @ self.Wq\n        out = _attn(q, kv @ self.Wk, kv @ self.Wv, mask)\n        return out, kv.shape[0], mask\n\n    # ------------------------------------------------------------------\n    def run(self):\n        \"\"\"跑完 steps 步，同时统计两种实现的 KV 读取量。\"\"\"\n        tokens = [[int(rng(9).integers(0, self.V)) for _ in range(self.B)]\n                  for _ in range(self.steps)]\n        naive_kv = tree_kv = 0\n        naive_out = tree_out = None\n        mask_bytes = 0\n        for t in range(self.steps):\n            naive_out, r0 = self.naive_step(t, tokens)\n            tree_out, r1, mask = self.tree_step(t, tokens)\n            naive_kv += r0\n            tree_kv += r1\n            mask_bytes += mask.nbytes\n        return naive_out, tree_out, naive_kv, tree_kv, mask_bytes\n\n\n# ======================================================================\ndef demo() -> None:\n    title(\"beam：三次提速，每一层只改一件事\")\n\n    bs = BeamSearch(P=8, d=8, B=4, vocab=8, steps=3)\n    naive, tree, naive_kv, tree_kv, mask_b = bs.run()\n\n    print(\"\\n  [正确性] 两种摆法必须算出同一个结果：\")\n    step(\"B\", val=bs.B, note=\"先用小尺寸验证，避免数值噪声\")\n    step(\"naive vs tree\", max_err=f\"{np.abs(naive - tree).max():.2e}\",\n         verdict=\"一致\" if np.allclose(naive, tree, atol=1e-12) else \"不一致\")\n    print(\"     => tree attention 不是近似，它是把同一批 (query,key) 对换了个布局。\")\n\n    # ---------------- 三层的字节账 ----------------\n    print(\"\\n  [第一层] KV 读取量（B=4, P=8, 3 步）：\")\n    step(\"naive\", val=f\"{naive_kv} 行\", note=\"每条 beam 各读一遍 prompt\")\n    step(\"tree\", val=f\"{tree_kv} 行\", note=\"prompt 只读一遍\")\n    step(\"比值\", val=f\"{naive_kv / tree_kv:.2f}x\")\n    print(\"     => beam 越大，这个比值越接近 B。这就是 25× 的机制。\")\n\n    print(\"\\n  [第二层] 静态 KV 与『掩码代替重排』：\")\n    rows = []\n    for B in (128, 512, 900):\n        P, d, steps = 1024, 2048, 3\n        kv_alloc = (P + B * (steps - 1)) * d * 2 * 2      # K+V, bf16\n        reorder = B * P * d * 2 * 2                       # 最坏情况整段搬\n        mask = B * (P + B * steps) * 1                    # bool\n        rows.append((B, mib(kv_alloc), mib(reorder), mib(mask),\n                     f\"{reorder / mask:.0f}x\"))\n    print(table(rows, (\"B\", \"静态 KV 分配\", \"vLLM 重排(最坏)\", \"树掩码\", \"重排/掩码\")))\n    print(\"     => 掩码比 KV 重排小两三个数量级。\")\n    print(\"        所以『不搬 KV，改掩码』是这一层收益的全部来源。\")\n\n    print(\"\\n  [第三层] host 同步：vLLM 每步一次 engine invocation：\")\n    print(table([(3, 3, 1), (4, 4, 1), (5, 5, 1)],\n                (\"decode 步数\", \"vLLM 调用次数\", \"展开后\")))\n    print(\"     => 展平成一张图之后，3 步变成 1 次 launch。\")\n    print(\"        这就是为什么『图编译』和『算子融合』的收益比『优化 attention kernel』大。\")\n\n    # ---------------- 成本律 ----------------\n    print(\"\\n  [成本律] t(B) = F + a·B + b·B^2，用公开的两点反解：\")\n    t128, t512 = 14.2, 24.0\n    # 两点三未知：可以严格给出 F 的下界\n    F_min = (512 * t128 - 128 * t512) / (512 - 128)\n    step(\"F 的下界\", val=f\"{F_min:.2f} ms\", note=\"取 b >= 0\")\n    step(\"B=128 天花板\", val=f\"{t128 / F_min:.2f}x\")\n    step(\"B=512 天花板\", val=f\"{t512 / F_min:.2f}x\")\n    print(\"     => 这是『无限张卡也拿不到』的上限。\")\n    print(\"        结论：beam 并行不是能效杠杆，天花板只有 1.3~2.2x。\")\n\n    print(\"\\n  [结论表] 三层各自解决什么：\")\n    rows = [\n        (\"(1) Tree Attention\", \"prompt KV 被读 B 遍\", \"B 倍\"),\n        (\"(2) 静态 KV + 掩码\", \"每步 KV 重排 + PagedAttention 元数据\", \"1~2 个数量级\"),\n        (\"(3) 循环展开 + 图\", \"每步一次 host 同步\", \"取决于步数\"),\n        (\"(4) SID 受限解码\", \"在全词表上算 logits\", \"21.5x（8192 vs 176384）\"),\n    ]\n    print(table(rows, (\"手段\", \"消掉的东西\", \"量级\")))\n\n\nif __name__ == \"__main__\":\n    demo()\n", "codePath": "parallel/beam_min.py", "out": "\n==============================================================================\nbeam：三次提速，每一层只改一件事\n==============================================================================\n\n  [正确性] 两种摆法必须算出同一个结果：\n  B                            val=4  note=先用小尺寸验证，避免数值噪声\n  naive vs tree                max_err=1.11e-16  verdict=一致\n     => tree attention 不是近似，它是把同一批 (query,key) 对换了个布局。\n\n  [第一层] KV 读取量（B=4, P=8, 3 步）：\n  naive                        val=108 行  note=每条 beam 各读一遍 prompt\n  tree                         val=36 行  note=prompt 只读一遍\n  比值                           val=3.00x\n     => beam 越大，这个比值越接近 B。这就是 25× 的机制。\n\n  [第二层] 静态 KV 与『掩码代替重排』：\nB    静态 KV 分配   vLLM 重排(最坏)  树掩码       重排/掩码\n---  ---------  -----------  --------  -----\n128  10.00 MiB  1024.00 MiB  0.17 MiB  5958x\n512  16.00 MiB  4096.00 MiB  1.25 MiB  3277x\n900  22.06 MiB  7200.00 MiB  3.20 MiB  2253x\n     => 掩码比 KV 重排小两三个数量级。\n        所以『不搬 KV，改掩码』是这一层收益的全部来源。\n\n  [第三层] host 同步：vLLM 每步一次 engine invocation：\ndecode 步数  vLLM 调用次数  展开后\n---------  ---------  ---\n3          3          1  \n4          4          1  \n5          5          1  \n     => 展平成一张图之后，3 步变成 1 次 launch。\n        这就是为什么『图编译』和『算子融合』的收益比『优化 attention kernel』大。\n\n  [成本律] t(B) = F + a·B + b·B^2，用公开的两点反解：\n  F 的下界                        val=10.93 ms  note=取 b >= 0\n  B=128 天花板                    val=1.30x\n  B=512 天花板                    val=2.20x\n     => 这是『无限张卡也拿不到』的上限。\n        结论：beam 并行不是能效杠杆，天花板只有 1.3~2.2x。\n\n  [结论表] 三层各自解决什么：\n手段                  消掉的东西                          量级                   \n------------------  -----------------------------  ---------------------\n(1) Tree Attention  prompt KV 被读 B 遍               B 倍                  \n(2) 静态 KV + 掩码      每步 KV 重排 + PagedAttention 元数据  1~2 个数量级             \n(3) 循环展开 + 图        每步一次 host 同步                   取决于步数                \n(4) SID 受限解码        在全词表上算 logits                  21.5x（8192 vs 176384）\n"}, {"id": "mixed", "group": "并行轴", "title": "混合并行", "blurb": "每项只有一个轴能切", "body": "<h1>11 · 混合并行：CP × EP × TP × beam<\/h1>\n<blockquote><p><strong>一句话<\/strong>：每一项成本只有唯一一个轴能切。<\/p>\n<p>所以混合并行不是「把加速比乘起来」，而是「把每一项分别除以它那个轴的度数，再相加」。<\/p><\/blockquote>\n<h2>组织原则<\/h2>\n<table><thead><tr><th>成本项<\/th><th>谁能切<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>prompt KV 读取<\/td><td><strong>CP<\/strong><\/td><td><code>∝ P<\/code><\/td><\/tr><tr><td>prompt attn 计算<\/td><td><strong>CP<\/strong><\/td><td><code>∝ B·P<\/code><\/td><\/tr><tr><td>tree 自注意力（beam 内部）<\/td><td><strong>beam 并行<\/strong><\/td><td><code>∝ B²·t<\/code>，CP 碰不到<\/td><\/tr><tr><td>attention 权重（QKV + o）<\/td><td><strong>TP<\/strong><\/td><td><code>∝ d²<\/code> 的权重<\/td><\/tr><tr><td>FFN / 专家权重<\/td><td><strong>EP<\/strong>（MoE）或 TP<\/td><td><code>∝ d·d_ff<\/code><\/td><\/tr><tr><td>全词表打分<\/td><td><strong>vocab 轴 / 算法<\/strong><\/td><td><code>∝ B·V<\/code><\/td><\/tr><tr><td>launch / norms / beam-path<\/td><td><strong>无<\/strong><\/td><td>融掉或忍着<\/td><\/tr><\/tbody><\/table>\n<p><strong>注意最后一列<\/strong>：没有一行有两个轴。这是全篇最有用的一条结构事实。<\/p>\n<h2>锚点分解<\/h2>\n<p>OpenOneRec-1.7B（dense），B=512，L=1024，单卡 910B4，按华为<\/p>\n<p>arXiv 2611.23339 的逐算子分解归并（总和 24.69 ms，与 TPOT 24.0 吻合）：<\/p>\n<table><thead><tr><th>成本项<\/th><th>轴<\/th><th>ms/step<\/th><th>占比<\/th><\/tr><\/thead><tbody><tr><td>prompt_attn<\/td><td>CP<\/td><td>3.72<\/td><td>15.1%<\/td><\/tr><tr><td>tree_attn<\/td><td>beam<\/td><td>3.72<\/td><td>15.1%<\/td><\/tr><tr><td>attn_weights<\/td><td>TP<\/td><td>6.11<\/td><td>24.7%<\/td><\/tr><tr><td>ffn<\/td><td>EP<\/td><td>9.26<\/td><td>37.5%<\/td><\/tr><tr><td>scoring<\/td><td>vocab<\/td><td>0.50<\/td><td>2.0%<\/td><\/tr><tr><td>fixed<\/td><td>none<\/td><td>1.38<\/td><td>5.6%<\/td><\/tr><\/tbody><\/table>\n<h2>结论 1：单轴的天花板由占比决定，与度数无关<\/h2>\n<table><thead><tr><th>轴<\/th><th>负责的占比<\/th><th>开到 4 时<\/th><th>无限卡上限<\/th><\/tr><\/thead><tbody><tr><td>CP<\/td><td>15.1%<\/td><td>1.13×<\/td><td>1.18×<\/td><\/tr><tr><td>TP<\/td><td>24.7%<\/td><td>1.23×<\/td><td>1.33×<\/td><\/tr><tr><td>EP<\/td><td>37.5%<\/td><td>1.39×<\/td><td>1.60×<\/td><\/tr><tr><td>beam<\/td><td>15.1%<\/td><td>1.13×<\/td><td>1.18×<\/td><\/tr><tr><td>vocab<\/td><td>2.0%<\/td><td>1.02×<\/td><td>1.02×<\/td><\/tr><\/tbody><\/table>\n<p>上限是 <code>1/(1-占比)<\/code>。<strong>推到 ∞ 也只有这么多。<\/strong><\/p>\n<h2>结论 2：混合不是乘积（而且乘积会低估）<\/h2>\n<p><code>t_mixed = Σ f_i / n_i<\/code>，<code>speedup = 1 / Σ(f_i/n_i)<\/code>。<\/p>\n<p>四个轴各自开到 4：<\/p>\n<table><thead><tr><th>轴<\/th><th>单独<\/th><\/tr><\/thead><tbody><tr><td>CP<\/td><td>1.127×<\/td><\/tr><tr><td>TP<\/td><td>1.228×<\/td><\/tr><tr><td>EP<\/td><td>1.391×<\/td><\/tr><tr><td>beam<\/td><td>1.127×<\/td><\/tr><\/tbody><\/table>\n<ul>\n<li>乘积公式：<strong>2.172×<\/strong> ← 错<\/li>\n<li>逐项相除：<strong>3.256×<\/strong> ← 对<\/li>\n<\/ul>\n<blockquote><p>乘积<strong>低估<\/strong>了 50%。因为单轴加速比里已经含了「不受影响的那部分」，<\/p>\n<p>乘起来就把那些部分重复计算了多次。<\/p>\n<p>反过来，「加卡数 × 单位加速」这种直觉也会错得离谱。<\/p><\/blockquote>\n<h3>为什么<\/h3>\n<pre><code>两个各占 50% 的项，各自 2×：\n  真实   = 1/(0.25 + 0.25) = 2.00×\n  乘积   = (1/0.75)² = 1.78×   ← 重复计数了「不受影响」的那一半<\/code><\/pre>\n<h2>结论 3：通信会把理想值吃掉一大半<\/h2>\n<p>B=512，d=2048，28 层，top-8，全部按单机 HCCS 200 GB/s：<\/p>\n<table><thead><tr><th>配置<\/th><th>理想加速<\/th><th>理想时间<\/th><th>通信<\/th><th>CP/EP/TP/beam<\/th><th>实际加速<\/th><\/tr><\/thead><tbody><tr><td>CP=4<\/td><td>1.13×<\/td><td>21.9 ms<\/td><td>1.17 ms<\/td><td>1.17/0/0/0<\/td><td>1.07×<\/td><\/tr><tr><td>TP=4<\/td><td>1.23×<\/td><td>20.1 ms<\/td><td>2.35 ms<\/td><td>0/0/2.35/0<\/td><td>1.10×<\/td><\/tr><tr><td>EP=4<\/td><td>1.39×<\/td><td>17.7 ms<\/td><td>4.70 ms<\/td><td>0/4.70/0/0<\/td><td>1.10×<\/td><\/tr><tr><td>CP+EP<\/td><td>1.65×<\/td><td>15.0 ms<\/td><td>5.87 ms<\/td><td>1.17/4.70/0/0<\/td><td>1.19×<\/td><\/tr><tr><td>CP+EP+TP<\/td><td>2.38×<\/td><td>10.4 ms<\/td><td>8.22 ms<\/td><td>1.17/4.70/2.35/0<\/td><td>1.33×<\/td><\/tr><tr><td>全 8<\/td><td>5.22×<\/td><td>4.7 ms<\/td><td>8.22 ms<\/td><td>1.17/4.70/2.35/0.002<\/td><td><strong>1.91×<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>三条读数：<\/p>\n<ul>\n<li><strong>EP 和 TP 的通信最大<\/strong>（都 <code>∝ B·d<\/code>，EP 还要乘 k）<\/li>\n<li><strong>CP 的通信很小<\/strong>（只搬 <code>B·d<\/code> 的 LSE，与 P 无关）<\/li>\n<li><strong>beam 的通信可忽略<\/strong>（3 MB 级）—— 全局 top-B 从来不是瓶颈<\/li>\n<\/ul>\n<blockquote><p>「混合并行推到 8 卡能到 5× 」是纯理想；加上通信只有 <strong>1.91×<\/strong>。<\/p><\/blockquote>\n<h2>耦合 1：CP × beam —— CP 切不到 beam 树<\/h2>\n<pre><code>CP 的有效份额 = P / (P + B·t)        t = 已 decode 的步数<\/code><\/pre>\n<table><thead><tr><th>P<\/th><th>B<\/th><th>B·t<\/th><th>可切份额<\/th><\/tr><\/thead><tbody><tr><td>1024<\/td><td>128<\/td><td>256<\/td><td>80%<\/td><\/tr><tr><td>1024<\/td><td>512<\/td><td>1024<\/td><td><strong>50%<\/strong><\/td><\/tr><tr><td>4096<\/td><td>512<\/td><td>1024<\/td><td>80%<\/td><\/tr><tr><td>16384<\/td><td>512<\/td><td>1024<\/td><td>94%<\/td><\/tr><tr><td>65536<\/td><td>512<\/td><td>1024<\/td><td>98%<\/td><\/tr><\/tbody><\/table>\n<blockquote><p><strong>beam 越大，CP 越没用。<\/strong> 因为 tree attention 把 <code>B·t<\/code> 个 KV 塞进了每张卡的<\/p>\n<p>本地序列，这部分 CP 切不到。<\/p>\n<p>反过来说：<strong>宽 beam + 短 prompt 是 CP 最差的场景<\/strong>，而它恰好是 GR 的常态。<\/p><\/blockquote>\n<h2>耦合 2：EP × beam —— 路由相关性打折<\/h2>\n<pre><code>EP 有效度数 = 1 / (ρ + (1-ρ)/G)          ρ = 跨 shard 的路由相关系数<\/code><\/pre>\n<table><thead><tr><th>ρ<\/th><th>G=2<\/th><th>G=4<\/th><th>G=8<\/th><\/tr><\/thead><tbody><tr><td>0.0<\/td><td>2.00×<\/td><td>4.00×<\/td><td>8.00×<\/td><\/tr><tr><td>0.2<\/td><td>1.67×<\/td><td>2.50×<\/td><td>3.33×<\/td><\/tr><tr><td>0.5<\/td><td>1.33×<\/td><td>1.60×<\/td><td>1.78×<\/td><\/tr><tr><td>0.7<\/td><td>1.18×<\/td><td>1.29×<\/td><td>1.36×<\/td><\/tr><tr><td>1.0<\/td><td><strong>1.00×<\/strong><\/td><td><strong>1.00×<\/strong><\/td><td><strong>1.00×<\/strong><\/td><\/tr><\/tbody><\/table>\n<p><strong>ρ=1 时，EP 切多少都是 1.0×。<\/strong> 因为所有 beam 挤在同一批热专家上，<\/p>\n<p>而 all-to-all 等的是最忙的那个目的地（max column sum）。<\/p>\n<p>LLM 的 DP/EP 对应 <code>ρ≈0<\/code>（不同请求天然分散），所以能到 G。<\/p>\n<p><strong>GR 的 beam 是 ρ 的高危区<\/strong> —— 这是 LO/GR 混合并行最需要实测的一个数。<\/p>\n<h2>耦合 3：三个 collective 能不能重叠<\/h2>\n<table><thead><tr><th>做法<\/th><th>重叠方式<\/th><th>通信代价<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td>同一个 rank 组<\/td><td>CP/EP/TP 的 collective 串行<\/td><td><code>Σ 三者<\/code><\/td><td>最简单，最慢<\/td><\/tr><tr><td>分阶段（Helix）<\/td><td>attention 用 CP、FFN 用 EP，同一批卡换角色<\/td><td><code>max(CP, EP)<\/code><\/td><td>要重配置<\/td><\/tr><tr><td>分 rank 组（MegaScale）<\/td><td>attention 节点与 expert 节点分离<\/td><td><code>max + 一次搬运<\/code><\/td><td>要 P2P 传激活<\/td><\/tr><\/tbody><\/table>\n<p><strong>关键约束<\/strong>：GR 只有 <strong>3 步 decode<\/strong>。<\/p>\n<ul>\n<li>Moebius 的运行时切换要 <strong>215~434 ms<\/strong>，比整个 TPOT（24 ms）大一个量级<\/li>\n<li>Helix 的每层重配置摊销不掉<\/li>\n<\/ul>\n<p>⇒ <strong>GR 上只能选固定布局，不能选「自适应切换」。<\/strong><\/p>\n<p>这一条直接砍掉了 LLM serving 里一大类方法。<\/p>\n<h2>结论 4：把所有轴推到 8，剩下的残余是什么<\/h2>\n<table><thead><tr><th>成本项<\/th><th>轴<\/th><th>原占比<\/th><th>度数<\/th><th>切完后占比<\/th><\/tr><\/thead><tbody><tr><td>fixed<\/td><td>none<\/td><td>5.6%<\/td><td>1<\/td><td><strong>5.6%<\/strong><\/td><\/tr><tr><td>ffn<\/td><td>ep<\/td><td>37.5%<\/td><td>8<\/td><td>4.7%<\/td><\/tr><tr><td>attn_weights<\/td><td>tp<\/td><td>24.7%<\/td><td>8<\/td><td>3.1%<\/td><\/tr><tr><td>prompt_attn<\/td><td>cp<\/td><td>15.1%<\/td><td>8<\/td><td>1.9%<\/td><\/tr><tr><td>tree_attn<\/td><td>beam<\/td><td>15.1%<\/td><td>8<\/td><td>1.9%<\/td><\/tr><tr><td>scoring<\/td><td>vocab<\/td><td>2.0%<\/td><td>8<\/td><td>0.3%<\/td><\/tr><tr><td><strong>上限<\/strong><\/td><td><\/td><td><\/td><td><\/td><td><strong>5.75×<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>两条读数：<\/p>\n<ul>\n<li><strong>G=8 时的天花板由「大占比项的 1/G 残余」决定<\/strong>（ffn 4.7% + attn 3.1%），<\/li>\n<\/ul>\n<p>   不是由固定项决定。<\/p>\n<ul>\n<li><strong>fixed 只有 5.6%，但它没有轴<\/strong> —— 只有 G→∞ 时才成为瓶颈。<\/li>\n<\/ul>\n<p>   那时候唯一能做的不是加卡，而是<strong>图编译 + 融合<\/strong>。<\/p>\n<blockquote><p>所以「混合并行」的天花板之外，还剩两块战场：<\/p>\n<p><strong>图编译/融合<\/strong>（砍 fixed）和 <strong>SID 受限解码<\/strong>（砍 scoring）。<\/p>\n<p>这两个都不是并行的战场 —— 但它们恰好是华为那篇 25× 的来源。<\/p><\/blockquote>\n<h2>三条可以照着算的判据<\/h2>\n<table><thead><tr><th>问题<\/th><th>条件<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>CP 值不值得开<\/td><td><code>P/(P+B·t) × f_prompt &gt; f_fixed<\/code><\/td><td>可切份额要大于残余<\/td><\/tr><tr><td>EP 值不值得<\/td><td>先测 <code>ρ<\/code>；<code>ρ &gt; 0.7<\/code> 就别做<\/td><td>相关性是硬门槛<\/td><\/tr><tr><td>混合能不能过 2×<\/td><td><code>Σ_{无主} f_i &lt; 0.5<\/code><\/td><td>固定项 + 打分必须 &lt; 50%<\/td><\/tr><\/tbody><\/table>\n<h2>一张总表：七个模型该用哪几个轴<\/h2>\n<table><thead><tr><th>模型<\/th><th>q<\/th><th>L<\/th><th>B<\/th><th>归约<\/th><th>CP<\/th><th>EP<\/th><th>TP<\/th><th>beam<\/th><\/tr><\/thead><tbody><tr><td>TIGER<\/td><td>60<\/td><td>60<\/td><td>10~20<\/td><td>softmax<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>HSTU<\/td><td>L<\/td><td>L<\/td><td>—<\/td><td>纯加<\/td><td>能切但不需要<\/td><td>MoE 版才有<\/td><td>可以<\/td><td>—<\/td><\/tr><tr><td>MTGR<\/td><td>L<\/td><td>L<\/td><td>—<\/td><td>纯加<\/td><td>有对象（方阵）<\/td><td>有条件<\/td><td>可以<\/td><td>—<\/td><\/tr><tr><td>RankMixer<\/td><td>16<\/td><td>无<\/td><td>—<\/td><td>无<\/td><td>无定义<\/td><td><strong>主战场<\/strong><\/td><td>可以<\/td><td>—<\/td><\/tr><tr><td>LONGER<\/td><td>100~250<\/td><td>10K<\/td><td>—<\/td><td><strong>softmax<\/strong><\/td><td>对象小（1.2~1.3×）<\/td><td>论文未用<\/td><td>可以<\/td><td>—<\/td><\/tr><tr><td>HyFormer<\/td><td><strong>16<\/strong><\/td><td>10K<\/td><td>—<\/td><td>softmax<\/td><td><strong>唯一买延迟的<\/strong><\/td><td>仅 MoE<\/td><td>有用<\/td><td>—<\/td><\/tr><tr><td>OpenOneRec<\/td><td><strong>512<\/strong><\/td><td>3K<\/td><td><strong>512<\/strong><\/td><td>softmax<\/td><td>有对象<\/td><td>闭源版才有<\/td><td>8 卡触顶<\/td><td><strong>主战场<\/strong><\/td><\/tr><\/tbody><\/table>\n<p><strong>读法<\/strong>：先看 <code>q<\/code>（决定 CP 有没有对象），再看 <code>B<\/code>（决定 beam/EP），<\/p>\n<p>再看 <code>归约<\/code>（决定 CP 要不要 LSE），最后看有没有专家（决定 EP）。<\/p>\n<h2>对应代码<\/h2>\n<p><code>parallel/mixed_min.py<\/code><\/p>\n<ul>\n<li>锚点分解（6 项）与单轴天花板<\/li>\n<li>乘积 vs 逐项相除的对照（含反例）<\/li>\n<li>通信侵蚀表（CP/EP/TP/beam 各自的字节与耗时）<\/li>\n<li>耦合 1（<code>P/(P+B·t)<\/code>）、耦合 2（<code>1/(ρ+(1-ρ)/G)<\/code>）、耦合 3（串行 vs 重叠）<\/li>\n<li>全 8 的残余分解与 5.75× 上限<\/li>\n<\/ul>", "code": "\"\"\"混合并行 —— CP × EP × TP × beam 能不能叠加，以及叠加后还剩多少。\n\n=======================================================================\n唯一的组织原则：**每一项成本只有唯一一个轴能切**\n=======================================================================\n                    ┌───────────────┐\n   成本项            │ 谁能让它变小   │\n   ─────────────────┼───────────────┤\n   prompt KV 读取    │ CP            │  ∝ P，切 P\n   prompt attn 计算   │ CP            │  ∝ B·P\n   tree 自注意力      │ beam 并行      │  ∝ B²·t，CP 碰不到\n   attention 权重     │ TP            │  ∝ d² 的权重\n   FFN / 专家权重     │ EP（MoE）或 TP │  ∝ d·d_ff\n   全词表打分         │ vocab 轴 / 算法 │ ∝ B·V\n   launch / norms     │ 无            │  融掉或忍着\n\n  ⇒ 混合并行不是「把几个加速比乘起来」，\n    而是「把每一项分别除以它那个轴的度数，再相加」。\n\n     t_mixed = Σ  f_i / n_i\n     speedup = 1 / Σ (f_i / n_i)          f_i 是各项的占比\n\n=======================================================================\n两个必须记住的反直觉结论\n=======================================================================\n\n(A) **乘积公式是错的，而且会「低估」。**\n    单个轴各自的加速比相乘，会重复计算「不受影响的那部分」。\n    例：两个各占 50% 的项，各自 2× ——\n        真实加速 = 1/(0.25+0.25) = 2.00×\n        乘积公式 = (1/0.75)² = 1.78×   ← 低估\n\n(B) **加卡上限由「切不动的残余」决定，不由最强的那一项决定。**\n    把 CP/EP/TP 都推到 8，剩下的固定项占比多少，上限就是 1/它。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom _core import step, table, title\n\n# ======================================================================\n# 锚点：OpenOneRec-1.7B（dense），B=512，L=1024，910B4 单卡\n# 按华为 arXiv 2611.23339 的 per-step 算子分解，归并成 6 项。\n# 单位：ms/step，总和 ≈ 24.7（与 TPOT 24.0 吻合）\n# ======================================================================\nANCHOR = {\n    # name          : (ms,     owner)\n    \"prompt_attn\": (3.72, \"cp\"),      # KV 读取 + prompt 部分的 attention 计算\n    \"tree_attn\": (3.72, \"beam\"),      # beam 之间树内自注意力（B²·t 项）\n    \"attn_weights\": (6.11, \"tp\"),     # QKV + o 投影\n    \"ffn\": (9.26, \"ep\"),              # FFN（MoE 版就是专家）\n    \"scoring\": (0.50, \"vocab\"),       # B×V 的 logits + top-k\n    \"fixed\": (1.38, \"none\"),          # launch、norms、beam-path 更新\n}\n\nTOTAL = sum(v[0] for v in ANCHOR.values())\n\n\ndef fracs() -> dict[str, float]:\n    return {k: v[0] / TOTAL for k, v in ANCHOR.items()}\n\n\n# ======================================================================\ndef speedup(degrees: dict[str, int], note: str = \"\") -> tuple[float, dict]:\n    \"\"\"按「每一项除以它的轴」算混合加速，并给出残余占比。\"\"\"\n    f = fracs()\n    owned = {k: v[1] for k, v in ANCHOR.items()}\n    acc = 0.0\n    detail = {}\n    for k, fk in f.items():\n        owner = owned[k]\n        n = degrees.get(owner, 1)\n        acc += fk / n\n        detail[k] = (fk, owner, n, fk / n)\n    return 1.0 / acc, detail\n\n\ndef comm_ms(degrees: dict[str, int], B: int, d: int, n_layers: int,\n            top_k: int, P: int) -> dict[str, float]:\n    \"\"\"每一步各轴的通信时间（ms）。全部按单机 HCCS 200 GB/s。\"\"\"\n    BW = 200e9\n    out = {}\n    c = degrees.get(\"cp\", 1)\n    if c > 1:\n        # 每层一次 LSE 合并，搬 B·d；边界两次\n        out[\"CP\"] = 2 * n_layers * B * d * 4 / BW * 1e3\n    e = degrees.get(\"ep\", 1)\n    if e > 1:\n        # dispatch + combine，各搬 B·k·d（bf16）\n        out[\"EP\"] = 2 * n_layers * B * top_k * d * 2 / BW * 1e3\n    t = degrees.get(\"tp\", 1)\n    if t > 1:\n        # 每层两次 all-reduce（attn 输出 + FFN 输出）\n        out[\"TP\"] = 2 * 2 * n_layers * B * d * 4 / BW * 1e3\n    g = degrees.get(\"beam\", 1)\n    if g > 1:\n        # 全局 top-B：B·K·4 字节，3 步\n        out[\"beam\"] = 3 * B * 64 * 4 / BW * 1e3\n    return out\n\n\n# ======================================================================\ndef demo() -> None:\n    title(\"混合并行：每一项只有一个轴能动\")\n\n    f = fracs()\n    rows = [(k, v[1], f\"{v[0]:.2f}\", f\"{f[k]*100:.1f}%\") for k, v in ANCHOR.items()]\n    print(\"\\n  [锚点] OpenOneRec-1.7B(dense), B=512, L=1024, 单卡 910B4\")\n    print(table(rows, (\"成本项\", \"能切它的轴\", \"ms/step\", \"占比\")))\n    step(\"合计\", val=f\"{TOTAL:.2f} ms\", note=\"与 TPOT 24.0 吻合\")\n\n    # ---------------- 单轴 ----------------\n    print(\"\\n  [单轴] 各轴单独开到 4：\")\n    rows = []\n    for ax in (\"cp\", \"tp\", \"ep\", \"beam\", \"vocab\"):\n        sp, _ = speedup({ax: 4})\n        share = f[[k for k, v in ANCHOR.items() if v[1] == ax][0]]\n        rows.append((ax.upper(), f\"{share*100:.1f}%\", f\"{sp:.2f}x\",\n                     f\"{1/(1-share):.2f}x\"))\n    print(table(rows, (\"轴\", \"负责的占比\", \"开到 4 时\", \"无限卡上限\")))\n    print(\"     => 每个轴的加速比上限是 1/(1-占比)，与度数无关。\")\n    print(\"        占比 15% 的轴推到 4 只有 1.13×；推到 ∞ 也只有 1.18×。\")\n\n    # ---------------- 混合：不是乘积 ----------------\n    print(\"\\n  [关键] 混合不是乘积：\")\n    deg_all = {\"cp\": 4, \"tp\": 4, \"ep\": 4, \"beam\": 4}\n    sp_all, detail = speedup(deg_all)\n    single = {}\n    for ax in (\"cp\", \"tp\", \"ep\", \"beam\"):\n        single[ax], _ = speedup({ax: 4})\n    prod = float(np.prod(list(single.values())))\n    rows = [(ax.upper(), f\"{single[ax]:.3f}x\") for ax in (\"cp\", \"tp\", \"ep\", \"beam\")]\n    print(table(rows, (\"轴\", \"单独开到 4\")))\n    step(\"乘积公式（错）\", val=f\"{prod:.3f}x\")\n    step(\"逐项相除（对）\", val=f\"{sp_all:.3f}x\")\n    print(f\"     => 乘积低估了 {(sp_all/prod - 1)*100:.0f}%。原因：\")\n    print(\"        单轴加速比里已经含了「不受影响的那部分」，乘起来就把它们算了多次。\")\n    print(\"        正确的算法是 f_i / n_i 逐项相加。\")\n\n    # ---------------- 通信侵蚀 ----------------\n    print(\"\\n  [代价] 加上通信后，理想值会被侵蚀多少：\")\n    B, d, n_layers, top_k, P = 512, 2048, 28, 8, 1024\n    rows = []\n    for name, deg in (\n        (\"CP=4\", {\"cp\": 4}),\n        (\"TP=4\", {\"tp\": 4}),\n        (\"EP=4\", {\"ep\": 4}),\n        (\"CP+EP\", {\"cp\": 4, \"ep\": 4}),\n        (\"CP+EP+TP\", {\"cp\": 4, \"ep\": 4, \"tp\": 4}),\n        (\"全 8\", {\"cp\": 8, \"ep\": 8, \"tp\": 8, \"beam\": 8}),\n    ):\n        sp, _ = speedup(deg)\n        ideal = TOTAL / sp\n        comm = comm_ms(deg, B, d, n_layers, top_k, P)\n        c_total = sum(comm.values())\n        real = ideal + c_total\n        rows.append((name, f\"{sp:.2f}x\", f\"{ideal:.1f} ms\",\n                     f\"{c_total:.2f} ms\",\n                     f\"{comm.get('CP',0):.2f}/{comm.get('EP',0):.2f}/\"\n                     f\"{comm.get('TP',0):.2f}/{comm.get('beam',0):.3f}\",\n                     f\"{TOTAL/real:.2f}x\"))\n    print(table(rows, (\"配置\", \"理想加速\", \"理想时间\", \"通信\", \"CP/EP/TP/beam\",\n                       \"实际加速\")))\n    print(\"     => 通信里 **EP 和 TP 最大**（都 ∝ B·d），CP 很小（只搬 B·d）。\")\n    print(\"        这正是「EP 贵 k 倍」那条结论在混合场景下的体现。\")\n\n    # ---------------- 耦合 1：CP × beam ----------------\n    print(\"\\n  [耦合 1] CP 只能切 prompt，切不到 beam 树：\")\n    print(\"            CP 的有效份额 = P / (P + B·t)      （t = 已 decode 步数）\")\n    rows = []\n    for P_ in (1024, 4096, 16384, 65536):\n        for Bv in (128, 512):\n            t_ = 2\n            share = P_ / (P_ + Bv * t_)\n            rows.append((P_, Bv, f\"{Bv*t_}\", f\"{share*100:.0f}%\",\n                         f\"{share*15.1/4:.1f}%\"))\n    print(table(rows, (\"P\", \"B\", \"B·t\", \"可切份额\", \"CP=4 后占全步长\")))\n    print(\"     => **beam 越大，CP 越没用。** B=512, t=2, P=1024 时只剩一半可切。\")\n    print(\"        P 到 32K 以上才恢复（>94%）。这与「长 prompt + 宽 beam」的现实吻合。\")\n\n    # ---------------- 耦合 2：EP × beam ----------------\n    print(\"\\n  [耦合 2] beam 的假设互相相似 => 路由聚拢 => EP 打折：\")\n    print(\"            EP 有效度数 = 1 / (ρ + (1-ρ)/G)     ρ = 跨 shard 路由相关性\")\n    rows = []\n    for rho in (0.0, 0.2, 0.5, 0.7, 1.0):\n        r = [f\"{rho:.1f}\"]\n        for G in (2, 4, 8):\n            eff = 1 / (rho + (1 - rho) / G)\n            r.append(f\"{eff:.2f}x\")\n        rows.append(tuple(r))\n    print(table(rows, (\"ρ\", \"G=2\", \"G=4\", \"G=8\")))\n    print(\"     => ρ=1（所有 beam 完全相关）时，EP 切多少都是 1.0×。\")\n    print(\"        LLM 的 DP/EP 对应 ρ≈0，所以能到 G；GR 的 beam 是 ρ 的高危区。\")\n\n    # ---------------- 耦合 3：串行 vs 重叠 ----------------\n    print(\"\\n  [耦合 3] 三个轴的 collective 能不能重叠：\")\n    rows = [\n        (\"同一个 rank 组\", \"CP / EP / TP 的 collective 串行\", \"Σ 三者\", \"最简单，最慢\"),\n        (\"分阶段（Helix）\", \"attention 用 CP、FFN 用 EP，同一批卡换角色\", \"max(CP, EP)\", \"要重配置，3 步摊销不掉\"),\n        (\"分 rank 组（MegaScale）\", \"attention 节点与 expert 节点分离\", \"max + 一次搬运\", \"要 P2P 传激活\"),\n    ]\n    print(table(rows, (\"做法\", \"重叠方式\", \"通信代价\", \"代价\")))\n    print(\"     => GR 只有 3 步 decode，Moebius 那种「运行时切换」要 215~434 ms，\")\n    print(\"        比整个 TPOT 还大一个量级 ⇒ **只能选固定布局**。\")\n\n    # ---------------- 残余 ----------------\n    print(\"\\n  [残余] 把所有轴都推到 8，还剩什么：\")\n    sp, detail = speedup({\"cp\": 8, \"ep\": 8, \"tp\": 8, \"beam\": 8, \"vocab\": 8})\n    rows = []\n    for k, (fk, owner, n, after) in sorted(detail.items(), key=lambda x: -x[1][3]):\n        rows.append((k, owner, f\"{fk*100:.1f}%\", n, f\"{after*100:.1f}%\"))\n    print(table(rows, (\"成本项\", \"轴\", \"原占比\", \"度数\", \"切完后占比\")))\n    step(\"上限\", val=f\"{sp:.2f}x\", note=\"不含通信\")\n    biggest = max((x for x in detail.items() if x[1][1] != \"none\"),\n                  key=lambda x: x[1][3])\n    print(f\"     => 残余最大的是 **{biggest[0]}**（{biggest[1][3]*100:.1f}%），\"\n          f\"它的轴是 {biggest[1][1].upper()}。\")\n    print(\"        fixed（launch/norms）只有 5.6%，但**它没有轴** —— 只有 G→∞ 时才成为瓶颈。\")\n    print(\"        换句话说：G=8 时的天花板由「大占比项的 1/G 残余」决定，\")\n    print(\"        而不是由固定项决定。想再往上，只能去砍 fixed 与 scoring，\")\n    print(\"        那是「图编译 + 融合」和「SID 受限解码」的战场，不是并行的战场。\")\n\n    # ---------------- 三条可直接用的判据 ----------------\n    print(\"\\n  [判据] 三条可以照着算的：\")\n    rows = [\n        (\"值不值得开 CP\", \"P/(P+B·t) × f_prompt > f_fixed\", \"可切份额要大于残余\"),\n        (\"EP 值不值得\", \"ρ < 1 - 1/G + 1/G·(需要的加速)\", \"先测 ρ\"),\n        (\"混合能不能过 2×\", \"Σ_{无主} f_i < 0.5\", \"固定项 + 打分必须 < 50%\"),\n    ]\n    print(table(rows, (\"问题\", \"条件\", \"含义\")))\n\n\nif __name__ == \"__main__\":\n    demo()\n", "codePath": "parallel/mixed_min.py", "out": "\n==============================================================================\n混合并行：每一项只有一个轴能动\n==============================================================================\n\n  [锚点] OpenOneRec-1.7B(dense), B=512, L=1024, 单卡 910B4\n成本项           能切它的轴  ms/step  占比   \n------------  -----  -------  -----\nprompt_attn   cp     3.72     15.1%\ntree_attn     beam   3.72     15.1%\nattn_weights  tp     6.11     24.7%\nffn           ep     9.26     37.5%\nscoring       vocab  0.50     2.0% \nfixed         none   1.38     5.6% \n  合计                           val=24.69 ms  note=与 TPOT 24.0 吻合\n\n  [单轴] 各轴单独开到 4：\n轴      负责的占比  开到 4 时  无限卡上限\n-----  -----  ------  -----\nCP     15.1%  1.13x   1.18x\nTP     24.7%  1.23x   1.33x\nEP     37.5%  1.39x   1.60x\nBEAM   15.1%  1.13x   1.18x\nVOCAB  2.0%   1.02x   1.02x\n     => 每个轴的加速比上限是 1/(1-占比)，与度数无关。\n        占比 15% 的轴推到 4 只有 1.13×；推到 ∞ 也只有 1.18×。\n\n  [关键] 混合不是乘积：\n轴     单独开到 4\n----  ------\nCP    1.127x\nTP    1.228x\nEP    1.391x\nBEAM  1.127x\n  乘积公式（错）                      val=2.172x\n  逐项相除（对）                      val=3.256x\n     => 乘积低估了 50%。原因：\n        单轴加速比里已经含了「不受影响的那部分」，乘起来就把它们算了多次。\n        正确的算法是 f_i / n_i 逐项相加。\n\n  [代价] 加上通信后，理想值会被侵蚀多少：\n配置        理想加速   理想时间     通信       CP/EP/TP/beam         实际加速 \n--------  -----  -------  -------  --------------------  -----\nCP=4      1.13x  21.9 ms  1.17 ms  1.17/0.00/0.00/0.000  1.07x\nTP=4      1.23x  20.1 ms  2.35 ms  0.00/0.00/2.35/0.000  1.10x\nEP=4      1.39x  17.7 ms  4.70 ms  0.00/4.70/0.00/0.000  1.10x\nCP+EP     1.65x  15.0 ms  5.87 ms  1.17/4.70/0.00/0.000  1.19x\nCP+EP+TP  2.38x  10.4 ms  8.22 ms  1.17/4.70/2.35/0.000  1.33x\n全 8       5.22x  4.7 ms   8.22 ms  1.17/4.70/2.35/0.002  1.91x\n     => 通信里 **EP 和 TP 最大**（都 ∝ B·d），CP 很小（只搬 B·d）。\n        这正是「EP 贵 k 倍」那条结论在混合场景下的体现。\n\n  [耦合 1] CP 只能切 prompt，切不到 beam 树：\n            CP 的有效份额 = P / (P + B·t)      （t = 已 decode 步数）\nP      B    B·t   可切份额  CP=4 后占全步长\n-----  ---  ----  ----  ----------\n1024   128  256   80%   3.0%      \n1024   512  1024  50%   1.9%      \n4096   128  256   94%   3.6%      \n4096   512  1024  80%   3.0%      \n16384  128  256   98%   3.7%      \n16384  512  1024  94%   3.6%      \n65536  128  256   100%  3.8%      \n65536  512  1024  98%   3.7%      \n     => **beam 越大，CP 越没用。** B=512, t=2, P=1024 时只剩一半可切。\n        P 到 32K 以上才恢复（>94%）。这与「长 prompt + 宽 beam」的现实吻合。\n\n  [耦合 2] beam 的假设互相相似 => 路由聚拢 => EP 打折：\n            EP 有效度数 = 1 / (ρ + (1-ρ)/G)     ρ = 跨 shard 路由相关性\nρ    G=2    G=4    G=8  \n---  -----  -----  -----\n0.0  2.00x  4.00x  8.00x\n0.2  1.67x  2.50x  3.33x\n0.5  1.33x  1.60x  1.78x\n0.7  1.18x  1.29x  1.36x\n1.0  1.00x  1.00x  1.00x\n     => ρ=1（所有 beam 完全相关）时，EP 切多少都是 1.0×。\n        LLM 的 DP/EP 对应 ρ≈0，所以能到 G；GR 的 beam 是 ρ 的高危区。\n\n  [耦合 3] 三个轴的 collective 能不能重叠：\n做法                   重叠方式                             通信代价         代价          \n-------------------  -------------------------------  -----------  ------------\n同一个 rank 组           CP / EP / TP 的 collective 串行     Σ 三者         最简单，最慢      \n分阶段（Helix）           attention 用 CP、FFN 用 EP，同一批卡换角色  max(CP, EP)  要重配置，3 步摊销不掉\n分 rank 组（MegaScale）  attention 节点与 expert 节点分离        max + 一次搬运   要 P2P 传激活   \n     => GR 只有 3 步 decode，Moebius 那种「运行时切换」要 215~434 ms，\n        比整个 TPOT 还大一个量级 ⇒ **只能选固定布局**。\n\n  [残余] 把所有轴都推到 8，还剩什么：\n成本项           轴      原占比    度数  切完后占比\n------------  -----  -----  --  -----\nfixed         none   5.6%   1   5.6% \nffn           ep     37.5%  8   4.7% \nattn_weights  tp     24.7%  8   3.1% \nprompt_attn   cp     15.1%  8   1.9% \ntree_attn     beam   15.1%  8   1.9% \nscoring       vocab  2.0%   8   0.3% \n  上限                           val=5.75x  note=不含通信\n     => 残余最大的是 **ffn**（4.7%），它的轴是 EP。\n        fixed（launch/norms）只有 5.6%，但**它没有轴** —— 只有 G→∞ 时才成为瓶颈。\n        换句话说：G=8 时的天花板由「大占比项的 1/G 残余」决定，\n        而不是由固定项决定。想再往上，只能去砍 fixed 与 scoring，\n        那是「图编译 + 融合」和「SID 受限解码」的战场，不是并行的战场。\n\n  [判据] 三条可以照着算的：\n问题         条件                              含义              \n---------  ------------------------------  ----------------\n值不值得开 CP   P/(P+B·t) × f_prompt > f_fixed  可切份额要大于残余       \nEP 值不值得    ρ < 1 - 1/G + 1/G·(需要的加速)       先测 ρ            \n混合能不能过 2×  Σ_{无主} f_i < 0.5                固定项 + 打分必须 < 50%\n"}, {"id": "matrix", "group": "交叉", "title": "模型 × 轴 矩阵", "blurb": "点格子跳到对应条目", "body": "", "code": "", "codePath": "", "out": ""}];

/* ---------- 极简 Python 高亮（字符串 -> 注释 -> 关键字） ---------- */
function hl(src){
  const store = [];
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let out = esc(src);
  // 1) 字符串与三引号块（先吃掉，避免里面的 # 被当注释）
  out = out.replace(/("{3}[\s\S]*?"{3}|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')/g, m => {
    store.push('<span class="s">' + m + '</span>');
    return '\u0000' + (store.length - 1) + '\u0001';
  });
  // 2) 注释
  out = out.replace(/(#[^\n]*)/g, m => {
    store.push('<span class="c">' + m + '</span>');
    return '\u0000' + (store.length - 1) + '\u0001';
  });
  // 3) 关键字
  out = out.replace(/\b(def|class|return|if|else|elif|for|in|while|with|as|import|from|not|and|or|None|True|False|assert|raise|try|except|finally|lambda|yield|pass|break|continue|global|self)\b/g,
                   '<span class="k">$1</span>');
  // 4) 还原（可能要两轮：注释里嵌了字符串占位符）
  for(let pass = 0; pass < 3; pass++){
    out = out.replace(/\u0000(\d+)\u0001/g, (_, i) => store[+i]);
  }
  return out;
}

const NAV = {
  '总览': ['map'],
  '模型': ['hstu','mtgr','longer','hyformer','tiger','rankmixer','onerec'],
  '并行轴': ['cp','ep','beam','mixed'],
  '交叉': ['matrix']
};

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  for(const [grp, ids] of Object.entries(NAV)){
    const g = document.createElement('div');
    g.className = 'grp'; g.textContent = grp;
    nav.appendChild(g);
    for(const id of ids){
      const it = DATA.find(d => d.id === id);
      if(!it || !match(it)) continue;
      const d = document.createElement('div');
      d.className = 'item' + (id === current ? ' on' : '');
      d.innerHTML = '<span>'+it.title+'</span><small>'+it.blurb+'</small>';
      d.onclick = () => goto(id);
      nav.appendChild(d);
    }
  }
}

function match(it){
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  if(!q) return true;
  const blob = [it.title, it.blurb, it.body, it.code, it.out].join(' ').toLowerCase();
  return blob.includes(q);
}

let current = null;

function goto(id){
  current = id;
  const it = DATA.find(d => d.id === id);
  const main = document.getElementById('main');
  if(id === 'matrix'){
    main.innerHTML = matrixHTML();
    const tt = document.getElementById('tt');
    if(tt) tt.textContent = '模型 × 并行轴';
    drawer(false);
    renderNav();
    return;
  }
  const tabs = [['doc','说明'],['code','代码'],['out','运行输出']];
  let h = '<div class="head"><h2>'+it.title+'</h2><p class="blurb">'+it.blurb+'</p></div>';
  h += '<div class="tabs">';
  tabs.forEach(([k,label],ix) => {
    if(k === 'code' && !it.code) return;
    if(k === 'out' && !it.out) return;
    h += '<div class="tab'+(ix===0?' on':'')+'" data-k="'+k+'">'+label+'</div>';
  });
  h += '</div>';
  h += '<div class="pane on doc" data-k="doc">'+it.body+'</div>';
  if(it.code){
    h += '<div class="pane" data-k="code">'
       + '<div class="codebar"><span>'+it.codePath+'</span>'
       + '<button onclick="copyCode()">复制</button></div>'
       + '<pre class="src" id="srccode">'+hl(it.code)+'</pre></div>';
  }
  if(it.out){
    h += '<div class="pane" data-k="out">'
       + '<div class="codebar"><span>python3 '+it.codePath.split("/").pop()+' 的真实 stdout</span></div>'
       + '<pre class="src">'+it.out.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre></div>';
  }
  main.innerHTML = h;
  main.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      main.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
      main.querySelectorAll('.pane').forEach(x => x.classList.remove('on'));
      t.classList.add('on');
      main.querySelector('.pane[data-k="'+t.dataset.k+'"]').classList.add('on');
    };
  });
  main.scrollTop = 0;
  window.scrollTo(0,0);
  const tt = document.getElementById('tt');
  if(tt) tt.textContent = it.title;
  drawer(false);
  renderNav();
}

function copyCode(){
  const txt = document.getElementById('srccode').innerText;
  navigator.clipboard && navigator.clipboard.writeText(txt);
}

const MXA = ['模型','CP','EP','TP','beam','一句话'];

function matrixHTML(){
  let h = '<div class="head"><h2>模型 × 并行轴</h2>'
        + '<p class="blurb">点任意格子跳到对应条目。绿色=没有对象，黄色=有条件，蓝色=主战场。</p></div>';
  h += '<table class="mx"><thead><tr>';
  MXA.forEach(a => h += '<th>'+a+'</th>');
  h += '</tr></thead><tbody>';
  MXDATA.forEach((row,ri) => {
    h += '<tr><td class="cell" data-go="'+MXCODE[ri]+'" style="text-align:left"><b>'+row[0]+'</b></td>';
    for(let c=0;c<4;c++){
      const [label,cls] = row[c+1];
      h += '<td class="cell '+cls+'" data-go="'+MXAXIS[c]+'">'+label+'</td>';
    }
    h += '<td style="color:#8b97a7">'+row[5]+'</td></tr>';
  });
  h += '</tbody></table>';
  h += '<p class="legend">'
     + '<b>无对象 / 不需要</b>：可行但没意义（容量或数量太小）　'
     + '<b>无定义 / 不适用</b>：根本没有那一维（RankMixer 没有序列维；dense 模型没有专家）<br>'
     + '<b>有条件</b>：需要附加约束（路由相关性 ρ / GLN 归约轴）　'
     + '<b>主战场</b>：这一维就是模型的主要缩放方向　'
     + '<span style="color:#5ec8d8">点模型名 → 模型页；点格子 → 对应的轴</span></p>';
  return h;
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-go]');
  if(c) goto(c.dataset.go);
});

/* ---------- 窄屏抽屉 ---------- */
function drawer(open){
  document.body.classList.toggle('drawer', open);
}
document.getElementById('burger').addEventListener('click', () => {
  drawer(!document.body.classList.contains('drawer'));
});
document.getElementById('scrim').addEventListener('click', () => drawer(false));

document.getElementById('q').addEventListener('input', renderNav);
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement.id !== 'q'){
    e.preventDefault(); document.getElementById('q').focus();
  }
  if(e.key === 'Escape'){ drawer(false); document.getElementById('q').blur(); }
});

goto('map');
